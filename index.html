/* ---------------------------------------------------------------------
   The notice board
   --------------------------------------------------------------------- */
H.jobLine = (j) => `<b>${H.esc(j.name)}</b><br><span class="dim">${j.type} · <em>${j.label}</em> · ${j.reward} HB${j.pay && !j.pay.advance ? (j.pay.weapon ? ' + a ' + H.WEAPONS[j.pay.weapon].name : j.pay.item ? ' + a ' + H.ITEMS[j.pay.item].name : ' + ammunition') : ''} · from ${H.esc(j.giver)} · ${j.travel}h out · ${Math.max(0, j.expires - H.S.world.day)} day${j.expires - H.S.world.day === 1 ? '' : 's'} left</span>`;
H.scenes.board = {
  art: () => ({ kind: 'town', seed: 'board', caption: 'The notice board' }),
  mood: 'town',
  enter: () => {
    H.log('Notices flap on the board, layer over layer, nailed through. Most are faded past reading. A few are fresh.');
  },
  opts: () => {
    const S = H.S,
      h = S.hunter;
    const o = [];
    const busy = !!S.job;
    for (const j of S.world.board) o.push({ t: H.jobLine(j), dis: busy && 'You already have a job', act: () => H.go('job_offer', { id: j.id, src: 'board' }) });
    if (h.leads.length) {
      o.push({ hdr: 'Word of mouth (from your leads)' });
      for (const j of h.leads) o.push({ t: H.jobLine(j), dis: busy && 'You already have a job', act: () => H.go('job_offer', { id: j.id, src: 'lead' }) });
    }
    o.push({ t: 'Step back into the street.', act: () => H.go('town') });
    return o;
  },
};
H.findJob = (id) => H.S.world.board.concat(H.S.world.ashBoard, H.S.hunter.leads, H.S.hunter.valley.offer ? [H.S.hunter.valley.offer] : []).find((j) => j.id === id);
H.scenes.job_offer = {

    if (j.blurb) H.log(`<q>${j.blurb.replace(/^“|”$/g, '')}</q>`, 'speech');

  },
  opts: (p) => {

    if (!j) return [{ t: 'Back.', act: () => H.backToHub() }];
    return [
      { t: 'Take the job and head out now.', cls: 'good', act: () => H.acceptJob(j, H.S.where === 'ashville' ? 'ashville' : 'wayfarer', true) },
      { t: 'Take the job, but get ready first (shop, rest, then head out from town).', act: () => H.acceptJob(j, H.S.where === 'ashville' ? 'ashville' : 'wayfarer', false) },
      { t: 'Leave it for now.', act: () => H.go(p.src === 'molly' ? 'taptap' : p.src === 'valley' ? 'valley' : 'board') },
    ];

};

/* ---------------------------------------------------------------------
   Shops
   --------------------------------------------------------------------- */
H.stockOf = (shop, item) => {
  const st = H.S.world.stock[shop];
  return st ? st[item] || 0 : 0;
};
H.buyLines = (shopKey, seller) => {
  const o = [];
  const S = H.S,
    h = S.hunter;
  const shop = H.SHOPS[shopKey];
  const sinEaterSighted = !!(S.world.sinEater && S.world.sinEater.status === 'walking');
  for (const item in shop.stock) {
    const qty = H.stockOf(shopKey, item);
    let name, price, act, dis;
    if (H.WEAPONS[item]) {
      const W = H.WEAPONS[item];
      name = `${W.name}`;
      price = H.price(W.price, seller);
      dis = !qty ? 'None today' : !H.canPay(price) ? 'Can\'t afford it' : !H.canCarry(W.wt) ? `Too heavy (Weight ${W.wt})` : false;
      act = () => {
        H.pay(price);
        H.addWeapon(item);
        S.world.stock[shopKey][item]--;
        H.log(`You buy the ${W.name} for ${price} HB. It comes unloaded. <span class="dim">${W.blurb}</span>`, 'sys');
        H.refresh();
      };
      o.push({ t: `${name} <span class="dim">— ${W.dmg}, ${W.er ? W.er + ' m, ' : ''}Wt ${W.wt}</span>`, note: `${price} HB · ${qty} in stock`, dis, act, tip: W.blurb });
    } else if (H.AMMO[item]) {
      const box = H.AMMO_BOX[item];
      price = H.price(box.price, seller);
      const room = H.beltRoom(item);
      dis = !qty ? 'None today' : !H.canPay(price) ? 'Can\'t afford it' : room < 1 ? 'No room on your belt' : false;
      act = () => {
        H.pay(price);
        const n = H.addAmmo(item, box.n);
        S.world.stock[shopKey][item]--;
        H.log(`You buy ${box.n > 1 ? 'a box of ' + box.n : 'a single round of'} ${item} for ${price} HB${n < box.n ? ` — only ${n} fit on your belt; the rest you leave on the counter` : ''}.`, 'sys');
        H.refresh();
      };
      o.push({ t: `${item} <span class="dim">— ${box.n > 1 ? 'box of ' + box.n : 'per round'}</span>`, note: `${price} HB · ${qty} in stock`, dis, act });
    } else {
      const I = H.ITEMS[item];
      if (I.sm) {
        price = I.price;
        dis = !qty ? (S.world.di >= 40 ? 'Gone — the town is too afraid' : 'None today') : h.wallet.sm + h.wallet.gc * 10 < price ? 'Silver only — you need a Silver Mark' : false;
        act = () => {
          H.paySM(price);
          H.addItem(item);
          S.world.stock[shopKey][item]--;
          H.log(`You make your "donation" of ${price} Silver Mark and receive ${I.name.toLowerCase()} in a stoppered glass flask.`, 'sys');
          H.refresh();
        };
        o.push({ t: I.name, note: `${price} SM (silver only) · ${qty} available`, dis, act, tip: I.desc });
        continue;
      }
      let base = I.price;
      if (item === 'dynamite' && sinEaterSighted) base *= 2;
      price = H.price(base, seller, item === 'liquor');
      dis = !qty ? 'None today' : !H.canPay(price) ? 'Can\'t afford it' : false;
      act = () => {
        H.pay(price);
        H.addItem(item);
        S.world.stock[shopKey][item]--;
        H.log(`You buy ${I.name.toLowerCase()} for ${price} HB.`, 'sys');
        H.refresh();
      };
      o.push({ t: `${I.name}${item === 'dynamite' && sinEaterSighted ? ' <span class="bad">(×2 — a Sin Eater has been sighted)</span>' : ''}`, note: `${price} HB · ${qty} in stock`, dis, act, tip: I.desc });
    }
  }
  return o;
};
/* Selling (price IMPROVISED: half of base; Tainted goods can't be sold, §7.9) */
H.sellLines = () => {
  const h = H.S.hunter;
  return h.weapons.map((wp) => {
    const W = H.WEAPONS[wp.key];
    const val = Math.round((W.price * 0.5 * wp.whp) / W.whp);
    return {
      t: `Sell the ${W.name}`,
      note: `${val} HB`,
      dis: wp.tainted ? 'Tainted — nobody will buy it until it\'s cleansed' : h.weapons.length <= 1 ? 'You\'d be unarmed' : false,
      act: () => {
        if (wp.loaded) H.addAmmo(W.ammo, wp.loaded - wp.lq, wp.lq);
        H.removeWeapon(wp.uid);
        H.gain(val);
        H.log(`You sell the ${W.name} for ${val} HB.`, 'sys');
        H.refresh();
      },
    };
  });
};
H.SHOP_TALK = {
  sammy: ['Sammy Lox looks up from a stripped Winfield, a loupe screwed into one eye. "Talk while I work."', 'Sammy Lox sniffs the air as you come in. "You smell like the swamp. Don\'t touch anything."'],
  johnny: ['Johnny Bronco spreads his hands over the counter like a preacher. "Friend! You look like a man who needs more gun."', 'Johnny Bronco is polishing a Sparks that he will tell you, unprompted, can drop a bison at a mile.'],
  bruce: ['Bruce Maxwell nods from behind a wall of tins and rope. "Help yourself. Pay before you leave. Everyone pays."', 'The general store smells of lamp oil, coffee and mouse. Bruce Maxwell is restacking jars of something pickled.'],
};
H.scenes.shop = {
  art: (p) => ({ kind: 'town', seed: 'shop-' + p.k, caption: H.SHOPS[p.k].name }),
  mood: 'town',
  enter: (p) => {

    if (p.k === 'sammy') H.log('<span class="dim">In the window, not for sale: a Dolch 96 (690 HB) and a Nitro Express — "gold, a favor, or banditry." Neither can be fired; nobody makes their ammunition. Sammy sells no pistols.</span>', 'sys');
    if (p.k === 'johnny') H.log(`<span class="dim">On the wall, unstatted curios: ${H.UNSTATTED.join(', ')}. Wall-hangers, Johnny admits.</span>`, 'sys');
  },
  opts: (p) => {
    const h = H.S.hunter;
    const o = [{ hdr: 'Buy' }].concat(H.buyLines(p.k, 'surface'));
    if (p.k === 'sammy') {
      const hurt = h.weapons.filter((w) => w.whp < H.WEAPONS[w.key].whp);
      if (hurt.length) {
        o.push({ hdr: 'Repairs (Weapon HP)' });
        for (const wp of hurt) {
          const W = H.WEAPONS[wp.key];
          const per = wp.tainted ? 7 : 5;
          const pts = W.whp - wp.whp;
          o.push({ t: `Repair the ${W.name} ${wp.whp}/${W.whp} → ${W.whp}`, note: `${per * pts} HB${wp.tainted ? ' (Tainted: +30%, holy water "just in case")' : ''}`, dis: !H.canPay(per * pts) && 'Can\'t afford it', act: () => { H.pay(per * pts); wp.whp = W.whp; H.log(`Sammy works the ${W.name} over and hands it back sound.${wp.tainted ? ' He wipes his hands on a rag soaked in holy water afterward.' : ''} ${H.ref('5.9')}`, 'sys'); H.refresh(); } });
        }
      }
    }
    if (p.k === 'sammy' || p.k === 'johnny') {
      o.push({ hdr: 'Sell' });
      o.push(...H.sellLines());
    }
    o.push({ t: 'Leave.', act: () => H.go('town') });
    return o;
  },
};

   The Bloated Pig

  hive: ['Woman with a wasp nest for a chest. Shrieks and every grunt in a hundred meters comes.', 'Kill her and the swarm dies with her. Fire does her double. Get out of the swarm by putting distance or water between you.', 'Paper body. A heavy blade or a club tears right through her.'],
  immolator: ['Man burning from the inside. Goes for movement.', 'Stand still and it won\'t touch you. Shoot it and it flares up and charges, then blows. Water puts it out. Blades kill it clean.', 'Melee kills don\'t set it off. Remember that.'],
  meathead: ['Headless giant. Blind. Sees through its leeches.', 'Don\'t let the leeches touch you. Don\'t fire a gun near it unless you want it knowing where you are. Cut it — clubs bounce.', 'If it gets a run at you it\'ll put you on your back.'],

  waterdevil: ['Worms. Thousands of \'em, moving like one thing, in still water.', 'Bullets and blades do half of nothing. Fire and explosives work — but a firebomb in water just sinks. Stay three meters back from the edge.', 'A body left in its water a day becomes another one.'],
  bileweaver: ['Dog-sized jumping spiders with shells like crabs. Green mist venom.', 'Nests in empty buildings. Burn the egg sacs from a distance.', 'They climb. High ground won\'t save you.'],
  sineater: ['Ten foot of mud and roots. If you see one, the corruption\'s spreading.', 'Three answers: fire distracts it and makes it forget you; holy water makes it soft for a few breaths; dynamite ends it. Guns alone? A hundred and twenty rounds.', 'Don\'t stop in the water with it. Ever. It\'s twice as fast wet.'],
  butcher: ['A piece of the thing, wearing a butcher\'s apron and a pig\'s head.', 'Fire runs off the apron. Clubs do half. Blades bite. Keep a door between you when you reload.', 'Kill it and it comes back in a few weeks somewhere else. Kill it anyway.'],
};
H.encyclopedia = () => {
  const t = H.vTrust();
  const h = H.S.hunter;
  const seen = Object.keys(h.stats.killList).concat(['normal', 'rotted', 'hellhound', 'armored', 'sineater']);
  const keys = Object.keys(H.ENCY).filter((k) => t >= 1 || seen.includes(k));
  let html = t === 0 ? '<p class="dim">Valley doesn\'t open the notebook for strangers — but he\'ll answer a question or two out loud. (Basic information only until you\'ve earned his trust.)</p>' : `<p class="dim">Valley's field notes${t >= 3 ? ', including his own research' : t >= 2 ? ', with the real weaknesses' : ''}. "Not all of it\'s right. I\'m still gathering."</p>`;
  for (const k of keys) {
    const e = H.ENCY[k];
    html += `<div class="ency"><h3>${H.CREATURES[k].name}</h3><p>${e[0]}</p>${t >= 2 ? `<p><b>Weakness:</b> ${e[1]}</p>` : ''}${t >= 3 ? `<p><b>Field notes:</b> ${e[2]}</p>` : ''}</div>`;
  }
  H.ui.modal("Valley's Entity Encyclopedia", html, { wide: true });
};

/* ---------------------------------------------------------------------
   Valley's trust after his jobs (milestones, NPC_VALLEY)
   --------------------------------------------------------------------- */
H.valleyAfterJob = (job, success) => {
  const v = H.S.hunter.valley;
  if (job.special === 'hellhound') {
    v.chain = 1;
    if (v.trust < 2) {
      v.trust = 2;
      H.log(`<span class="good">Valley's trust: 1 — Known Hunter.</span> ${success ? '"Hounds are done? You beauty."' : '"You came back. Means we can work on what went wrong. Dead blokes are considerably harder to teach."'} He knows your name now. He'll buy and sell with you.`, 'sys');
    }
  } else if (job.special === 'sineater') {
    const m = H.S.mission;
    if (success && !(m && m.turnedAside)) {
      v.chain = 3;
      if (v.trust < 4) v.trust = 4;
      H.log('<span class="good">Valley\'s trust: 2 — Proven.</span> "A Sin Eater. A bloody White Shirt killed a Sin Eater." He pours two of the good stuff. "From now on I\'m not making money off you while you\'re doing my bloody work." (Base prices from Valley, no Desperation markup.)', 'sys');
    } else if (success) {
      H.log('"Turned it, did ya? Bought Ashville a week. Not bad. Not finished, but not bad."', 'speech');
      v.chain = 2;
    } else {
      v.chain = 1.5;
      H.log('"Too late for Ashville, then." He doesn\'t blame you. Somehow that\'s worse.', 'speech');
    }
  } else if (job.special === 'butcher') {
    if (success) {
      v.chain = 4;
      v.trust = 6;
      H.log('<span class="good">Valley\'s trust: 3 — One of Valley\'s People.</span> He tosses you a key. "Office. Come and go as you please. There\'s a cot, there\'s storage, and the cheap liquor\'s on the shelf. The good stuff stays in the trunk." He looks at you a long moment. "Something bigger\'s happening out there, mate. When it\'s time, I might need you."', 'sys');
    }
  }
  v.offer = null;
};

  mo.jobDone = (mo.jobDone || 0) + 1;

H.giveMugs = () => {
  const mo = H.S.hunter.molly;
  const n = H.countItem('mug');
  const pairs = Math.floor(n / 2);
  H.takeItem('mug', pairs * 2);
  H.gain(pairs * 50);
  mo.mugs += pairs * 2;
  H.sfx('glass');
  H.log(`She holds each one up to the lamp, checks the rim, and sets it behind the bar like it's crystal. ${pairs * 50} HB — and a meal, a drink and a bed on the house. ${pairs * 2 < n ? '(She\'ll take the odd one when you have its pair.)' : ''}`);
  if (mo.mugs >= 6 && mo.taptap < 1) {
    mo.taptap = 1;
    H.log('<span class="good">Tap-Tap 1/5 — Glassware.</span> Proper glasses behind the bar.', 'sys');
    if (!mo.ms.dependable && mo.ms.work) H.mollyMilestone('dependable', 'You helped the Tap-Tap itself.');
  }
  H.refresh();
};
H.giveKitchen = (part) => {

    mo.taptap = 2;
    H.log('<span class="good">Tap-Tap 2/5 — The Kitchen.</span>', 'sys');
  }
  if (n >= 3 && mo.taptap >= 2) {
    mo.taptap = 3;
    H.log('<span class="good">Tap-Tap 3/5 — Full Kitchen.</span>', 'sys');

  H.refresh();

    } });

    o.push({ t: 'End Downtime early.', act: () => { h.downtime = null; H.backToHub(); } });

  mood: 'town',
  enter: () => H.log('Which weakness do you work on? A session is a whole time of day: dry-firing, cutting at a straw man, shooting at bottles behind the stockyard.'),
  opts: () => {
    const h = H.S.hunter,
      dt = h.downtime;
    const o = H.BANES.filter((b) => h.banes[b]).map((b) => ({
      t: `Inexperience: ${b}`,
      note: `(${h.train[b]}/3 sessions · ${h.crits[b]}/3 crits)`,
      dis: (!dt || dt.left < 1) && 'No Downtime left',
      act: () => {
        dt.left--;
        H.advance(4, { noRecover: true });
        h.train[b]++;
        if (h.train[b] >= 3) {
          h.banes[b] = false;
          H.log(`<span class="good">Training pays off.</span> Inexperience: ${b} is gone for good. ${H.ref('3.1')}`, 'sys');
          H.sfx('sp');
        } else H.log(`A session spent on ${b.toLowerCase()} — ${h.train[b]}/3. It carries across Downtimes.`, 'sys');
        H.go('downtime');
      },
    }));
    o.push({ t: 'Back.', act: () => H.go('downtime') });
    return o;
  },
};
H.scenes.cleanse = {
  art: () => ({ kind: 'church', seed: 'cleanse' }),
  mood: 'calm',
  enter: () => H.log('Holy water, Sagebrush Smudge, and a quiet hour. Which item?'),
  opts: () => {
    const h = H.S.hunter;
    const o = [];
    for (const w of h.weapons.filter((x) => x.tainted)) o.push({ t: `The ${H.WEAPONS[w.key].name}`, act: () => H.doCleanse(() => (w.tainted = false), H.WEAPONS[w.key].name) });
    for (const it of h.items.filter((x) => x.tainted)) o.push({ t: H.itemName(it), act: () => H.doCleanse(() => { if ((it.n || 1) > 1) { it.n--; H.addItem(it.key, 1); } else it.tainted = false; }, H.itemName(it)) });
    o.push({ t: 'Back.', act: () => H.go('downtime') });
    return o;
  },
};
H.doCleanse = (fn, name) => {
  const h = H.S.hunter;
  H.takeItem('holy', 1);
  H.takeItem('smudge', 1);
  h.downtime.left--;
  H.advance(4, { noRecover: true });
  fn();
  H.log(`The smudge-smoke curls around the ${name}, the holy water hisses on it, and something leaves it. <span class="good">No longer Tainted</span> — it can be sold now. ${H.ref('7.9')}`, 'sys');
  H.go('downtime');
};
H.helpValley = () => {
  const h = H.S.hunter,
    v = h.valley;
  v.help++;
  H.log(H.pick(['You sort traps and sharpen knives while Valley talks — about the bush, mostly. He tells it like a man telling you about his family.', 'You read his field notes back to him while he corrects you. "No — that\'s a hive, ya galah, not a hound. Look at the drawing."', 'You fix the porch step. He supervises, loudly.']));
  if (v.help % 2 === 0) {
    const left = ['ambush', 'wisdom', 'limbs'].filter((b) => !h.boons.includes(b));
    if (!left.length) {
      H.log('"Nothin\' left I can teach ya, mate. Rest is up to the bayou."');
      return H.refresh();
    }
    const b = left[H.d(left.length) - 1];
    h.boons.push(b);
    v.learned.push(b);
    if (b === 'wisdom') {
      const stat = H.mod(h.base.DEX + h.bonus.DEX + 1) > H.mod(h.base.DEX + h.bonus.DEX) ? 'DEX' : H.mod(h.base.WIS + h.bonus.WIS + 1) > H.mod(h.base.WIS + h.bonus.WIS) ? 'WIS' : 'DEX';
      h.bonus[stat]++;
      if (!h.skills.includes('Survival')) h.skills.push('Survival');
      H.log(`(+1 ${stat}${stat === 'DEX' ? ' — Valley\'s tip: the +1 is worth more on an odd score' : ''}, and proficiency in Survival.)`, 'sys');
    }
    if (b === 'limbs' && !h.skills.includes('Stealth')) h.skills.push('Stealth');
    H.sfx('sp');
    H.log(`<span class="good">Valley teaches you a Boon: ${H.BOONS[b].name}.</span> ${H.BOONS[b].text} ${H.ref('3.9')}`, 'sys');
    H.say('Valley', { ambush: 'First ten seconds, mate. Hit \'em before they know you\'re there, and be gone before they work out where you went.', wisdom: 'Read people. Make \'em believe you. Bail up! — works on people. Don\'t try it on a bloody grunt.', limbs: 'Patience. The shot you set up is worth ten you throw. Call it, then take it.' }[b]);
  }
  H.refresh();
};
H.gainLeads = (n) => {
  const h = H.S.hunter;
  if (!n) {
    H.log('You ask around for hours and hear nothing you can use.');
    return H.refresh();
  }
  for (let i = 0; i < n; i++) {
    const r = H.d(10);
    if (r === 10 && !h.plantationKnown && H.S.world.day >= 3) {
      h.plantationKnown = true;
      H.log('<span class="good">A strange lead.</span> A trapper in his cups swears there\'s a plantation out in the deep bayou — locked up tight, and inside, he says, the floors are <i>clean</i>. "Clean, I tell ya. And feathers. Blue ones. Big as a man." Everyone laughs. You don\'t. You get directions out of him before he passes out.', 'sys');
      continue;
    }
    if (r <= 7) {
      const j = H.leadJob();
      h.leads.push(j);
      H.log(`<span class="good">Lead:</span> ${H.esc(j.name)}. <span class="dim">(Posted to your board as word of mouth.)</span>`, 'sys');
    } else H.log(`<span class="good">Lead:</span> ${H.pick(H.T.rumors)}`, 'sys');
  }
  H.refresh();
};

/* ---------------------------------------------------------------------
   Bauer's Plantation (GM-only location, BAUERS_PLANTATION)
   Found only through rumors. Corruption 0. Not dangerous. The horror is
   that it's empty.
   --------------------------------------------------------------------- */
H.scenes.plantation = {
  art: () => ({ kind: 'plantation', seed: 'bauer', caption: 'A plantation in the deep bayou' }),
  mood: 'calm',
  enter: (p) => {
    const h = H.S.hunter;
    if (p.inside) return;
    if (!p.arrived) {
      H.ui.divider();
      H.advance(5);
      H.S.where = 'field';
      H.log('Five hours out, past where the maps go vague, you find it: a ruined plantation house like a hundred others, its columns green with moss. From the outside it\'s another rotted shell. But the doors and shutters are locked up tight — new locks, oiled — and the air here doesn\'t taste of anything at all. Corruption here is nil. Nothing has gotten in.');
      p.arrived = true;
    }
    void h;
  },
  opts: (p) => {
    const h = H.S.hunter;
    const o = [];
    if (H.countItem('pkey')) o.push({ t: 'Use Valley\'s key.', cls: 'good', act: () => { H.sfx('door'); H.go('plantation_in'); } });
    o.push({ t: 'Force the door or pick the lock.', note: '(No Idea)', act: () => H.check({ title: 'Get in', skill: H.am(h, 'STR') >= H.am(h, 'DEX') ? 'Athletics' : 'Sleight of Hand', dc: 20, onDone: (r) => {
      if (r.success) {
        H.sfx('door');
        H.log('The lock gives with a click that sounds very loud in the silence.');
        H.go('plantation_in');
      } else {
        H.advance(1);
        H.log('An hour of trying. The lock doesn\'t care.');
      }
    } }) });
    o.push({ t: 'Go back to Wayfarer\'s Rest.', note: '(5 hours)', act: () => { H.advance(5); H.go('town'); } });
    return o;
  },
};
H.scenes.plantation_in = {
  art: () => ({ kind: 'plantation', seed: 'bauer-in', caption: 'Inside' }),
  mood: 'silent',
  enter: () => {
    const S = H.S;
    if (S.plantSeen) return;
    S.plantSeen = true;
    H.ui.divider();
    H.log('Inside, the floor is clean. Swept. There is soap in the bathroom — a real cake of it, dry and cracked. In the bedroom there is an actual bed, made, and when you lean close the pillow still smells faintly of lavender.');
    H.log('Someone lived here, for a while. Not roughly. There is a teapot. There are two cups. There are books with their spines cracked from being read.');
    H.log('And then you notice the feathers. Blue feathers, everywhere — on the floor, on the windowsills, caught in the curtains. Ordinary ones, the length of a hand. Longer ones. And laid along the hall like a fallen spar, a single tail feather eight feet long. Whatever shed them was an enormous bird.');
    H.log('<span class="dim">The feathers are not Tainted. Nothing here is corrupt — which is itself worth noticing.</span>');
  },
  opts: () => {
    const w = H.S.world.plantation,
      h = H.S.hunter;
    const room = Math.max(0, H.maxWeight(h) - H.weightUsed(h));
    const o = [];
    const take = (key, wkey, per, n, label) => {
      const can = Math.min(w[wkey], Math.floor((room + 1e-9) / per));
      if (w[wkey] <= 0) return;
      o.push({ t: `Gather ${label}.`, note: `(${w[wkey]} left · room for ${can})`, dis: can < 1 && 'No room — they weigh more than you\'d think', act: () => {
        const k = Math.min(can, n);
        if (H.addItem(key, k)) {
          w[wkey] -= k;
          H.log(`You gather ${k} ${label.replace(/^(some|the) /, '')}.`);
        }
        H.refresh();
      } });
    };
    take('feather_t', 't', 1 / 3, 3, 'tail feathers');
    take('feather_m', 'm', 1 / 10, 10, 'medium feathers');
    take('feather_s', 's', 1 / 25, 25, 'small feathers');
    if (w.main > 0) o.push({ t: 'Take the great eight-foot feather.', note: '(Weight 4)', dis: room < 4 && 'No room', act: () => { if (H.addItem('feather_main', 1)) { w.main = 0; H.log('You lift it. It is lighter than it looks and heavier than it should be.'); } H.refresh(); } });
    if (w.choker > 0) o.push({ t: 'Open the jewellery box in the bedroom.', act: () => { w.choker = 0; H.addItem('choker'); H.log('Inside, on faded velvet: a black leather choker. Nothing else. It weighs nothing at all.'); H.refresh(); } });
    if (w.letter > 0) o.push({ t: 'Look at the desk.', act: () => { w.letter = 0; H.addItem('letter'); H.log('A letter, sealed, addressed in a fine old-world hand to <i>Valley</i>. You don\'t open it. You don\'t have to; the weight of it in your hand is enough.'); H.refresh(); } });
    o.push({ t: 'Lock up and go.', act: () => { H.S.plantSeen = false; H.advance(5); H.log('You lock the door behind you. It feels like the right thing to do.'); H.go('town'); } });
    return o;
  },
};

/* =====================================================================
   HUNT · 1896 — boot, title, new game, loading, and a test harness.
   ===================================================================== */
'use strict';

H.blankState = (phase) => ({ phase, world: null, hunter: null, log: [], scene: { id: 'title', p: {} }, job: null, mission: null, combat: null, where: 'wayfarer' });

H.scenes.title = {
  art: () => ({ kind: 'title', seed: 'title-1896', caption: '' }),
  mood: 'calm',
  freeform: false,
  custom: (box) => {
    const auto = H.readSlot('auto');
    const wrap = H.el('div', { class: 'title' });
    wrap.appendChild(H.el('div', { class: 't-over', text: 'Louisiana · Eighteen Hundred & Ninety-Six' }));
    wrap.appendChild(H.el('h1', { class: 't-main', html: 'HUNT<span>·</span>1896' }));
    wrap.appendChild(H.el('div', { class: 't-sub', html: 'A bayou text adventure, after <i>Hunt: Showdown</i><br>Rules &amp; world from Dedric\'s DM Bible' }));
    wrap.appendChild(H.el('p', { class: 't-blurb', text: 'The dead are walking in the bayou, and the American Hunters Association is a shell. You are a White Shirt: green, poorly armed, and alone. Death is permanent. The world remembers you anyway.' }));
    const btns = H.el('div', { class: 't-btns' });
    if (H.validSave(auto))
      btns.appendChild(H.el('button', { class: 'big', html: `Continue<span>${H.esc(H.slotSummary(auto))}</span>`, onclick: () => { H.audioInit(); H.loadState(auto); } }));
    btns.appendChild(H.el('button', { class: 'big', html: 'Sign the Ledger<span>a new hunter, a new bayou</span>', onclick: () => { H.audioInit(); H.newGame(); } }));
    btns.appendChild(H.el('button', { class: 'big', html: 'Load<span>a slot, or a save file</span>', onclick: () => { H.audioInit(); H.ui.menu(); } }));
    btns.appendChild(H.el('button', { class: 'big ghost', html: 'How to Play', onclick: H.ui.help }));
    btns.appendChild(H.el('button', { class: 'big ghost', html: 'Ledger of the Dead', onclick: H.ui.showLedger }));
    wrap.appendChild(btns);
    wrap.appendChild(H.el('p', { class: 't-hint', text: 'Best with sound on. Headphones, in the dark, if you dare.' }));
    box.appendChild(wrap);
  },
};

H.title = () => {
  H.S = H.blankState('title');
  H.ui.renderLog();
  H.S.scene = { id: 'title', p: {} };
  H.ui.render();
  document.body.classList.add('at-title');
};

H.newGame = () => {
  document.body.classList.remove('at-title');
  H.S = H.blankState('create');
  H.S.world = H.newWorld();
  H.S.hunter = H.newHunter();
  H.refreshBoard();
  H.rollStock();
  H.ui.draft = null;
  H.ui.renderLog();
  H.log('<span class="sys-h">The ledger is open.</span> Every White Shirt starts the same way: green, poorly equipped, carrying all eight Inexperience Banes. Fill in the page.', 'sys');
  H.go('create');
};

/* After a death the world persists (roguelite): same day count, same prices, same looted plantation. */
H.newHunterSameWorld = () => {
  document.body.classList.remove('at-title');
  const w = H.S.world;
  H.S = H.blankState('create');
  H.S.world = w;
  w.hunterNo = (w.hunterNo || 1) + 1;
  H.S.hunter = H.newHunter();
  H.advance(H.ri(1, 3) * 24);
  w.hour = 6;
  w.sinEater = w.sinEater && w.sinEater.status === 'walking' ? w.sinEater : null;
  H.refreshBoard();
  H.rollStock();
  H.ui.draft = null;
  H.ui.renderLog();
  H.log(`<span class="sys-h">Days later, another boat.</span> The bayou has had time to forget the last one. It hasn't. ${H.date()}.`, 'sys');
  H.go('create');
};

H.loadState = (o) => {
  if (!H.validSave(o)) return H.ui.toast('That save is damaged.');
  document.body.classList.remove('at-title');
  H.S = JSON.parse(JSON.stringify(o));
  delete H.S.v;
  delete H.S.savedAt;
  // migrations / repairs for older saves
  const h = H.S.hunter;
  h.valley = Object.assign(H.newHunter().valley, h.valley || {});
  h.molly = Object.assign(H.newHunter().molly, h.molly || {});
  h.leads = h.leads || [];
  H.S.world.ashBoard = H.S.world.ashBoard || [];
  H.S.world.news = H.S.world.news || [];
  if (H.S.phase === 'dead') {
    H.ui.renderLog();
    H.S.scene = { id: 'dead', p: {} };
    H.ui.render();
    return;
  }
  H.S.phase = 'game';
  if (H.S.scene.id === 'combat' && !H.S.combat) H.S.scene = { id: 'town', p: {} };
  if (!H.scenes[H.S.scene.id]) H.S.scene = { id: 'town', p: {} };
  H.ui.busy = null;
  H.ui.renderLog();
  H.log('<span class="dim">— loaded —</span>', 'sys');
  H.ui.render();
};

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
H.boot = () => {
  H.loadSettings();
  H.$('#menuBtn').addEventListener('click', () => { H.audioInit(); H.ui.menu(); });
  H.$('#helpBtn').addEventListener('click', H.ui.help);
  H.$('#soundBtn').addEventListener('click', () => {
    H.audioInit();
    const on = !(H.settings.music || H.settings.sfxOn);
    H.settings.music = on;
    H.settings.sfxOn = on;
    H.saveSettings();
    H.audioApplySettings();
    H.ui.syncSoundBtn();
  });
  H.$('#sheetBtn').addEventListener('click', () => document.body.classList.toggle('sheet-open'));
  H.ui.syncSoundBtn();
  // the browser only allows sound after a gesture
  const kick = () => { H.audioInit(); if (H.S) H.ui.render(); window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);
  window.addEventListener('error', (e) => H.ui.crash(e.error || e.message));
  const qs = new URLSearchParams(location.search);
  if (qs.get('monkey')) return H.monkey(+qs.get('monkey') || 300, qs.get('mode') || 'boat');
  H.title();
};
H.ui.syncSoundBtn = () => {
  const b = H.$('#soundBtn');
  if (b) b.textContent = H.settings.music || H.settings.sfxOn ? '🔊' : '🔇';
};

/* ---------------------------------------------------------------------
   Monkey test: ?monkey=N plays N random choices and reports any errors.
   Used to smoke-test builds headlessly; harmless otherwise.
   --------------------------------------------------------------------- */
H.monkey = (steps, mode) => {
  window.confirm = () => true;
  H.settings.fast = true;
  H.settings.sfxOn = false;
  H.settings.music = false;
  const out = { steps: 0, errors: [], scenes: {}, deaths: 0, jobs: 0, combats: 0, maxDay: 0, hunters: 1 };
  window.__errors = [];
  const origCrash = H.ui.crash;
  H.ui.crash = (err) => { out.errors.push(String(err && err.stack ? err.stack : err).slice(0, 600)); origCrash(err); };
  H.title();
  H.newGame();
  const d = H.ui.draft || {};
  void d;
  // fill the creation form programmatically
  H.beginHunter({ name: 'Monkey ' + H.ri(1, 999), look: 'Test.', why: 'Testing.', lang: 'English', abil: { STR: 13, DEX: 15, CON: 14, INT: 10, WIS: 12, CHA: 8 }, boon: H.pick(['weapon_training', 'skilled', 'lucky']), wtBane: 'Shotguns', wtClass: 'Shotgun', sk1: 'Stealth', sk2: 'Perception', pkg: H.pick(['A', 'B']), mode });
  let i = 0;
  const step = () => {
    try {
      for (let k = 0; k < 20 && i < steps; k++, i++) {
        out.steps++;
        const sid = H.S.scene ? H.S.scene.id : '?';
        out.scenes[sid] = (out.scenes[sid] || 0) + 1;
        if (H.S.world) out.maxDay = Math.max(out.maxDay, H.S.world.day);
        if (H.S.phase === 'dead') {
          out.deaths++;
          out.hunters++;
          H.newHunterSameWorld();
          H.beginHunter({ name: 'Monkey ' + H.ri(1, 999), look: '', why: '', lang: 'French', abil: { STR: 15, DEX: 14, CON: 13, INT: 12, WIS: 10, CHA: 8 }, boon: H.pick(['weapon_training', 'skilled', 'lucky']), wtBane: 'Rifles', wtClass: 'Rifle', sk1: 'Athletics', sk2: 'Investigation', pkg: H.pick(['A', 'B']), mode: H.pick(['boat', 'dead']) });
          continue;
        }
        H.ui.closeModal();
        const rb = H.$('#choices .rollbtn:not([disabled])');
        if (rb) { rb.click(); continue; }
        let btns = H.$$('#choices button.opt:not([disabled]), #choices button.cbtn:not([disabled])');
        if (sid === 'combat') {
          out.combats += H.S.combat && H.S.combat.round === 1 ? 0 : 0;
          const atk = btns.filter((b) => b.classList.contains('attack'));
          const end = btns.find((b) => b.classList.contains('end'));
          if (atk.length && H.chance(0.7)) btns = atk;
          else if (end && H.chance(0.35)) btns = [end];
          // pick a target sometimes
          const foes = H.$$('#choices button.foe');
          if (foes.length && H.chance(0.3)) H.pick(foes).click();
        }
        // avoid quitting loops: prefer progress options most of the time
        if (!btns.length) {
          const cb = H.$('#choices .cancelbtn');
          if (cb) { cb.click(); continue; }
          out.errors.push('Stuck with no buttons in scene ' + sid);
          H.go(H.S.where === 'ashville' ? 'ashville' : 'town');
          continue;
        }
        const good = btns.filter((b) => b.classList.contains('good'));
        const pickB = good.length && H.chance(0.5) ? H.pick(good) : H.pick(btns);
        pickB.click();
        if (H.S.job && H.S.job.status === 'active') out.jobs = Math.max(out.jobs, H.S.hunter ? H.S.hunter.stats.jobs : 0);
      }
    } catch (err) {
      out.errors.push(String(err && err.stack ? err.stack : err).slice(0, 600));
    }
    if (i < steps && out.errors.length < 15) setTimeout(step, 0);
    else {
      out.errors = out.errors.concat((window.__errors || []).filter((e) => !out.errors.includes(e)));
      out.final = { scene: H.S.scene && H.S.scene.id, day: H.S.world && H.S.world.day, hunter: H.S.hunter && H.S.hunter.name, hp: H.S.hunter && H.S.hunter.hp, jobsDone: H.S.hunter && H.S.hunter.stats.jobs, trust: H.S.hunter && H.S.hunter.valley.trust };
      const pre = document.createElement('pre');
      pre.id = 'monkey-result';
      pre.textContent = JSON.stringify(out, null, 1);
      document.body.appendChild(pre);
    }
  };
  setTimeout(step, 0);
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', H.boot);
else H.boot();
