/* =====================================================================
   HUNT · 1896 — state: the hunter, the world clock, money, inventory,
   and save / load. All of it is plain JSON so a save is just a file.
   ===================================================================== */
'use strict';

H.S = null; // the live game state
H.SAVE_VERSION = 1;
H.KEY = 'hunt1896.';

/* ---------------------------------------------------------------------
   World
   --------------------------------------------------------------------- */
H.newWorld = () => {
  const start = new Date(1896, H.ri(2, 8), H.ri(1, 27)); // spring–autumn 1896
  return {
    start: start.getTime(),
    day: 1,
    hour: 6,
    weather: H.pick(H.WEATHER).k,
    di: 0,
    spikeDecay: 0,
    nextSpikeDay: H.ri(5, 8),
    board: [],
    boardDay: 0,
    ashBoard: [],
    stock: {},
    stockDay: 0,
    corr: { wayfarer: 0, ashville: 0 },
    sinEater: null,
    plantation: { s: 200, m: 30, t: 12, main: 1, choker: 1, letter: 1 },
    hunterNo: 1,
    news: [],
  };
};

/* ---------------------------------------------------------------------
   Hunter
   --------------------------------------------------------------------- */
H.newHunter = () => ({
  name: '', look: '', why: '', lang: 'English', mode: 'boat',
  base: { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 },
  bonus: { DEX: 0, WIS: 0 },
  skills: [],
  boons: [],
  wtClass: null,
  banes: Object.fromEntries(H.BANES.map((b) => [b, true])),
  crits: Object.fromEntries(H.BANES.map((b) => [b, 0])),
  train: Object.fromEntries(H.BANES.map((b) => [b, 0])),
  hp: 50,
  bars: 5,
  fireBurn: 0,
  sp: 0,
  wallet: { hb: 20, sm: 0, gc: 0 },
  weapons: [],
  hand: null,
  belt: {},
  items: [],
  infections: [],
  valley: { trust: 0, met: false, help: 0, learned: [], pressed: 0, cruelty: 0, chain: 0, toldPlantation: false, askedChoker: false, betrayed: false, letterGiven: false, feathers: 0, offerDay: 0 },
  molly: { met: false, rel: 0, ms: {}, visitDays: [], taptap: 0, mugs: 0, kitchen: {}, strikes: 0, jobDone: 0 },
  plantationKnown: false,
  leads: [],
  stats: { kills: 0, jobs: 0, crits: 0, arrivedDay: 1, killList: {} },
  downtime: null,
  armedSP: false,
});

/* ---------- derived stats ---------- */
H.infPen = (h) => h.infections.filter((i) => i.stage !== 'window').length;
H.abil = (h, A) => {
  let v = h.base[A] + (h.bonus[A] || 0);
  if (A === 'STR' || A === 'DEX') v -= 2 * H.infPen(h);
  return v;
};
H.am = (h, A) => H.mod(H.abil(h, A));
H.ac = (h) => 10 + H.am(h, 'DEX');
H.pp = (h) => 10 + H.am(h, 'WIS');
H.speed = (h, water) => (water ? Math.ceil(9 * 0.75) : 9);
H.prof = (h, skill) => h.skills.includes(skill);
H.skillMods = (h, skill) => {
  const A = H.SKILLS[skill];
  const mods = [{ n: A, v: H.am(h, A), always: true }];
  if (H.prof(h, skill)) mods.push({ n: skill + ' prof', v: 2 });
  return mods;
};
H.maxWeight = (h) => 20 + H.am(h, 'STR') + H.am(h, 'DEX');
H.weightUsed = (h) => {
  let w = 4; // the default ammo belt
  for (const wp of h.weapons) w += H.WEAPONS[wp.key].wt;
  for (const it of h.items) {
    const d = H.ITEMS[it.key];
    if (d && d.wtPer) w += d.wtPer * (it.n || 1);
  }
  return Math.round(w * 100) / 100;
};
H.availBars = (h) => Math.max(0, h.bars - H.infPen(h));
H.maxHp = (h) => Math.max(0, H.availBars(h) * 10 - h.fireBurn);

/* ---------- HP and bars (§3.3) ---------- */
/* Damage drains the top bar first. A bar that empties is only empty: any healing refills it.
   Only fire burns: a bar that fire damage empties burns out, and maximum health stays down
   until a doctor or a remedy restores it. The last bar never burns: hitting 0 downs the
   hunter instead (§3.4). */
H.hurt = (n, type) => {
  const h = H.S.hunter;
  const before = h.hp;
  h.hp = Math.max(0, h.hp - n);
  const out = [];
  if (type === 'fire') {
    // bars whose floor this hit crossed, never counting the bottom bar
    const emptied = Math.max(0, Math.ceil(before / 10) - Math.max(1, Math.ceil(h.hp / 10)));
    const burn = Math.min(emptied, h.bars - 1);
    if (burn > 0) {
      h.bars -= burn;
      out.push('bar' + burn);
    }
  }
  if (type === 'fire' && H.S.mission) {
    H.S.mission.fireTaken += n;
    const burnNow = Math.floor(H.S.mission.fireTaken / 6) - H.S.mission.fireBurned;
    if (burnNow > 0) {
      H.S.mission.fireBurned += burnNow;
      h.fireBurn += burnNow;
      out.push('fire' + burnNow);
    }
  }
  if (h.hp > H.maxHp(h)) h.hp = H.maxHp(h);
  const b = out.find((x) => x.startsWith('bar'));
  if (b) {
    const nb = +b.slice(3),
      it = nb === 1 ? 'it' : 'them';
    H.log(`<span class="bad">The fire burns ${nb === 1 ? 'a bar' : H.num(nb) + ' bars'} away.</span> Healing won't bring ${it} back: your maximum health is <b>${H.maxHp(h)}</b> until a doctor or a remedy restores ${it}. ${H.ref('3.3')}`, 'sys');
  }
  const f = out.find((x) => x.startsWith('fire'));
  if (f) H.log(`<span class="bad">The fire takes something that won't heal until this job is done</span> — ${f.slice(4)} HP of maximum burned. ${H.ref('3.6')}`, 'sys');
  H.sfx && before > h.hp && H.sfx('hurt');
  return h.hp <= 0;
};
H.heal = (n, natural) => {
  const h = H.S.hunter;
  const max = H.maxHp(h);
  const cap = natural ? Math.min(max, Math.max(10, Math.ceil(h.hp / 10) * 10)) : max;
  const before = h.hp;
  if (h.hp < cap) h.hp = Math.min(cap, h.hp + n);
  return h.hp - before;
};

/* ---------- Story Points (§1.8) ---------- */
H.awardSP = (why) => {
  const h = H.S.hunter;
  if (h.sp >= 3) {
    H.log(`<span class="sp">✦ That deserved a Story Point</span> — ${why} — but you already hold three.`, 'sys');
    return;
  }
  h.sp++;
  H.log(`<span class="sp">✦ Story Point earned</span> — ${why}. (${h.sp}/3) ${H.ref('1.8')}`, 'sys');
  H.sfx && H.sfx('sp');
};

/* ---------- Banes: Field Mastery (§3.1 Step 4) ---------- */
H.noteCrit = (cat) => {
  const h = H.S.hunter;
  if (!cat || !h.banes[cat]) return;
  h.crits[cat]++;
  if (h.crits[cat] >= 3) {
    h.banes[cat] = false;
    H.log(`<span class="good">Field Mastery.</span> Three critical hits — the Inexperience: ${cat} Bane is gone for good. ${H.ref('3.1')}`, 'sys');
    H.sfx && H.sfx('sp');
  } else H.log(`<span class="dim">Critical hit counted toward Field Mastery: ${cat} ${h.crits[cat]}/3.</span>`, 'sys');
};

/* ---------------------------------------------------------------------
   The clock (§3.15) and the Desperation Index (§7.5)
   --------------------------------------------------------------------- */
H.date = (w) => {
  w = w || H.S.world;
  const d = new Date(w.start + (w.day - 1) * 86400000);
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  return `${days[d.getDay()]}, the ${H.ord(d.getDate())} of ${months[d.getMonth()]}, 1896`;
};
H.tod = (hour) => {
  hour = hour == null ? H.S.world.hour : hour;
  let t = H.TOD[0];
  for (const x of H.TOD) if (hour >= x.from) t = x;
  return t;
};
H.isNight = () => {
  const hr = H.S.world.hour;
  return hr >= 20 || hr < 5;
};
H.weather = () => H.WEATHER.find((w) => w.k === H.S.world.weather) || H.WEATHER[0];
H.clock = () => {
  const hr = H.S.world.hour;
  const h12 = hr % 12 === 0 ? 12 : hr % 12;
  return `${h12} o'clock ${hr < 12 ? 'in the morning' : hr < 17 ? 'in the afternoon' : hr < 21 ? 'in the evening' : 'at night'}`;
};

/* Advance the world clock hour by hour. Things that tick: infection windows, natural
   recovery, the day roll (DI, weather, board, stock, events, the walking Sin Eater). */
H.advance = (hours, opts) => {
  opts = opts || {};
  const S = H.S,
    w = S.world,
    h = S.hunter;
  for (let i = 0; i < hours; i++) {
    w.hour++;
    if (w.hour >= 24) {
      w.hour = 0;
      w.day++;
      H.newDay();
    }
    if (h && h.hp > 0) {
      // natural recovery: 1 HP / hour, only to the top of the damaged bar (§3.5)
      if (!opts.noRecover) H.heal(1, true);
      // infection windows (§3.11)
      for (const inf of h.infections.slice()) {
        inf.hours--;
        if (inf.stage === 'window' && inf.hours <= 0) {
          inf.stage = 'set';
          H.log(`<span class="bad">The ${inf.type} wound has set in.</span> You are <b>Infected (${inf.type})</b>: one bar of maximum health, −2 STR, −2 DEX until it's cleaned and you've recovered two days. ${H.ref('3.11')}`, 'sys');
          if (h.hp > H.maxHp(h)) h.hp = H.maxHp(h);
        } else if (inf.stage === 'recovering' && inf.hours <= 0) {
          h.infections.splice(h.infections.indexOf(inf), 1);
          H.log(`<span class="good">The ${inf.type} infection has run its course.</span> Your strength comes back to you. ${H.ref('3.11')}`, 'sys');
        }
      }
    }
  }
};

H.newDay = () => {
  const w = H.S.world;
  // §7.5 daily DI roll: 1d11 + 4, coin flip for sign
  const mag = H.d(11) + 4;
  const sign = H.chance(0.5) ? 1 : -1;
  let delta = sign * mag;
  if (w.spikeDecay > 0) {
    delta -= Math.sign(w.di) * H.ri(5, 10);
    w.spikeDecay--;
  }
  w.di = H.clamp(w.di + delta, -40, 150);
  w.weather = H.pick(H.WEATHER).k;
  // weekly event spike (§7.6, PROPOSED table)
  if (w.day >= w.nextSpikeDay) {
    H.eventSpike();
    w.nextSpikeDay = w.day + H.ri(6, 8);
  }
  // the walking Sin Eater (§6.1, world actor)
  if (w.sinEater && w.sinEater.status === 'walking') {
    w.sinEater.daysLeft--;
    if (w.sinEater.daysLeft <= 0) {
      w.sinEater.status = 'arrived';
      w.corr.ashville = Math.min(4, (w.corr.ashville || 0) + 1);
      w.di = H.clamp(w.di + H.d(10) + 10, -40, 150);
      H.news(`The Sin Eater reached the outskirts of ${w.sinEater.target}. Corruption there has risen. Nobody stopped it.`);
      const vj = H.S.hunter && H.S.hunter.valley;
      if (H.S.job && H.S.job.special === 'sineater') H.S.job.failed = true;
      if (vj && vj.chain === 2) vj.chain = 1.5; // the chance passed; another will come
    }
  }
  w.news = (w.news || []).slice(-6);
  H.refreshBoard();
  H.rollStock();
  if (H.S.hunter) H.S.hunter.stats.days = w.day - H.S.hunter.stats.arrivedDay;
};

H.news = (txt) => {
  H.S.world.news.push({ day: H.S.world.day, txt });
  H.log(`<span class="news">News travels:</span> ${txt}`, 'sys');
};

/* §7.6 Event Spike Table [PROPOSED] — rolled about weekly */
H.eventSpike = () => {
  const w = H.S.world;
  const r = H.d(12);
  let txt = '',
    d = 0;
  switch (r) {
    case 1: d = H.roll('2d4').total * 10; txt = 'A Rift has opened near Maw Battery. Folk say the air there tastes of tar.'; break;
    case 2: d = H.roll('3d10').total + 30; txt = "Goddard's bridge has burned. Freight has stopped. Prices are already climbing."; break;
    case 3: d = H.roll('2d10').total + 20; txt = 'A grunt tide overran a hamlet up the delta. Survivors are coming in by boat.'; break;
    case 4: d = H.d(10) + 10; txt = "Hardin's deputies seized a warehouse on the waterfront. Nobody will say what was in it."; break;
    case 5: d = H.d(10) + 10; txt = 'Badgers raided a 10-Gallon cache in the night. There will be blood over it.'; break;
    case 6: d = H.roll('2d10').total + 10; txt = 'Something big was sighted near Salter\'s Pork. The fishermen won\'t go up that channel.'; break;
    case 7: d = H.d(10); txt = 'A fever week: half the town is abed and the other half is coughing.'; break;
    case 8: d = -(H.d(10) + 15); txt = 'A smuggler flotilla tied up overnight. Suddenly everyone has what you need — for a price.'; break;
    case 9: d = -(H.d(10) + 5); txt = 'The Lunar Pact blessed the wells. People are sleeping a little easier.'; break;
    case 10: d = -(H.roll('2d10').total + 25); txt = 'A relief steamer came up from New Orleans loaded to the rails.'; break;
    case 11: d = -(H.d(10) + 10); txt = 'Somebody — not you — banished a horror out past Lawson. Drinks are being bought.'; break;
    default: d = 0; txt = 'Rumors only. The bayou holds its breath.';
  }
  w.di = H.clamp(w.di + d, -40, 150);
  w.spikeDecay = d !== 0 ? 4 : 0;
  H.news(`${txt} <span class="dim">(Desperation ${d >= 0 ? '+' : ''}${d}%)</span>`);
  // A Sin Eater sighting is its own event, and only once Valley trusts you enough to send you (§6.1)
  const h = H.S.hunter;
  if (h && h.valley.trust >= 2 && (h.valley.chain === 1 || h.valley.chain === 1.5) && !w.sinEater && H.chance(0.6)) H.spawnSinEater();
};

H.spawnSinEater = () => {
  const w = H.S.world;
  w.sinEater = { status: 'walking', daysLeft: H.ri(6, 9), target: 'Ashville', sighted: w.day };
  w.di = H.clamp(w.di + H.d(10) + 10, -40, 150);
  H.news('A Sin Eater has been sighted on the horizon east of Ashville, walking west. Dynamite prices have doubled wherever it has been seen.');
  if (H.S.hunter) H.S.hunter.valley.chain = 2;
};

/* ---------------------------------------------------------------------
   Money (§7.1) and prices (§7.5)
   --------------------------------------------------------------------- */
H.worth = (wal) => wal.hb + wal.sm * 100 + wal.gc * 1000;
H.walletText = (wal) => {
  const parts = [`${wal.hb} HB`];
  if (wal.sm) parts.push(`${wal.sm} SM`);
  if (wal.gc) parts.push(`${wal.gc} GC`);
  return parts.join(' · ');
};
H.canPay = (hb) => H.worth(H.S.hunter.wallet) >= hb;
/* Pay an HB price. Silver and gold break into HB at par if needed (§7.1). */
H.pay = (hb) => {
  const wal = H.S.hunter.wallet;
  if (!H.canPay(hb)) return false;
  let broke = false;
  while (wal.hb < hb) {
    if (wal.sm > 0) { wal.sm--; wal.hb += 100; broke = true; }
    else if (wal.gc > 0) { wal.gc--; wal.sm += 10; broke = true; }
  }
  wal.hb -= hb;
  if (broke) H.log('<span class="dim">You break a coin into scrip to cover it.</span>', 'sys');
  H.sfx && H.sfx('coin');
  return true;
};
H.paySM = (n) => {
  const wal = H.S.hunter.wallet;
  while (wal.sm < n && wal.gc > 0) { wal.gc--; wal.sm += 10; }
  if (wal.sm < n) return false;
  wal.sm -= n;
  H.sfx && H.sfx('coin');
  return true;
};
H.gain = (hb, sm, gc) => {
  const wal = H.S.hunter.wallet;
  wal.hb += hb || 0;
  wal.sm += sm || 0;
  wal.gc += gc || 0;
  H.sfx && H.sfx('coin');
};
H.diF = () => H.S.world.di / 100;
/* seller: 'surface' | 'smuggler' | 'valley' | 'flat'; perish = §7.5 perishables ×1.5 */
H.price = (base, seller, perish) => {
  const di = H.diF() * (perish ? 1.5 : 1);
  if (seller === 'smuggler') return Math.max(1, Math.round(base * (1 + di * 0.6)));
  if (seller === 'flat') return base;
  if (seller === 'valley' && H.S.hunter.valley.trust >= 4) return base;
  return Math.max(1, Math.round(base * (1 + di)));
};

/* §7.8 merchant templates — base stock; §7.5 stock formula and availability check, rolled each dawn. */
H.SHOPS = {
  sammy: { name: 'Sammy Lox, Gunsmith', skill: 3, stock: { romero: 2, winfield: 1, vetterli: 1, crossbow: 1, bow: 1, 'Compact-Small': 3, 'Compact-Large': 3, 'Medium-Small': 3, 'Medium-Large': 3, Buckshot: 3, 'Long-Large': 'd3', Arrow: 10, Bolt: 10 } },
  johnny: { name: 'Johnny Bronco, Weapons', skill: 1, stock: { caldwell: 2, pax: 1, sparks: 1, uppercut: 1, sword: 1, knife: 3, dusters: 2, firebomb: 3, dynamite: 1, hellfire: 'rare', 'Long-Small': 1, 'Long-Large': 'd3' } },
  bruce: { name: "Bruce Maxwell's General Store", skill: 2, stock: { lantern: 2, knife: 3, fak: 3, carron: 2, 'Compact-Small': 6, 'Compact-Large': 6, Buckshot: 4, liquor: 4, spyglass: 1 } },
  doctor: { name: 'The Doctor', skill: 2, stock: { fak: 2, antiseptic: 1 } },
  chapel: { name: 'The Chapel', skill: 1, stock: { holy: 2, smudge: 3 } },
  pig: { name: 'The Bloated Pig', skill: 2, stock: { liquor: 6 } },
};
H.rollStock = () => {
  const w = H.S.world;
  w.stock = {};
  const di = H.diF();
  for (const sk in H.SHOPS) {
    const shop = H.SHOPS[sk];
    w.stock[sk] = {};
    for (const item in shop.stock) {
      let base = shop.stock[item];
      if (base === 'd3') base = H.d(3);
      if (base === 'rare') base = H.chance(0.25) ? 1 : 0;
      let qty = Math.floor(base * Math.max(0.1, 1 - di));
      if (sk === 'chapel' && w.di >= 40) qty = 0; // holy water and relics vanish at DI ≥ +40% (§7.5)
      // availability check: d20 ≤ stock × 4 + Merchant Skill
      if (qty > 0 && H.d(20) > qty * 4 + shop.skill) qty = 0;
      w.stock[sk][item] = qty;
    }
  }
  w.stockDay = w.day;
};

/* ---------------------------------------------------------------------
   Inventory
   --------------------------------------------------------------------- */
H.weaponObj = (key, opts) => {
  const W = H.WEAPONS[key];
  return Object.assign(
    { uid: H.uid(), key, loaded: 0, lq: 0, whp: W.whp, tainted: false, cocked: false, strung: false, cycle: false, dropped: false },
    opts || {}
  );
};
H.canCarry = (extraWt) => H.weightUsed(H.S.hunter) + extraWt <= H.maxWeight(H.S.hunter) + 1e-9;
H.addWeapon = (key, opts) => {
  const h = H.S.hunter;
  if (!H.canCarry(H.WEAPONS[key].wt)) return null;
  const w = H.weaponObj(key, opts);
  h.weapons.push(w);
  if (!h.hand) h.hand = w.uid;
  return w;
};
H.removeWeapon = (uid) => {
  const h = H.S.hunter;
  h.weapons = h.weapons.filter((w) => w.uid !== uid);
  if (h.hand === uid) h.hand = h.weapons[0] ? h.weapons[0].uid : null;
};
H.inHand = () => {
  const h = H.S.hunter;
  return h.weapons.find((w) => w.uid === h.hand) || null;
};
H.beltUsed = (h) => {
  h = h || H.S.hunter;
  let s = 0;
  for (const t in h.belt) s += (h.belt[t].g + h.belt[t].q) * H.AMMO[t].slots;
  return s;
};
H.beltRoom = (type) => Math.floor((30 - H.beltUsed()) / H.AMMO[type].slots);
H.addAmmo = (type, n, q) => {
  const h = H.S.hunter;
  const room = H.beltRoom(type);
  const total = n + (q || 0);
  const take = Math.min(total, room);
  if (take <= 0) return 0;
  if (!h.belt[type]) h.belt[type] = { g: 0, q: 0 };
  const takeQ = Math.min(q || 0, take);
  h.belt[type].q += takeQ;
  h.belt[type].g += take - takeQ;
  return take;
};
H.ammoCount = (type) => {
  const b = H.S.hunter.belt[type];
  return b ? b.g + b.q : 0;
};
H.findItem = (key) => H.S.hunter.items.find((i) => i.key === key && !i.tainted) || H.S.hunter.items.find((i) => i.key === key);
H.countItem = (key) => H.S.hunter.items.filter((i) => i.key === key).reduce((s, i) => s + (i.n || 1), 0);
H.addItem = (key, n, props) => {
  const h = H.S.hunter;
  n = n || 1;
  const d = H.ITEMS[key];
  if (d && d.wtPer && !H.canCarry(d.wtPer * n)) return false;
  const tainted = !!(props && props.tainted);
  if (key === 'medkit') {
    h.items.push(Object.assign({ key, n: 1, charges: 3 }, props || {}));
    return true;
  }
  const ex = h.items.find((i) => i.key === key && !!i.tainted === tainted && !i.charges);
  if (ex) ex.n = (ex.n || 1) + n;
  else h.items.push(Object.assign({ key, n }, props || {}));
  return true;
};
H.takeItem = (key, n, preferClean) => {
  const h = H.S.hunter;
  n = n || 1;
  const list = h.items.filter((i) => i.key === key).sort((a, b) => (preferClean ? !!a.tainted - !!b.tainted : 0));
  for (const it of list) {
    while (n > 0 && (it.n || 1) > 0) {
      it.n = (it.n || 1) - 1;
      n--;
    }
    if (it.n <= 0) h.items.splice(h.items.indexOf(it), 1);
    if (n <= 0) return true;
  }
  return n <= 0;
};
H.itemName = (it) => {
  const d = H.ITEMS[it.key];
  let s = it.name || (d ? d.name : it.key);
  if (it.key === 'medkit') s += ` (${it.charges}/3)`;
  return s;
};

/* ---------------------------------------------------------------------
   Log
   --------------------------------------------------------------------- */
H.log = (html, cls) => {
  if (!H.S) return;
  H.S.log.push({ h: html, c: cls || '' });
  if (H.S.log.length > 160) H.S.log.splice(0, H.S.log.length - 160);
  H.ui && H.ui.appendLog && H.ui.appendLog(H.S.log[H.S.log.length - 1]);
};
H.ref = (sec) => (H.settings && H.settings.cite ? `<span class="ref">§${sec}</span>` : '');
H.say = (who, line, cls) => H.log(`<span class="who">${who}:</span> <q>${line}</q>`, 'speech ' + (cls || ''));

/* ---------------------------------------------------------------------
   Save / load
   --------------------------------------------------------------------- */
H.settings = { vol: 0.7, music: true, sfxOn: true, cite: false, fast: false };
H.loadSettings = () => {
  try {
    const s = JSON.parse(localStorage.getItem(H.KEY + 'settings') || 'null');
    if (s) Object.assign(H.settings, s);
  } catch (e) {}
};
H.saveSettings = () => {
  try {
    localStorage.setItem(H.KEY + 'settings', JSON.stringify(H.settings));
  } catch (e) {}
};
H.snapshot = () => JSON.stringify(Object.assign({ v: H.SAVE_VERSION, savedAt: Date.now() }, H.S));
H.saveTo = (slot) => {
  if (!H.S || H.S.phase !== 'game') return false;
  try {
    localStorage.setItem(H.KEY + slot, H.snapshot());
    return true;
  } catch (e) {
    return false;
  }
};
H.autosave = () => H.saveTo('auto');
H.readSlot = (slot) => {
  try {
    const raw = localStorage.getItem(H.KEY + slot);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
};
H.validSave = (o) => o && o.hunter && o.world && o.scene && Array.isArray(o.log);
H.slotSummary = (o) => {
  if (!H.validSave(o)) return 'Empty';
  const when = o.savedAt ? new Date(o.savedAt).toLocaleString() : '';
  return `${o.hunter.name || 'Unnamed'} — day ${o.world.day} — ${when}`;
};
H.exportSave = () => {
  if (!H.S || H.S.phase !== 'game') return;
  const blob = new Blob([H.snapshot()], { type: 'application/json' });
  const a = document.createElement('a');
  const nm = (H.S.hunter.name || 'hunter').replace(/[^a-z0-9]+/gi, '_');
  a.href = URL.createObjectURL(blob);
  a.download = `${nm}_day${H.S.world.day}.hunt1896.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
};

/* The Ledger of the Dead persists across hunters and saves. */
H.ledger = () => {
  try {
    return JSON.parse(localStorage.getItem(H.KEY + 'ledger') || '[]');
  } catch (e) {
    return [];
  }
};
H.addToLedger = (entry) => {
  const l = H.ledger();
  l.unshift(entry);
  try {
    localStorage.setItem(H.KEY + 'ledger', JSON.stringify(l.slice(0, 50)));
  } catch (e) {}
};

/* ---- js/audio.js ---- */
/* =====================================================================
   HUNT · 1896 — sound. Everything is synthesized with the Web Audio API,
   so there are no audio files to ship.
   Ambient bed: wind, insects, frogs, rain, a distant bell, crows.
   Tension layer: low drone, a dissonant high whine, a heartbeat that
   quickens with danger and with the hunter's wounds.
   ===================================================================== */
'use strict';

H.A = { ctx: null, started: false, mood: 'calm', tension: 0, timers: [] };

H.audioInit = () => {
  const A = H.A;
  if (A.started) {
    if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    A.ctx = new AC();
  } catch (e) {
    return;
  }
  A.started = true;
  const c = A.ctx;
  A.comp = c.createDynamicsCompressor();
  A.comp.threshold.value = -18;
  A.comp.ratio.value = 4;
  A.master = c.createGain();
  A.master.gain.value = H.settings.vol;
  A.master.connect(A.comp).connect(c.destination);
  A.music = c.createGain();
  A.music.gain.value = H.settings.music ? 1 : 0;
  A.music.connect(A.master);
  A.fx = c.createGain();
  A.fx.gain.value = H.settings.sfxOn ? 1 : 0;
  A.fx.connect(A.master);

  // a reverb-ish tail for the bayou (feedback delay network, cheap)
  A.verb = c.createGain();
  A.verb.gain.value = 0.35;
  const d1 = c.createDelay(1), d2 = c.createDelay(1), fb = c.createGain(), lp = c.createBiquadFilter();
  d1.delayTime.value = 0.13; d2.delayTime.value = 0.29; fb.gain.value = 0.45; lp.type = 'lowpass'; lp.frequency.value = 2200;
  A.verb.connect(d1); d1.connect(d2); d2.connect(lp); lp.connect(fb); fb.connect(d1); lp.connect(A.master);

  // noise buffers
  const len = c.sampleRate * 2;
  A.white = c.createBuffer(1, len, c.sampleRate);
  const wd = A.white.getChannelData(0);
  for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
  A.brown = c.createBuffer(1, len, c.sampleRate);
  const bd = A.brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    bd[i] = last * 3.5;
  }

  H.buildAmbience();
  H.setMood(A.mood, true);
};

H.audioApplySettings = () => {
  const A = H.A;
  if (!A.started) return;
  const t = A.ctx.currentTime;
  A.master.gain.setTargetAtTime(H.settings.vol, t, 0.1);
  A.music.gain.setTargetAtTime(H.settings.music ? 1 : 0, t, 0.3);
  A.fx.gain.setTargetAtTime(H.settings.sfxOn ? 1 : 0, t, 0.1);
};

H.noiseSrc = (buf, loop) => {
  const s = H.A.ctx.createBufferSource();
  s.buffer = buf || H.A.white;
  s.loop = !!loop;
  return s;
};

H.buildAmbience = () => {
  const A = H.A,
    c = A.ctx;
  // wind: brown noise through a slowly swept lowpass
  const wind = H.noiseSrc(A.brown, true);
  const wf = c.createBiquadFilter();
  wf.type = 'lowpass';
  wf.frequency.value = 420;
  wf.Q.value = 0.7;
  const wg = c.createGain();
  wg.gain.value = 0.0;
  const lfo = c.createOscillator();
  lfo.frequency.value = 0.07;
  const lfoG = c.createGain();
  lfoG.gain.value = 220;
  lfo.connect(lfoG).connect(wf.frequency);
  wind.connect(wf).connect(wg).connect(A.music);
  wind.start();
  lfo.start();
  A.windGain = wg;

  // rain: white noise band
  const rain = H.noiseSrc(A.white, true);
  const rf = c.createBiquadFilter();
  rf.type = 'bandpass';
  rf.frequency.value = 3500;
  rf.Q.value = 0.4;
  const rg = c.createGain();
  rg.gain.value = 0;
  rain.connect(rf).connect(rg).connect(A.music);
  rain.start();
  A.rainGain = rg;

  // drone: two detuned saws, filtered dark
  const dg = c.createGain();
  dg.gain.value = 0;
  const df = c.createBiquadFilter();
  df.type = 'lowpass';
  df.frequency.value = 180;
  df.Q.value = 3;
  [55, 55.6, 82.4].forEach((f, i) => {
    const o = c.createOscillator();
    o.type = i === 2 ? 'triangle' : 'sawtooth';
    o.frequency.value = f;
    o.connect(df);
    o.start();
  });
  const dl = c.createOscillator();
  dl.frequency.value = 0.11;
  const dlg = c.createGain();
  dlg.gain.value = 60;
  dl.connect(dlg).connect(df.frequency);
  dl.start();
  df.connect(dg).connect(A.music);
  A.droneGain = dg;

  // high dissonant whine (a minor second, trembling)
  const hg = c.createGain();
  hg.gain.value = 0;
  const trem = c.createOscillator();
  trem.frequency.value = 5.5;
  const tremG = c.createGain();
  tremG.gain.value = 0.4;
  const hgIn = c.createGain();
  hgIn.gain.value = 0.6;
  trem.connect(tremG).connect(hgIn.gain);
  trem.start();
  [1244.5, 1318.5, 1975].forEach((f) => {
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    o.connect(hgIn);
    o.start();
  });
  hgIn.connect(hg).connect(A.music);
  hg.connect(A.verb);
  A.whineGain = hg;

  // scheduled one-shots
  const loop = (fn, minMs, maxMs) => {
    const tick = () => {
      try { fn(); } catch (e) {}
      A.timers.push(setTimeout(tick, minMs + Math.random() * (maxMs - minMs)));
    };
    A.timers.push(setTimeout(tick, minMs * Math.random()));
  };
  loop(() => { if (A.insects > 0 && Math.random() < A.insects) H.amb.cricket(); }, 300, 1400);
  loop(() => { if (A.frogs > 0 && Math.random() < A.frogs) H.amb.frog(); }, 1500, 5000);
  loop(() => { if (A.mood === 'uneasy' || A.mood === 'calm') if (Math.random() < 0.18) H.amb.crow(); }, 9000, 22000);
  loop(() => { if (A.mood !== 'town' && Math.random() < (A.mood === 'tense' ? 0.35 : 0.12)) H.amb.bell(); }, 20000, 45000);
  loop(() => { if (A.mood === 'town' && Math.random() < 0.4) H.amb.chatter(); }, 4000, 9000);
  loop(() => { if (H.S && H.S.world && H.weather().storm && Math.random() < 0.3) H.amb.thunder(); }, 8000, 20000);

  // heartbeat scheduler
  const beat = () => {
    const bpm = A.heartBpm || 0;
    if (bpm > 0) H.amb.heart(bpm > 100 ? 1 : 0.7);
    A.timers.push(setTimeout(beat, bpm > 0 ? 60000 / bpm : 600));
  };
  beat();
};

/* Mood: 'town' | 'calm' | 'uneasy' | 'tense' | 'combat' | 'dead' | 'silent' */
H.setMood = (mood, force) => {
  const A = H.A;
  A.mood = mood;
  if (!A.started) return;
  const t = A.ctx.currentTime;
  const night = H.S && H.S.world ? H.isNight() : false;
  const w = H.S && H.S.world ? H.weather() : {};
  const set = (g, v, tc) => g && g.gain.setTargetAtTime(v, t, tc || 1.5);
  const P = {
    town: { wind: 0.08, drone: 0, whine: 0, heart: 0, ins: 0.25, frog: 0.15 },
    calm: { wind: 0.14, drone: 0.02, whine: 0, heart: 0, ins: 0.55, frog: 0.45 },
    uneasy: { wind: 0.16, drone: 0.07, whine: 0.004, heart: 0, ins: 0.35, frog: 0.25 },
    tense: { wind: 0.12, drone: 0.12, whine: 0.012, heart: 72, ins: 0.08, frog: 0.05 },
    combat: { wind: 0.1, drone: 0.15, whine: 0.008, heart: 96, ins: 0, frog: 0 },
    dead: { wind: 0.2, drone: 0.05, whine: 0, heart: 0, ins: 0, frog: 0 },
    silent: { wind: 0.03, drone: 0, whine: 0, heart: 0, ins: 0, frog: 0 },
  }[mood] || {};
  set(A.windGain, P.wind || 0);
  set(A.droneGain, P.drone || 0, 2.5);
  set(A.whineGain, P.whine || 0, 3);
  set(A.rainGain, (w.rain || 0) * 0.05);
  A.insects = (P.ins || 0) * (night ? 1.4 : 0.6);
  A.frogs = (P.frog || 0) * (night ? 1.2 : 0.7);
  // a badly hurt hunter hears their own heart
  let bpm = P.heart || 0;
  if (H.S && H.S.hunter && H.S.phase === 'game') {
    const h = H.S.hunter;
    if (h.hp > 0 && h.hp <= 15 && mood !== 'town' && mood !== 'dead') bpm = Math.max(bpm, 110);
  }
  A.heartBpm = bpm;
  if (H.ui && H.ui.setTension) H.ui.setTension(mood);
};

/* ---------- ambience one-shots ---------- */
H.amb = {};
H.env = (g, t, a, peak, d) => {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
};
H.panner = (x) => {
  const c = H.A.ctx;
  if (c.createStereoPanner) {
    const p = c.createStereoPanner();
    p.pan.value = x;
    return p;
  }
  return c.createGain();
};
H.amb.cricket = () => {
  const c = H.A.ctx,
    t = c.currentTime;
  const o = c.createOscillator();
  o.frequency.value = 4200 + Math.random() * 1500;
  const am = c.createOscillator();
  am.frequency.value = 35 + Math.random() * 25;
  const amg = c.createGain();
  amg.gain.value = 0.5;
  const g = c.createGain();
  const vg = c.createGain();
  vg.gain.value = 0.5;
  am.connect(amg).connect(vg.gain);
  const p = H.panner(Math.random() * 1.6 - 0.8);
  o.connect(vg).connect(g).connect(p).connect(H.A.music);
  const dur = 0.15 + Math.random() * 0.35;
  H.env(g, t, 0.02, 0.012, dur);
  o.start(t); am.start(t);
  o.stop(t + dur + 0.1); am.stop(t + dur + 0.1);
};
H.amb.frog = () => {
  const c = H.A.ctx;
  const n = 2 + Math.floor(Math.random() * 3);
  const base = 90 + Math.random() * 80;
  const p = H.panner(Math.random() * 1.6 - 0.8);
  p.connect(H.A.music);
  for (let i = 0; i < n; i++) {
    const t = c.currentTime + i * 0.18;
    const o = c.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(base * 1.4, t);
    o.frequency.exponentialRampToValueAtTime(base, t + 0.1);
    const f = c.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 500;
    const g = c.createGain();
    o.connect(f).connect(g).connect(p);
    H.env(g, t, 0.01, 0.05, 0.12);
    o.start(t);
    o.stop(t + 0.2);
  }
};
H.amb.crow = () => {
  const c = H.A.ctx;
  const p = H.panner(Math.random() * 1.6 - 0.8);
  p.connect(H.A.music);
  p.connect(H.A.verb);
  const n = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const t = c.currentTime + i * 0.42;
    const o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(620, t);
    o.frequency.exponentialRampToValueAtTime(380, t + 0.3);
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1300;
    f.Q.value = 4;
    const g = c.createGain();
    o.connect(f).connect(g).connect(p);
    H.env(g, t, 0.03, 0.035, 0.3);
    o.start(t);
    o.stop(t + 0.4);
  }
};
H.amb.bell = (loud) => {
  const c = H.A.ctx,
    t = c.currentTime;
  const f0 = loud ? 110 : 196;
  const g = c.createGain();
  g.connect(H.A.music);
  g.connect(H.A.verb);
  [1, 2.0, 2.76, 5.4, 8.9].forEach((m, i) => {
    const o = c.createOscillator();
    o.frequency.value = f0 * m;
    const og = c.createGain();
    og.gain.value = [1, 0.5, 0.35, 0.18, 0.08][i];
    o.connect(og).connect(g);
    o.start(t);
    o.stop(t + 7);
  });
  H.env(g, t, 0.01, loud ? 0.12 : 0.02, loud ? 6 : 4.5);
};
H.amb.chatter = () => {
  // a far-off murmur: band-limited noise with syllable-like bumps
  const c = H.A.ctx,
    t = c.currentTime;
  const s = H.noiseSrc(H.A.brown);
  const f = c.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 500 + Math.random() * 300;
  f.Q.value = 3;
  const g = c.createGain();
  g.gain.value = 0.0001;
  s.connect(f).connect(g).connect(H.A.music);
  let tt = t;
  for (let i = 0; i < 6; i++) {
    g.gain.exponentialRampToValueAtTime(0.03 + Math.random() * 0.03, tt + 0.08);
    g.gain.exponentialRampToValueAtTime(0.002, tt + 0.2);
    tt += 0.18 + Math.random() * 0.15;
  }
  s.start(t);
  s.stop(tt + 0.3);
};
H.amb.thunder = () => {
  const c = H.A.ctx,
    t = c.currentTime;
  const s = H.noiseSrc(H.A.brown);
  const f = c.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 160;
  const g = c.createGain();
  s.connect(f).connect(g).connect(H.A.music);
  H.env(g, t, 0.4, 0.6, 3.5);
  s.start(t);
  s.stop(t + 4.2);
};
H.amb.heart = (vol) => {
  const c = H.A.ctx;
  [0, 0.22].forEach((off, i) => {
    const t = c.currentTime + off;
    const o = c.createOscillator();
    o.frequency.setValueAtTime(i ? 52 : 60, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.15);
    const g = c.createGain();
    o.connect(g).connect(H.A.music);
    H.env(g, t, 0.01, (i ? 0.18 : 0.28) * vol, 0.18);
    o.start(t);
    o.stop(t + 0.3);
  });
};

/* ---------- sound effects ---------- */
H.sfx = (name, opt) => {
  const A = H.A;
  if (!A.started || !H.settings.sfxOn) return;
  const c = A.ctx,
    t = c.currentTime;
  const out = A.fx;
  const burst = (dur, f1, f2, vol, type, q, dest) => {
    const s = H.noiseSrc();
    const f = c.createBiquadFilter();
    f.type = type || 'lowpass';
    f.frequency.setValueAtTime(f1, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    if (q) f.Q.value = q;
    const g = c.createGain();
    s.connect(f).connect(g).connect(dest || out);
    H.env(g, t, 0.003, vol, dur);
    s.start(t);
    s.stop(t + dur + 0.05);
    return g;
  };
  const tone = (f1, f2, dur, vol, type, delay, dest) => {
    const tt = t + (delay || 0);
    const o = c.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, tt);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), tt + dur);
    const g = c.createGain();
    o.connect(g).connect(dest || out);
    H.env(g, tt, 0.005, vol, dur);
    o.start(tt);
    o.stop(tt + dur + 0.05);
  };
  switch (name) {
    case 'pistol':
      burst(0.35, 7000, 200, 0.9);
      tone(140, 40, 0.25, 0.6);
      burst(0.9, 1500, 120, 0.15, 'lowpass', 0, A.verb);
      break;
    case 'rifle':
      burst(0.25, 9000, 400, 1.0, 'highpass');
      burst(0.45, 5000, 150, 0.9);
      tone(110, 35, 0.35, 0.7);
      burst(1.4, 1200, 90, 0.25, 'lowpass', 0, A.verb);
      break;
    case 'shotgun':
      burst(0.6, 6000, 120, 1.0);
      tone(90, 30, 0.5, 0.9);
      burst(1.6, 900, 70, 0.35, 'lowpass', 0, A.verb);
      break;
    case 'click':
      burst(0.03, 6000, 4000, 0.4, 'highpass');
      break;
    case 'reload':
      burst(0.04, 4000, 3000, 0.3, 'bandpass', 3);
      setTimeout(() => H.A.started && burst(0.05, 2500, 2000, 0.3, 'bandpass', 3), 140);
      break;
    case 'bow':
      tone(220, 140, 0.25, 0.4, 'triangle');
      burst(0.2, 3000, 800, 0.25, 'bandpass', 1);
      break;
    case 'xbow':
      tone(160, 60, 0.15, 0.6, 'square');
      burst(0.12, 2000, 300, 0.4);
      break;
    case 'slash':
      burst(0.22, 1200, 6000, 0.45, 'bandpass', 2);
      break;
    case 'thud':
      burst(0.18, 600, 80, 0.7);
      tone(80, 40, 0.15, 0.5);
      break;
    case 'hurt':
      burst(0.2, 500, 60, 0.8);
      tone(70, 35, 0.2, 0.6);
      break;
    case 'growl': {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = 75 + Math.random() * 30;
      const v = c.createOscillator();
      v.frequency.value = 9;
      const vg = c.createGain();
      vg.gain.value = 12;
      v.connect(vg).connect(o.frequency);
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 500;
      f.Q.value = 2;
      const g = c.createGain();
      o.connect(f).connect(g).connect(out);
      H.env(g, t, 0.15, 0.35, 0.9);
      o.start(t); v.start(t);
      o.stop(t + 1.2); v.stop(t + 1.2);
      break;
    }
    case 'scream': {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(380, t);
      o.frequency.linearRampToValueAtTime(290, t + 0.9);
      const v = c.createOscillator();
      v.frequency.value = 7;
      const vg = c.createGain();
      vg.gain.value = 18;
      v.connect(vg).connect(o.frequency);
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 1100;
      f.Q.value = 3;
      const g = c.createGain();
      o.connect(f).connect(g).connect(out);
      g.connect(A.verb);
      H.env(g, t, 0.08, 0.3, 1.0);
      o.start(t); v.start(t);
      o.stop(t + 1.2); v.stop(t + 1.2);
      break;
    }
    case 'howl': {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, t);
      o.frequency.linearRampToValueAtTime(620, t + 0.5);
      o.frequency.linearRampToValueAtTime(430, t + 1.6);
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 900;
      f.Q.value = 6;
      const g = c.createGain();
      o.connect(f).connect(g).connect(out);
      g.connect(A.verb);
      H.env(g, t, 0.2, 0.3, 1.5);
      o.start(t);
      o.stop(t + 1.9);
      break;
    }
    case 'bark':
      burst(0.12, 1500, 400, 0.6, 'bandpass', 2);
      tone(300, 180, 0.12, 0.3, 'sawtooth');
      break;
    case 'boom':
      burst(2.5, 3000, 40, 1.0);
      tone(60, 20, 1.2, 1.0);
      burst(3, 600, 40, 0.5, 'lowpass', 0, A.verb);
      break;
    case 'fire':
      burst(1.2, 300, 2500, 0.5, 'bandpass', 0.8);
      break;
    case 'glass':
      tone(2600, 2400, 0.25, 0.15);
      tone(3400, 3300, 0.2, 0.1, 'sine', 0.05);
      burst(0.15, 8000, 5000, 0.3, 'highpass');
      break;
    case 'coin':
      tone(2500, 2450, 0.18, 0.12);
      tone(3200, 3150, 0.2, 0.1, 'sine', 0.07);
      break;
    case 'dice':
      for (let i = 0; i < 5; i++) setTimeout(() => H.A.started && burst(0.03, 3000, 1500, 0.25, 'bandpass', 4), i * 55 + Math.random() * 30);
      break;
    case 'page':
      burst(0.25, 2500, 6000, 0.12, 'highpass');
      break;
    case 'door': {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, t);
      o.frequency.linearRampToValueAtTime(320, t + 0.5);
      o.frequency.linearRampToValueAtTime(210, t + 0.9);
      const f = c.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = 900;
      f.Q.value = 8;
      const g = c.createGain();
      o.connect(f).connect(g).connect(out);
      H.env(g, t, 0.1, 0.12, 0.8);
      o.start(t);
      o.stop(t + 1);
      break;
    }
    case 'sp':
      [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.6, 0.08, 'sine', i * 0.09));
      break;
    case 'toll':
      H.amb.bell(true);
      break;
    case 'step':
      burst(0.08, 400, 150, 0.25);
      break;
    case 'splash':
      burst(0.5, 2000, 300, 0.4, 'bandpass', 1);
      break;
  }
};

/* ---- js/art.js ---- */
/* =====================================================================
   HUNT · 1896 — scene art. Procedural SVG silhouettes: cypress and moss,
   black water, the structure of the place, the sky by hour, figures when
   something is out there. Seeded so a scene draws the same every time.
   ===================================================================== */
'use strict';

H.artSVG = (kind, o) => {
  o = o || {};
  const R = H.seeded(o.seed || kind);
  const r = (a, b) => a + R() * (b - a);
  const W = 1200,
    Hh = 300;
  const hour = o.hour == null ? 12 : o.hour;
  const night = hour >= 20 || hour < 5;
  const dusk = hour >= 17 && hour < 20;
  const dawn = hour >= 5 && hour < 8;
  let sky = night ? ['#04060a', '#10141b'] : dusk ? ['#140b0c', '#6e2f1a'] : dawn ? ['#1c1418', '#7c5236'] : ['#262a29', '#6d6c60'];
  if (o.danger) sky = night ? ['#0a0303', '#2a0b08'] : ['#1a0707', '#5a1a10'];
  if (kind === 'dead') sky = ['#000', '#1a0404'];
  const ink = o.danger ? '#0b0303' : '#07080a';
  const mid = o.danger ? '#1d0907' : night ? '#0b0e12' : '#1a1c1a';
  const far = o.danger ? '#2b100b' : night ? '#121720' : dusk ? '#3a1d16' : '#3a3c36';
  const water = ['shack', 'dock', 'mill', 'road', 'town', 'water', 'plantation', 'title'].includes(kind) || o.water;
  const horizon = water ? 205 : 235;
  const p = [];

  p.push(`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
    <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[1]}" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffb34d" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#e8e2c8" stop-opacity=".9"/><stop offset=".25" stop-color="#cfc8a8" stop-opacity=".35"/><stop offset="1" stop-color="#cfc8a8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>`);
  p.push(`<rect width="${W}" height="${Hh}" fill="url(#sky)"/>`);

  // moon or a smear of sun
  if (night || kind === 'title') {
    const mx = r(750, 1050),
      my = r(45, 85);
    p.push(`<circle cx="${mx}" cy="${my}" r="90" fill="url(#moon)"/><circle cx="${mx}" cy="${my}" r="17" fill="#ddd6bb" opacity=".85"/>`);
    for (let i = 0; i < 40; i++) p.push(`<circle cx="${r(0, W)}" cy="${r(0, 140)}" r="${r(0.4, 1.2)}" fill="#cfc8a8" opacity="${r(0.15, 0.6)}"/>`);
  } else if (dusk || dawn) {
    p.push(`<ellipse cx="${r(200, 1000)}" cy="${horizon - 20}" rx="220" ry="40" fill="#ff8a3d" opacity=".18" filter="url(#blur)"/>`);
  }
  // cloud bands
  for (let i = 0; i < 5; i++) {
    const y = r(20, 130);
    p.push(`<ellipse cx="${r(0, W)}" cy="${y}" rx="${r(150, 380)}" ry="${r(8, 20)}" fill="${night ? '#0d1016' : '#2b2c2a'}" opacity="${r(0.25, 0.55)}" filter="url(#blur)"/>`);
  }

  // far tree line
  let d = `M0 ${horizon} `;
  for (let x = 0; x <= W; x += 18) d += `L${x} ${horizon - r(18, 55)} `;
  d += `L${W} ${horizon} Z`;
  p.push(`<path d="${d}" fill="${far}" opacity=".9"/>`);

  // water
  if (water) {
    p.push(`<rect y="${horizon}" width="${W}" height="${Hh - horizon}" fill="url(#wat)"/>`);
    for (let i = 0; i < 14; i++) {
      const y = r(horizon + 6, Hh - 4);
      p.push(`<line x1="${r(0, W)}" y1="${y}" x2="${r(0, W)}" y2="${y}" stroke="#9a9580" stroke-opacity="${r(0.04, 0.12)}" stroke-width="1"/>`);
    }
  } else {
    p.push(`<rect y="${horizon}" width="${W}" height="${Hh - horizon}" fill="${ink}"/>`);
  }

  // cypress with moss
  const cypress = (x, base, h, col) => {
    const w = h * 0.09;
    let s = `<g fill="${col}">`;
    s += `<path d="M${x - w * 1.8} ${base} Q${x - w * 0.6} ${base - h * 0.15} ${x - w * 0.5} ${base - h * 0.75} L${x + w * 0.5} ${base - h * 0.75} Q${x + w * 0.6} ${base - h * 0.15} ${x + w * 1.8} ${base} Z"/>`;
    const crown = base - h * 0.72;
    for (let i = 0; i < 6; i++) s += `<ellipse cx="${x + r(-h * 0.22, h * 0.22)}" cy="${crown - r(0, h * 0.28)}" rx="${r(h * 0.12, h * 0.22)}" ry="${r(h * 0.05, h * 0.09)}"/>`;
    s += `</g><g stroke="${col}" stroke-width="1.2" opacity=".8">`;
    for (let i = 0; i < 9; i++) {
      const mx = x + r(-h * 0.25, h * 0.25);
      const my = crown - r(-h * 0.02, h * 0.15);
      s += `<line x1="${mx}" y1="${my}" x2="${mx + r(-3, 3)}" y2="${my + r(h * 0.08, h * 0.25)}"/>`;
    }
    s += '</g>';
    if (water) s += `<g opacity=".18" transform="translate(0 ${2 * base}) scale(1 -1)"><path d="M${x - w} ${base} L${x + w} ${base} L${x} ${base - h * 0.5} Z" fill="${col}"/></g>`;
    return s;
  };
  for (let i = 0; i < 7; i++) p.push(cypress(r(0, W), horizon + r(-4, 6), r(90, 150), mid));

  // the structure of the place
  const sx = r(380, 760);
  const lamp = (x, y) => `<circle cx="${x}" cy="${y}" r="34" fill="url(#glow)" opacity="${night || dusk ? 0.9 : 0.35}"/><rect x="${x - 4}" y="${y - 5}" width="8" height="10" fill="#ffcf7a" opacity="${night || dusk ? 0.95 : 0.5}"/>`;
  const S = [];
  switch (kind) {
    case 'shack':
      S.push(`<g fill="${ink}"><rect x="${sx}" y="${horizon - 95}" width="150" height="70"/><path d="M${sx - 14} ${horizon - 92} L${sx + 70} ${horizon - 140} L${sx + 164} ${horizon - 92} Z"/>`);
      for (let i = 0; i < 6; i++) S.push(`<rect x="${sx + 6 + i * 27}" y="${horizon - 26}" width="5" height="40"/>`);
      S.push(`<rect x="${sx - 40}" y="${horizon - 30}" width="60" height="5"/></g>`);
      S.push(lamp(sx + 110, horizon - 62));
      break;
    case 'church': {
      const inv = R() < 0.5;
      S.push(`<g fill="${ink}"><rect x="${sx}" y="${horizon - 110}" width="190" height="110"/><path d="M${sx - 10} ${horizon - 108} L${sx + 95} ${horizon - 165} L${sx + 200} ${horizon - 108} Z"/>`);
      S.push(`<rect x="${sx + 70}" y="${horizon - 230}" width="50" height="80" transform="rotate(${r(-4, 4)} ${sx + 95} ${horizon - 150})"/><path d="M${sx + 64} ${horizon - 228} L${sx + 95} ${horizon - 268} L${sx + 126} ${horizon - 228} Z"/>`);
      S.push(inv ? `<rect x="${sx + 93}" y="${horizon - 300}" width="4" height="32"/><rect x="${sx + 85}" y="${horizon - 278}" width="20" height="4"/>` : `<rect x="${sx + 93}" y="${horizon - 300}" width="4" height="32"/><rect x="${sx + 85}" y="${horizon - 292}" width="20" height="4"/>`);
      S.push('</g>');
      for (let i = 0; i < 8; i++) S.push(`<rect x="${sx - 160 + i * 40 + r(-6, 6)}" y="${horizon - r(18, 30)}" width="${r(10, 16)}" height="30" fill="${ink}" transform="rotate(${r(-12, 12)} ${sx - 150 + i * 40} ${horizon})"/>`);
      S.push(`<rect x="${sx + 82}" y="${horizon - 80}" width="26" height="40" fill="#ffb34d" opacity="${night ? 0.25 : 0.08}"/>`);
      break;
    }
    case 'mill':
      S.push(`<g fill="${ink}"><rect x="${sx}" y="${horizon - 120}" width="260" height="120"/><path d="M${sx - 10} ${horizon - 118} L${sx + 130} ${horizon - 170} L${sx + 270} ${horizon - 118} Z"/><rect x="${sx + 40}" y="${horizon - 210}" width="22" height="70"/></g>`);
      S.push(`<g stroke="${ink}" stroke-width="7" fill="none"><circle cx="${sx - 40}" cy="${horizon - 50}" r="55"/>`);
      for (let a = 0; a < 8; a++) S.push(`<line x1="${sx - 40}" y1="${horizon - 50}" x2="${sx - 40 + 55 * Math.cos(a * 0.785)}" y2="${horizon - 50 + 55 * Math.sin(a * 0.785)}"/>`);
      S.push('</g>');
      S.push(lamp(sx + 200, horizon - 70));
      break;
    case 'farm':
      S.push(`<g fill="${ink}"><rect x="${sx - 160}" y="${horizon - 90}" width="140" height="90"/><path d="M${sx - 172} ${horizon - 88} L${sx - 90} ${horizon - 135} L${sx - 8} ${horizon - 88} Z"/>`);
      S.push(`<rect x="${sx + 60}" y="${horizon - 120}" width="170" height="120"/><path d="M${sx + 45} ${horizon - 110} L${sx + 80} ${horizon - 165} L${sx + 210} ${horizon - 165} L${sx + 245} ${horizon - 110} Z"/>`);
      S.push(`<rect x="${sx - 10}" y="${horizon - 34}" width="70" height="16"/><circle cx="${sx}" cy="${horizon - 12}" r="13"/><circle cx="${sx + 50}" cy="${horizon - 12}" r="13"/></g>`);
      S.push(lamp(sx - 110, horizon - 55));
      break;
    case 'cemetery':
      for (let i = 0; i < 14; i++) {
        const x = r(40, W - 40),
          y = horizon + r(-8, 30),
          t = R();
        if (t < 0.5) S.push(`<g fill="${ink}" transform="rotate(${r(-15, 15)} ${x} ${y})"><rect x="${x - 2}" y="${y - 38}" width="5" height="38"/><rect x="${x - 12}" y="${y - 30}" width="25" height="5"/></g>`);
        else if (t < 0.8) S.push(`<path d="M${x - 12} ${y} L${x - 12} ${y - 26} Q${x} ${y - 40} ${x + 12} ${y - 26} L${x + 12} ${y} Z" fill="${ink}"/>`);
        else S.push(`<g fill="${ink}"><rect x="${x - 30}" y="${y - 55}" width="60" height="55"/><path d="M${x - 36} ${y - 53} L${x} ${y - 80} L${x + 36} ${y - 53} Z"/></g>`);
      }
      S.push(`<g stroke="${ink}" stroke-width="3">`);
      for (let x = 0; x < W; x += 16) S.push(`<line x1="${x}" y1="${Hh}" x2="${x}" y2="${Hh - 46}"/>`);
      S.push(`<line x1="0" y1="${Hh - 40}" x2="${W}" y2="${Hh - 40}"/></g>`);
      break;
    case 'dock':
      S.push(`<g fill="${ink}"><rect x="${sx}" y="${horizon - 100}" width="200" height="85"/><path d="M${sx - 12} ${horizon - 98} L${sx + 100} ${horizon - 150} L${sx + 212} ${horizon - 98} Z"/><rect x="${sx - 300}" y="${horizon - 18}" width="320" height="8"/>`);
      for (let i = 0; i < 10; i++) S.push(`<rect x="${sx - 295 + i * 34}" y="${horizon - 18}" width="5" height="45"/>`);
      S.push('</g>');
      S.push(lamp(sx - 260, horizon - 40));
      break;
    case 'camp':
      for (let i = 0; i < 3; i++) {
        const x = sx - 200 + i * 170;
        S.push(`<path d="M${x - 50} ${horizon + 10} L${x} ${horizon - 60} L${x + 50} ${horizon + 10} Z" fill="${ink}"/>`);
      }
      S.push(`<circle cx="${sx + 80}" cy="${horizon + 18}" r="${night ? 60 : 30}" fill="url(#glow)" opacity="${night ? 0.6 : 0.2}"/>`);
      S.push(`<rect x="${sx + 270}" y="${horizon - 150}" width="60" height="40" fill="${ink}"/><g stroke="${ink}" stroke-width="5"><line x1="${sx + 275}" y1="${horizon - 110}" x2="${sx + 275}" y2="${horizon + 20}"/><line x1="${sx + 325}" y1="${horizon - 110}" x2="${sx + 325}" y2="${horizon + 20}"/></g>`);
      break;
    case 'town':
    case 'title': {
      let x = 80;
      while (x < W - 60) {
        const bw = r(70, 140),
          bh = r(70, 150),
          lean = r(-3, 3);
        S.push(`<g transform="rotate(${lean} ${x + bw / 2} ${horizon})"><rect x="${x}" y="${horizon - bh}" width="${bw}" height="${bh}" fill="${ink}"/><path d="M${x - 6} ${horizon - bh + 2} L${x + bw / 2} ${horizon - bh - r(20, 45)} L${x + bw + 6} ${horizon - bh + 2} Z" fill="${ink}"/>`);
        for (let k = 0; k < 2; k++) if (R() < 0.6) S.push(`<rect x="${x + r(10, bw - 22)}" y="${horizon - bh + r(20, bh - 40)}" width="12" height="16" fill="#ffb34d" opacity="${night || dusk ? r(0.5, 0.9) : 0.12}"/>`);
        S.push('</g>');
        x += bw + r(4, 22);
      }
      S.push(`<rect x="0" y="${horizon}" width="${W}" height="7" fill="${ink}"/>`);
      for (let i = 0; i < 4; i++) S.push(lamp(r(100, W - 100), horizon - r(10, 30)));
      break;
    }
    case 'office':
      S.push(`<g fill="${ink}"><rect x="${sx}" y="${horizon - 115}" width="230" height="115"/><path d="M${sx - 14} ${horizon - 112} L${sx + 115} ${horizon - 160} L${sx + 244} ${horizon - 112} Z"/><rect x="${sx - 30}" y="${horizon - 52}" width="290" height="6"/><rect x="${sx - 26}" y="${horizon - 52}" width="5" height="52"/><rect x="${sx + 251}" y="${horizon - 52}" width="5" height="52"/></g>`);
      S.push(`<rect x="${sx + 40}" y="${horizon - 95}" width="30" height="26" fill="#ffb34d" opacity=".55"/><rect x="${sx + 160}" y="${horizon - 95}" width="30" height="26" fill="#ffb34d" opacity=".4"/>`);
      S.push(lamp(sx - 20, horizon - 70));
      break;
    case 'tavern':
      S.push(`<g fill="${ink}"><rect x="${sx - 60}" y="${horizon - 140}" width="300" height="140"/><path d="M${sx - 74} ${horizon - 138} L${sx + 90} ${horizon - 190} L${sx + 254} ${horizon - 138} Z"/><rect x="${sx + 260}" y="${horizon - 110}" width="6" height="40"/><rect x="${sx + 236}" y="${horizon - 112}" width="54" height="5"/><rect x="${sx + 244}" y="${horizon - 104}" width="40" height="28"/></g>`);
      for (let i = 0; i < 4; i++) S.push(`<rect x="${sx - 40 + i * 70}" y="${horizon - 110}" width="26" height="30" fill="#ffb34d" opacity="${night || dusk ? 0.75 : 0.25}"/>`);
      break;
    case 'plantation':
      S.push(`<g fill="${ink}"><rect x="${sx - 120}" y="${horizon - 150}" width="380" height="150"/><path d="M${sx - 140} ${horizon - 148} L${sx + 70} ${horizon - 210} L${sx + 280} ${horizon - 148} Z"/>`);
      for (let i = 0; i < 7; i++) S.push(`<rect x="${sx - 110 + i * 58}" y="${horizon - 140}" width="9" height="140" fill="#2a2a26"/>`);
      S.push('</g>');
      for (let i = 0; i < 26; i++) S.push(`<path d="M${r(0, W)} ${r(horizon - 10, Hh)} q4 -10 9 0" stroke="#3b6fb0" stroke-width="2" fill="none" opacity="${r(0.3, 0.8)}"/>`);
      break;
    case 'road':
      S.push(`<path d="M${W / 2 - 30} ${horizon} L${W / 2 + 30} ${horizon} L${W / 2 + 260} ${Hh} L${W / 2 - 260} ${Hh} Z" fill="#1d1a14" opacity=".85"/>`);
      break;
    case 'dead':
      S.push(`<g fill="#000"><rect x="${W / 2 - 3}" y="${horizon - 120}" width="7" height="120"/><rect x="${W / 2 - 38}" y="${horizon - 95}" width="76" height="7"/></g>`);
      break;
  }
  p.push(S.join(''));

  // figures — the things out there
  const fig = (x, base, sc, kindF) => {
    if (kindF === 'hound') return `<path transform="translate(${x} ${base}) scale(${sc})" fill="#000" d="M-30 0 L-26 -16 Q-30 -26 -18 -28 L10 -26 Q22 -36 30 -30 L36 -24 L30 -20 L24 -22 L20 -10 L22 0 L17 0 L14 -12 L-14 -12 L-18 0 L-23 0 L-22 -12 Z"/>`;
    if (kindF === 'big') return `<path transform="translate(${x} ${base}) scale(${sc})" fill="#000" d="M-30 0 L-24 -60 Q-40 -90 -10 -105 Q20 -112 30 -90 L36 -60 L30 0 L14 0 L10 -40 L-8 -40 L-14 0 Z"/>`;
    return `<path transform="translate(${x} ${base}) scale(${sc})" fill="#000" d="M-9 0 L-7 -30 Q-16 -36 -14 -52 L-20 -38 L-23 -40 L-16 -60 Q-12 -66 -4 -66 Q-6 -78 2 -80 Q10 -78 8 -68 Q16 -64 18 -54 L22 -36 L18 -35 L13 -48 L11 -30 L9 0 L4 0 L2 -26 L-2 -26 L-4 0 Z"/>`;
  };
  if (o.figures && o.figures.length) {
    o.figures.slice(0, 7).forEach((f, i) => {
      const x = 180 + ((i * 157) % 860) + r(-30, 30);
      p.push(fig(x, horizon + r(14, 40), r(0.8, 1.15), f));
    });
  }

  // fog bands
  if (o.fog) for (let i = 0; i < 4 + o.fog * 3; i++) p.push(`<ellipse cx="${r(0, W)}" cy="${r(horizon - 30, Hh)}" rx="${r(200, 420)}" ry="${r(14, 30)}" fill="#a9a89a" opacity="${0.05 + 0.03 * o.fog}" filter="url(#blur)"/>`);

  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${p.join('')}</svg>`;
};

/* ---- js/ui.js ---- */
/* =====================================================================
   HUNT · 1896 — interface: scene machinery, the narrative log, choices,
   the dice panel, the hunter's sheet, menus and modals.
   ===================================================================== */
'use strict';

H.ui = {};
H.scenes = {};

/* ---------------------------------------------------------------------
   Scene machinery
   A scene is { art(p), mood, enter(p), opts(p) }. State only stores the
   scene id and its params, so any scene can be re-rendered after a load.
   --------------------------------------------------------------------- */
H.go = (id, p, opts) => {
  opts = opts || {};
  const sc = H.scenes[id];
  if (!sc) throw new Error('No scene: ' + id);
  const token = { id, p: p || {} };
  H.S.scene = token;
  H.ui.busy = null;
  if (!opts.noEnter && sc.enter) sc.enter(token.p);
  if (H.S.scene !== token) return; // enter() redirected somewhere else
  H.ui.render();
  if (H.S.phase === 'game') H.autosave();
};
H.refresh = () => {
  H.ui.render();
  if (H.S && H.S.phase === 'game') H.autosave();
};
H.curScene = () => (H.S && H.S.scene ? H.scenes[H.S.scene.id] : null);

H.ui.render = () => {
  if (!H.S) return;
  H.ui.renderArt();
  H.ui.renderChoices();
  H.ui.renderSheet();
  H.ui.renderTop();
  const sc = H.curScene();
  if (sc) {
    const mood = typeof sc.mood === 'function' ? sc.mood(H.S.scene.p) : sc.mood;
    if (mood) H.setMood(mood);
  }
};

H.ui.renderTop = () => {
  const t = H.$('#where');
  if (!t || !H.S) return;
  if (H.S.phase !== 'game') {
    t.textContent = '';
    return;
  }
  const w = H.S.world;
  t.innerHTML = `<span>${H.esc(H.date())}</span><span class="sep">·</span><span>${H.cap(H.tod().name)}</span><span class="sep">·</span><span>${H.esc(H.weather().name)}</span><span class="sep">·</span><span title="Desperation Index (§7.5)">Desperation ${w.di >= 0 ? '+' : ''}${w.di}% <em>${H.diMood(w.di)}</em></span>`;
};

H.ui.renderArt = () => {
  const box = H.$('#art');
  if (!box) return;
  const sc = H.curScene();
  let a = { kind: 'title' };
  if (sc && sc.art) a = sc.art(H.S.scene.p) || a;
  const w = H.S.world;
  const wt = w ? H.weather() : {};
  const key = JSON.stringify([a, w ? w.hour : 0, w ? w.weather : '']);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = H.artSVG(a.kind, {
    seed: a.seed || a.kind,
    hour: w ? w.hour : 21,
    danger: a.danger,
    figures: a.figures,
    fog: (wt.fog || 0) + (a.fog || 0),
    water: a.water,
  });
  box.className = 'art' + (wt.rain ? ' rain' + wt.rain : '') + (a.danger ? ' danger' : '');
  const cap = H.$('#artcap');
  if (cap) cap.textContent = a.caption || '';
};

/* ---------- the narrative log ---------- */
H.ui.renderLog = () => {
  const box = H.$('#log');
  if (!box || !H.S) return;
  box.innerHTML = '';
  const start = Math.max(0, H.S.log.length - 80);
  for (let i = start; i < H.S.log.length; i++) box.appendChild(H.ui.logNode(H.S.log[i], true));
  H.ui.scrollLog();
};
H.ui.logNode = (e, old) => H.el('div', { class: 'entry ' + (e.c || '') + (old ? ' old' : ''), html: e.h });
H.ui.appendLog = (e) => {
  const box = H.$('#log');
  if (!box) return;
  const node = H.ui.logNode(e);
  if (H.ui.markNext || !H.ui.turnNode || !H.ui.turnNode.isConnected) {
    H.ui.markNext = false;
    H.ui.turnNode = node;
  }
  box.appendChild(node);
  while (box.children.length > 120) box.removeChild(box.firstChild);
  H.ui.scrollLog();
};
/* Show the newest text: if this turn produced more than a screenful, start where it begins
   so it reads top-down; otherwise settle at the bottom with the choices in view. */
H.ui.scrollLog = () => {
  const s = H.$('#story');
  if (!s) return;
  const go = () => {
    const n = H.ui.turnNode;
    if (n && n.isConnected) {
      const top = n.offsetTop - 14;
      if (s.scrollHeight - top > s.clientHeight) {
        s.scrollTop = top;
        return;
      }
    }
    s.scrollTop = s.scrollHeight;
  };
  go();
  requestAnimationFrame(go);
};
H.ui.divider = () => H.log('<span class="rule">❦</span>', 'divider');

/* ---------- choices ---------- */
H.ui.renderChoices = () => {
  const box = H.$('#choices');
  if (!box) return;
  if (H.ui.busy) return; // a dice panel owns the space
  box.innerHTML = '';
  if (H.S.combat && H.S.scene.id === 'combat') {
    H.combatUI(box);
    H.ui.scrollLog();
    return;
  }
  const sc = H.curScene();
  if (sc && sc.custom) {
    sc.custom(box, H.S.scene.p);
    return;
  }
  if (!sc || !sc.opts) return;
  let opts = sc.opts(H.S.scene.p) || [];
  opts = opts.filter(Boolean);
  const head = sc.prompt ? sc.prompt(H.S.scene.p) : null;
  if (head) box.appendChild(H.el('div', { class: 'prompt', html: head }));
  const list = H.el('div', { class: 'opts' });
  let n = 0;
  for (const o of opts) {
    if (o.hdr) {
      list.appendChild(H.el('div', { class: 'opthdr', html: o.hdr }));
      continue;
    }
    n++;
    const dis = !!o.dis;
    const b = H.el(
      'button',
      {
        class: 'opt ' + (o.cls || '') + (dis ? ' disabled' : ''),
        'data-n': n,
        disabled: dis ? true : null,
        title: typeof o.dis === 'string' ? o.dis : o.tip || null,
      },
      H.el('span', { class: 'num', text: `{${n}}` }),
      H.el('span', { class: 'txt', html: o.t + (o.note ? ` <span class="note">${o.note}</span>` : '') + (typeof o.dis === 'string' ? ` <span class="why">— ${H.esc(o.dis)}</span>` : '') })
    );
    if (!dis)
      b.addEventListener('click', () => {
        H.audioInit();
        H.ui.markNext = true;
        H.sfx('page');
        try {
          o.act();
        } catch (err) {
          H.ui.crash(err);
        }
      });
    list.appendChild(b);
  }
  box.appendChild(list);
  if (sc.freeform !== false && H.S.phase === 'game') box.appendChild(H.el('div', { class: 'standing', text: 'Choose your action.' }));
  H.ui.scrollLog();
};

/* ---------- the dice panel (§1.5: the player rolls for the hunter; math shown back) ---------- */
/* cfg: { title, skill?, ability?, save?, mods?, dc, adv, dis, onDone(res), note, noSP } */
H.check = (cfg) => {
  const h = H.S.hunter;
  let mods = [];
  let label = cfg.title || 'Check';
  if (cfg.skill) {
    mods = H.skillMods(h, cfg.skill);
    label = cfg.title || cfg.skill;
  } else if (cfg.ability) {
    mods = [{ n: cfg.ability, v: H.am(h, cfg.ability), always: true }];
  }
  if (cfg.mods) mods = mods.concat(cfg.mods);
  const info = H.dcInfo(cfg.dc);
  const box = H.$('#choices');
  const doRoll = (useSP) => {
    H.audioInit();
    let adv = !!cfg.adv;
    if (useSP && h.sp > 0 && !adv) {
      h.sp--;
      adv = true;
      h.armedSP = false;
      H.log('<span class="sp">✦ Story Point spent for advantage.</span>', 'sys');
    }
    const r = H.d20(adv, cfg.dis);
    const total = r.die + H.modsSum(mods);
    const success = total >= cfg.dc;
    H.sfx('dice');
    H.log(
      `<span class="roll">🎲 ${H.esc(label)}: 1d20 (${H.diceText(r)})${H.modsText(mods)} = <b>${total}</b></span> · <em>${info.label}</em> — ${success ? '<span class="good">success</span>' : '<span class="bad">failure</span>'}${cfg.ref ? ' ' + H.ref(cfg.ref) : ''}`,
      'rollline'
    );
    H.ui.busy = null;
    cfg.onDone({ total, die: r.die, success, nat20: r.die === 20, nat1: r.die === 1, margin: total - cfg.dc });
    if (H.ui.busy == null) H.refresh();
  };
  if (H.settings.fast) {
    doRoll(h.armedSP);
    return;
  }
  H.ui.busy = 'roll';
  box.innerHTML = '';
  const formula = `1d20${H.modsText(mods)}`;
  const advTxt = cfg.adv && !cfg.dis ? ' with advantage' : cfg.dis && !cfg.adv ? ' with disadvantage' : '';
  const spRow =
    h.sp > 0 && !cfg.noSP && !cfg.adv
      ? H.el('label', { class: 'sprow' }, H.el('input', { type: 'checkbox', id: 'useSP', checked: h.armedSP ? true : null }), ` Spend a Story Point for advantage (${h.sp} held)`)
      : null;
  const btn = H.el('button', { class: 'rollbtn' }, '🎲 Roll the bones');
  const panel = H.el(
    'div',
    { class: 'rollpanel' },
    H.el('div', { class: 'rp-title', html: H.esc(label) + (cfg.note ? ` <span class="note">${cfg.note}</span>` : '') }),
    H.el('div', { class: 'rp-dc', html: `“${info.say}”` }),
    H.el('div', { class: 'rp-formula', text: `Roll ${formula}${advTxt}` }),
    spRow,
    btn,
    cfg.cancel ? H.el('button', { class: 'cancelbtn', onclick: () => { H.ui.busy = null; H.refresh(); } }, 'Think better of it') : null
  );
  box.appendChild(panel);
  H.ui.scrollLog();
  btn.addEventListener('click', () => {
    btn.disabled = true;
    const sp = !!(H.$('#useSP') && H.$('#useSP').checked);
    const face = H.el('div', { class: 'die-anim' });
    panel.appendChild(face);
    let k = 0;
    const iv = setInterval(() => {
      face.textContent = String(H.d(20));
      if (++k > 7) {
        clearInterval(iv);
        doRoll(sp);
      }
    }, 45);
  });
  btn.focus();
};

/* A hidden roll the DM makes (§1.5) — logged quietly, no number shown. */
H.hidden = (mod, dc) => H.d(20) + mod >= dc;

/* ---------- the hunter's sheet ---------- */
H.ui.bars = (h) => {
  const avail = H.availBars(h),
    pen = H.infPen(h);
  let s = '<div class="bars">';
  for (let i = 1; i <= 5; i++) {
    const lo = (i - 1) * 10;
    let cls = 'bar',
      fill = 0;
    if (i > h.bars) cls += ' burned';
    else if (i > avail) cls += ' infected';
    else {
      fill = H.clamp((h.hp - lo) / 10, 0, 1);
      if (i === avail && h.fireBurn) cls += ' scorched';
    }
    s += `<div class="${cls}" title="Bar ${6 - i}"><div class="fill" style="width:${fill * 100}%"></div></div>`;
  }
  s += '</div>';
  void pen;
  return s;
};
H.ui.renderSheet = () => {
  const box = H.$('#sheet');
  if (!box) return;
  if (!H.S || H.S.phase !== 'game' || !H.S.hunter || !H.S.hunter.name) {
    box.innerHTML = '<div class="sheet-empty">No hunter yet.</div>';
    return;
  }
  const h = H.S.hunter,
    w = H.S.world;
  const inCombat = !!H.S.combat;
  const free = !inCombat && !H.ui.busy && H.S.scene.id !== 'dead';
  const sp = '✦'.repeat(h.sp) + '<span class="dimsp">' + '✧'.repeat(3 - h.sp) + '</span>';
  const ab = H.ABILS.map((A) => {
    const v = H.abil(h, A);
    const changed = v !== h.base[A];
    return `<div class="ab${changed ? ' changed' : ''}"><b>${A}</b><span>${v}</span><i>${H.sgn(H.mod(v))}</i></div>`;
  }).join('');
  const banes = H.BANES.filter((b) => h.banes[b]);
  const weapons = h.weapons
    .map((wp) => {
      const W = H.WEAPONS[wp.key];
      const inHand = wp.uid === h.hand;
      let ammo = '';
      if (W.cap) ammo = `${wp.loaded}/${W.cap}`;
      const extra = [];
      if (W.reload === 'twostep') extra.push(wp.cocked ? 'half-cocked' : '');
      if (W.reload === 'xbow') extra.push(wp.strung ? 'drawn' : 'undrawn');
      if (W.boltAction && wp.cycle) extra.push('cycle bolt');
      if (wp.dropped) extra.push('DROPPED');
      const btns = [];
      if (free && !inHand) btns.push(`<button class="mini" data-act="equip" data-uid="${wp.uid}">in hand</button>`);
      if (free && W.cap && wp.loaded < W.cap && H.ammoCount(W.ammo) > 0) btns.push(`<button class="mini" data-act="load" data-uid="${wp.uid}">load</button>`);
      if (free) btns.push(`<button class="mini ghost" data-act="dropw" data-uid="${wp.uid}">drop</button>`);
      return `<div class="wpn${inHand ? ' hand' : ''}"><div class="wname">${inHand ? '☛ ' : ''}${W.name}${wp.tainted ? ' <span class="taint" title="Tainted 1 (§7.9)">☠</span>' : ''}</div>
        <div class="wstat">${ammo ? `<span title="loaded">${ammo}</span>` : ''}<span title="Weapon HP">WHP ${wp.whp}/${W.whp}</span><span class="dim">${extra.filter(Boolean).join(' · ')}</span></div>
        <div class="wbtns">${btns.join('')}</div></div>`;
    })
    .join('');
  const belt = Object.keys(h.belt)
    .filter((t) => h.belt[t].g + h.belt[t].q > 0)
    .map((t) => {
      const b = h.belt[t];
      const sortBtn = free && b.q > 0 ? `<button class="mini" data-act="sort" data-type="${t}">sort</button>` : '';
      return `<div class="beltrow"><span>${t}</span><span>${b.g}${b.q ? ` <em title="questionable — may be duds (§7.9)">+${b.q}?</em>` : ''}</span>${sortBtn}</div>`;
    })
    .join('');
  const items = h.items
    .map((it, idx) => {
      const btns = [];
      if (free && (it.key === 'fak' || it.key === 'medkit') && h.hp < H.maxHp(h)) btns.push(`<button class="mini" data-act="heal" data-idx="${idx}">use</button>`);
      if (free && ['fak', 'medkit', 'liquor'].includes(it.key) && h.infections.some((i) => i.stage === 'window' || i.stage === 'set')) btns.push(`<button class="mini" data-act="clean" data-idx="${idx}">clean wound</button>`);
      return `<div class="item"><span>${H.esc(H.itemName(it))}${it.n > 1 ? ` ×${it.n}` : ''}${it.tainted ? ' <span class="taint" title="Tainted 1">☠</span>' : ''}</span>${btns.join('')}</div>`;
    })
    .join('');
  const infs = h.infections
    .map((i) => {
      const st = i.stage === 'window' ? `wound — clean within <b>${i.hours} h</b>` : i.stage === 'set' ? '<b>INFECTED</b> — needs cleaning' : `recovering — ${i.hours} h left`;
      return `<div class="inf">${i.type}: ${st}</div>`;
    })
    .join('');
  const vt = h.valley.trust;
  const trustTxt = h.valley.met ? `${Math.floor(vt / 2)}${vt % 2 ? '½' : ''}/3` : '—';
  box.innerHTML = `
  <div class="sh-name">${H.esc(h.name)}</div>
  <div class="sh-sub">White Shirt${h.mode === 'dead' ? ' · Rise Up, Dead Man' : ''} · day ${w.day - h.stats.arrivedDay + 1} in the bayou</div>
  <div class="sh-hp"><div class="lbl">Health <b>${h.hp}</b> / ${H.maxHp(h)}</div>${H.ui.bars(h)}</div>
  <div class="sh-row"><span title="Armor Class">AC <b>${H.ac(h)}</b></span><span title="Resistance Value">RV <b>0</b></span><span title="Passive Perception">PP <b>${H.pp(h)}</b></span><span>Speed <b>9 m</b></span></div>
  <div class="sh-row"><span class="sp" title="Story Points (§1.8)">${sp}</span>${h.sp > 0 ? `<label class="arm" title="Spend on your next d20 roll for advantage"><input type="checkbox" data-act="armsp" ${h.armedSP ? 'checked' : ''}> spend next roll</label>` : ''}</div>
  <div class="sh-row"><span title="Weight (§3.12)">Weight <b>${H.weightUsed(h)}</b>/${H.maxWeight(h)}</span><span title="Ammo belt slots">Belt <b>${H.beltUsed()}</b>/30</span></div>
  <div class="sh-row money"><span>${H.walletText(h.wallet)}</span></div>
  <div class="abils">${ab}</div>
  ${infs ? `<div class="sh-sec bad"><h4>Wounds</h4>${infs}</div>` : ''}
  <div class="sh-sec"><h4>Weapons</h4>${weapons || '<div class="dim">Empty-handed.</div>'}</div>
  <div class="sh-sec"><h4>Ammo belt</h4>${belt || '<div class="dim">Empty.</div>'}</div>
  <div class="sh-sec"><h4>Pack</h4>${items || '<div class="dim">Plain clothes, bedroll, canteen, tinderbox.</div>'}</div>
  <div class="sh-sec"><h4>Boons</h4>${h.boons.map((b) => `<div class="boon" title="${H.esc(H.BOONS[b].text)}">${H.BOONS[b].name}${b === 'weapon_training' && h.wtClass ? ` (${h.wtClass})` : ''}</div>`).join('') || '<div class="dim">None.</div>'}</div>
  <div class="sh-sec"><h4>Banes</h4>${banes.length ? banes.map((b) => `<span class="bane" title="−2 Attack. Crits ${h.crits[b]}/3 · Training ${h.train[b]}/3">${b} <i>${h.crits[b]}c·${h.train[b]}t</i></span>`).join('') : '<div class="good">None left. You are no longer green.</div>'}</div>
  ${h.skills.length ? `<div class="sh-sec"><h4>Proficient</h4><div class="dim">${h.skills.join(', ')}</div></div>` : ''}
  <div class="sh-sec"><h4>Standing</h4><div class="kv"><span>Valley's trust</span><b>${trustTxt}</b></div><div class="kv"><span>Molly</span><b>${h.molly.met ? h.molly.rel + '/5' : '—'}</b></div><div class="kv"><span>Tap-Tap</span><b>${h.molly.met ? h.molly.taptap + '/5' : '—'}</b></div><div class="kv"><span>Jobs done</span><b>${h.stats.jobs}</b></div></div>
  ${H.S.job ? `<div class="sh-sec job"><h4>Active job</h4><div>${H.esc(H.S.job.name)}</div><div class="dim">${H.S.job.type} · ${H.S.job.label} · ${H.S.job.reward} HB</div></div>` : ''}
  `;
  H.$$('[data-act]', box).forEach((b) => b.addEventListener(b.type === 'checkbox' ? 'change' : 'click', H.ui.sheetAct));
};

H.ui.sheetAct = (ev) => {
  const b = ev.currentTarget;
  const h = H.S.hunter;
  const act = b.dataset.act;
  H.audioInit();
  if (act === 'armsp') {
    h.armedSP = b.checked;
    return;
  }
  if (H.S.combat && act !== 'armsp') return;
  if (act === 'equip') {
    h.hand = b.dataset.uid;
    H.sfx('reload');
  } else if (act === 'load') {
    const wp = h.weapons.find((x) => x.uid === b.dataset.uid);
    const n = H.loadWeapon(wp, 99);
    if (n) H.log(`You load ${n} into the ${H.WEAPONS[wp.key].name}.`, 'sys');
  } else if (act === 'dropw') {
    const wp = h.weapons.find((x) => x.uid === b.dataset.uid);
    if (!confirm(`Leave the ${H.WEAPONS[wp.key].name} behind for good?`)) return;
    // unload rounds back to the belt where there's room
    if (wp.loaded) H.addAmmo(H.WEAPONS[wp.key].ammo, wp.loaded - wp.lq, wp.lq);
    H.removeWeapon(wp.uid);
    H.log(`You leave the ${H.WEAPONS[wp.key].name} behind.`, 'sys');
  } else if (act === 'sort') {
    H.sortAmmo(b.dataset.type);
    return;
  } else if (act === 'heal') {
    H.useHeal(h.items[+b.dataset.idx], false);
  } else if (act === 'clean') {
    H.cleanWound(h.items[+b.dataset.idx]);
  }
  H.refresh();
};

/* Load a weapon from the belt, good rounds first. Returns rounds loaded. */
H.loadWeapon = (wp, max) => {
  const W = H.WEAPONS[wp.key];
  const b = H.S.hunter.belt[W.ammo];
  if (!b || !W.cap) return 0;
  let n = 0;
  while (n < max && wp.loaded < W.cap && b.g + b.q > 0) {
    if (b.g > 0) b.g--;
    else {
      b.q--;
      wp.lq++;
    }
    wp.loaded++;
    n++;
  }
  if (W.reload === 'twostep' && n) wp.cocked = false;
  if (W.reload === 'xbow' && n) wp.strung = true; // out of combat there's all the time in the world
  if (n) H.sfx('reload');
  return n;
};

/* §7.9 questionable ammunition: Investigation DC 10, about ten minutes, out of combat */
H.sortAmmo = (type) => {
  const b = H.S.hunter.belt[type];
  if (!b || !b.q) return;
  H.check({
    title: `Sort the questionable ${type}`,
    skill: 'Investigation',
    dc: 10,
    ref: '7.9',
    cancel: true,
    onDone: (r) => {
      if (r.success) {
        let duds = 0;
        for (let i = 0; i < b.q; i++) if (H.d(6) <= 3) duds++;
        b.g += b.q - duds;
        H.log(`You turn every round under the lamp. <b>${duds}</b> ${duds === 1 ? 'is a dud' : 'are duds'} — corroded primers, split cases. You keep ${b.q - duds} known-good rounds.`, 'sys');
        b.q = 0;
      } else H.log('The light is bad and your eyes are worse. You can\'t tell the duds from the good ones.', 'sys');
    },
  });
};

/* Healing out of combat (no action economy). */
H.useHeal = (it, inCombat) => {
  const h = H.S.hunter;
  if (!it) return 0;
  let amt = 0,
    txt = '';
  if (it.key === 'medkit') {
    if (it.charges <= 0) return 0;
    it.charges--;
    amt = H.heal(15);
    txt = `You work the Medkit — needle, thread, a powder that burns like sin. <b>+${amt} HP</b>. (${it.charges} charge${it.charges === 1 ? '' : 's'} left.)`;
    if (it.charges <= 0) H.S.hunter.items.splice(H.S.hunter.items.indexOf(it), 1);
  } else if (it.key === 'fak') {
    const r = H.roll('2d8');
    amt = H.heal(r.total);
    txt = `You open a First Aid Kit and patch yourself up. 2d8 (${r.rolls.join(', ')}) = ${r.total} → <b>+${amt} HP</b>${amt < r.total ? ' (no further than your current maximum)' : ''}.`;
    H.takeItem('fak', 1, true);
  }
  if (txt) H.log(txt + ' ' + H.ref('3.5'), 'sys');
  void inCombat;
  return amt;
};
/* §3.11 cleaning a wound: alcohol, a First Aid Kit, or a Medkit charge. */
H.cleanWound = (it, free) => {
  const h = H.S.hunter;
  const inf = h.infections.find((i) => i.stage === 'window') || h.infections.find((i) => i.stage === 'set');
  if (!inf) return;
  if (!free) {
    if (it.key === 'medkit') {
      it.charges--;
      if (it.charges <= 0) h.items.splice(h.items.indexOf(it), 1);
    } else H.takeItem(it.key, 1, true);
  }
  const what = free ? 'Valley\'s shitty liquor' : it.key === 'liquor' ? 'the liquor' : it.key === 'fak' ? 'the kit\'s carbolic' : 'the Medkit';
  if (inf.stage === 'window') {
    h.infections.splice(h.infections.indexOf(inf), 1);
    H.log(`You clean the ${inf.type} wound with ${what}. It burns like the devil's own breath — and that is the point. <span class="good">No infection.</span> ${H.ref('3.11')}`, 'sys');
  } else {
    inf.stage = 'recovering';
    inf.hours = 48;
    H.log(`You scour the infected wound with ${what}. It's set in already; two days of recovery before the weakness lifts. ${H.ref('3.11')}`, 'sys');
  }
};
