/* ---------- the menu: save, load, files, settings, help, the dead ---------- */
H.ui.menu = () => {
  const inGame = H.S && H.S.phase === 'game';
  const body = H.el('div', { class: 'menu' });
  const sec = (t) => body.appendChild(H.el('h3', { text: t }));
  if (inGame) {
    sec('Save');
    const row = H.el('div', { class: 'slots' });
    for (const s of ['slot1', 'slot2', 'slot3']) {
      const o = H.readSlot(s);
      row.appendChild(
        H.el('button', {
          class: 'slot',
          html: `<b>Save to ${s.replace('slot', 'slot ')}</b><span>${H.esc(H.slotSummary(o))}</span>`,
          onclick: () => {
            if (H.S.combat) {
              H.ui.toast('Saving mid-fight is allowed — it\'s saved as it stands.');
            }
            if (H.saveTo(s)) {
              H.ui.toast('Saved.');
              H.ui.menu();
            } else H.ui.toast('Could not save — browser storage refused.');
          },
        })
      );
    }
    body.appendChild(row);
    body.appendChild(H.el('button', { class: 'wide', onclick: () => { H.exportSave(); H.ui.toast('Save file downloaded.'); } }, '⇩ Download save file (.json)'));
  }
  sec('Load');
  const lrow = H.el('div', { class: 'slots' });
  for (const s of ['auto', 'slot1', 'slot2', 'slot3']) {
    const o = H.readSlot(s);
    lrow.appendChild(
      H.el('button', {
        class: 'slot',
        disabled: H.validSave(o) ? null : true,
        html: `<b>${s === 'auto' ? 'Autosave' : 'Load ' + s.replace('slot', 'slot ')}</b><span>${H.esc(H.slotSummary(o))}</span>`,
        onclick: () => {
          H.ui.closeModal();
          H.loadState(o);
        },
      })
    );
  }
  body.appendChild(lrow);
  const file = H.el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!H.validSave(o)) throw new Error('not a Hunt 1896 save');
        H.ui.closeModal();
        H.loadState(o);
        H.ui.toast('Save file loaded.');
      } catch (e) {
        H.ui.toast('That file is not a valid save.');
      }
    };
    rd.readAsText(f);
  });
  body.appendChild(file);
  body.appendChild(H.el('button', { class: 'wide', onclick: () => file.click() }, '⇧ Load a save file (.json)'));

  sec('Settings');
  const set = H.el('div', { class: 'settings' });
  const vol = H.el('input', { type: 'range', min: 0, max: 1, step: 0.05, value: H.settings.vol });
  vol.addEventListener('input', () => {
    H.settings.vol = +vol.value;
    H.saveSettings();
    H.audioInit();
    H.audioApplySettings();
  });
  set.appendChild(H.el('label', {}, 'Volume ', vol));
  const tog = (key, label) => {
    const c = H.el('input', { type: 'checkbox', checked: H.settings[key] ? true : null });
    c.addEventListener('change', () => {
      H.settings[key] = c.checked;
      H.saveSettings();
      H.audioInit();
      H.audioApplySettings();
      if (key === 'cite') H.refresh();
    });
    set.appendChild(H.el('label', {}, c, ' ' + label));
  };
  tog('music', 'Ambience and dread (music bed)');
  tog('sfxOn', 'Sound effects');
  tog('fast', 'Quick rolls (skip the dice panel)');
  tog('cite', 'Show rules citations (§) in the log — for testing');
  body.appendChild(set);

  sec('More');
  const more = H.el('div', { class: 'slots' });
  more.appendChild(H.el('button', { class: 'slot', html: '<b>How to play</b><span>Rules primer</span>', onclick: H.ui.help }));
  more.appendChild(H.el('button', { class: 'slot', html: '<b>Ledger of the Dead</b><span>Hunters the bayou kept</span>', onclick: H.ui.showLedger }));
  if (inGame) more.appendChild(H.el('button', { class: 'slot', html: '<b>Quit to title</b><span>Autosaved first</span>', onclick: () => { H.autosave(); H.ui.closeModal(); H.title(); } }));
  body.appendChild(more);
  H.ui.modal('The Ledger', body);
};

H.ui.help = () => {
  H.ui.modal(
    'How to Play',
    `<div class="help">
    <p>You are one hunter — a <b>White Shirt</b>, green and poorly armed — in the Louisiana bayou, 1896. <b>Death is permanent.</b> The world remembers you anyway.</p>
    <h3>Choosing</h3>
    <p>Each turn offers numbered choices <b>{1}–{5}</b>. Click one or press its number key. One choice is usually wild — brilliant, ridiculous or dangerous. Some cost money or time; greyed choices tell you why they're closed.</p>
    <p><b>Safety assumption:</b> if you go somewhere risky, you're assumed to take ordinary precautions — you light the lantern before the cellar.</p>
    <h3>Rolling</h3>
    <p>You roll your own d20 and the math is shown back to you. Difficulty is never a number, only a label: <i>Cake Walk · You'll Be Fine · Rough Waters · Hell · No Idea.</i> Enemy health is never shown — read the consequences.</p>
    <h3>Story Points ✦</h3>
    <p>Earned for doing something cool, clever or outrageous. Hold up to three. Spend one for advantage on any d20 roll — tick the box on the dice panel, or arm it on your sheet before an attack.</p>
    <h3>Health</h3>
    <p>50 HP in five bars of 10. Damage drains the top bar first. <b>An emptied bar is only empty</b>: Medkits, First Aid Kits and rest fill it back up. Natural recovery over time only refills the bar you're in. A Medkit is the most valuable thing you own.</p>
    <p><b>Only fire burns a bar.</b> If fire damage empties a bar, it burns away (marked ✕), and your maximum health is 10 for each bar that isn't burned. Healing can't touch a burned bar: you need a doctor, Carron Oil with a long rest, or an Antiseptic Kit. So at 30 HP with nothing burned, you can heal back to 50. At 30 HP with one bar burned, you can heal to 40, and the last 10 waits for the doctor.</p>
    <p>Grunt bites and scratches must be cleaned (liquor, a First Aid Kit, a Medkit charge) inside a window of hours, or the wound sets into an infection.</p>
    <h3>Fighting</h3>
    <p>Each turn: <b>Movement</b> (9 m — or spend it all on Aim, Fast Reload, Power Shot or Stand Your Ground), one <b>Action</b>, one <b>Bonus Action</b>. Prepared responses must be declared before the trigger. Shots past a weapon's effective range lose accuracy and punch fast. Gunfire draws more grunts; silent weapons don't. Fire answers a great many questions.</p>
    <h3>Between hunts</h3>
    <p>After a job you're offered <b>Downtime</b>: rest, train away your Inexperience Banes, chase rumors for leads, or help Valley at his office until he teaches you something worth knowing. The world keeps moving while you sleep.</p>
    <h3>Saving</h3>
    <p>The game autosaves at every step. Open <b>☰ Ledger</b> to save to a slot, download a save file, or load one back — at any point, mid-fight included.</p>
    <p class="dim">Rules from Dedric's DM Bible v4.0. Turn on “Show rules citations” in settings to see which section governs each roll.</p>
    </div>`,
    { wide: true }
  );
};

/* keyboard: number keys pick choices; Enter rolls */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  if (H.$('#modal')) {
    if (e.key === 'Escape') H.ui.closeModal();

      b.click();

  }

/* ---- js/combat.js ---- */
/* =====================================================================
   HUNT · 1896 — combat (§4). One-dimensional battlefield: every foe has a
   distance in meters from the hunter. Movement, Action, Bonus Action and
   one Reaction per round; Prepared responses; ACV bands; Undead Fortitude;
   range decay; AP vs resistances; noise draws more of them.
   ===================================================================== */
'use strict';

H.CB = {}; // combat helpers

/* ---------------------------------------------------------------------
   Setup
   --------------------------------------------------------------------- */
H.makeFoe = (key, o) => {
  o = o || {};
  const C = H.CREATURES[key];
  return {
    uid: H.uid(),
    key,
    name: C.name,
    hp: C.hp,
    max: C.hp,
    dist: o.dist != null ? o.dist : 20,
    state: o.state || 'aggressive',
    cond: {},
    look: o.look || H.pick(C.looks || ['a shape']),
    loot: o.loot || null,
    leader: !!o.leader,
    pack: o.pack || null,
    stalker: !!C.stalker,
    dead: false,
    fled: false,
    life: o.life || 0,
    threat: false,
    hitStreak: 0,
    actedRound: 0,
    target: !!o.target,
  };
};
H.foeC = (e) => (H.CREATURES[e.key].stalker && !e.stalker ? H.CREATURES.normal : H.CREATURES[e.key]);
H.foeLabel = (e) => {
  const C = H.CREATURES[e.key];
  let n = C.name;
  if (e.leader && e.stalker) n = 'Stalker Leader';
  if (C.stalker && !e.stalker) n = 'Stalker (leaderless)';
  return n;
};
H.alive = () => H.S.combat.enemies.filter((e) => !e.dead && !e.fled);
H.foeHealthWord = (e) => {
  const f = e.hp / e.max;
  const C = H.CREATURES[e.key];
  if (C.sineater) return e.cond.holy ? 'fragile — mud sloughing' : f > 0.9 ? 'whole' : 'pitted';
  if (f >= 1) return 'unhurt';
  if (f > 0.66) return 'wounded';
  if (f > 0.33) return 'bleeding badly';
  return 'barely standing';
};

H.newMissionShell = (o) => ({ corr: o.corr || 0, name: o.name || '', kind: o.kind || 'road', fireTaken: 0, fireBurned: 0, noise: 0, shell: true });

/* cfg: foes[{key, dist, state, loot, leader, pack, target}], terrain, feature, featName, aware, ambush,
        reserve, reserveKey, corr, after, afterP, fleeTo, fleeP, title, targetKey */
H.startCombat = (cfg) => {
  const S = H.S;
  const enemies = cfg.foes.map((f) => H.makeFoe(f.key, f));
  // stalker packs: one Leader per pack (§6.1)
  const packs = {};
  for (const e of enemies)
    if (H.CREATURES[e.key].stalker) {
      const id = e.pack || 'p1';
      e.pack = id;
      (packs[id] = packs[id] || []).push(e);
    }
  for (const id in packs) if (!packs[id].some((e) => e.leader)) packs[id][0].leader = true;
  for (const id in packs) {
    const ld = packs[id].find((e) => e.leader);
    ld.look = 'a pale grunt covered in gore, standing apart from the rest';
  }
  S.combat = {
    round: 0,
    phase: 'init',
    enemies,
    terrain: cfg.terrain || 'land',
    feature: cfg.feature || null,
    featName: cfg.featName || (cfg.feature === 'high' ? 'something high' : cfg.feature === 'door' ? 'the doorway' : ''),
    onHigh: false,
    inDoor: false,
    corr: cfg.corr != null ? cfg.corr : S.mission ? S.mission.corr : 0,
    reserve: cfg.reserve || 0,
    reserveKey: cfg.reserveKey || 'normal',
    arrivals: [],
    fires: [],
    dyn: [],
    unseen: !cfg.aware,
    ambush: !!cfg.ambush,
    after: cfg.after,
    afterP: cfg.afterP || {},
    fleeTo: cfg.fleeTo,
    fleeP: cfg.fleeP || {},
    title: cfg.title || '',
    targetKey: cfg.targetKey || null,
    hInit: 0,
    sel: null,
    turn: null,
    prepared: null,
    dodge: false,
    hidden: false,
    cond: { bleed: 0, burn: 0, poisoned: 0, prone: false, grappled: false, swarmed: false, slowed: false, stunned: false },
    down: null,
    loud: 0,
    gunAt: -9,
    heardGun: -9,
    leechKnows: -9,
    kills: 0,
    killList: [],
    arrowsFired: 0,
    boltsFired: 0,
    hiveShrieked: false,
    howled: false,
  };
  if (cfg.water) S.combat.terrain = 'water';
  H.go('combat');
};

H.scenes.combat = {
  art: () => {
    const c = H.S.combat;
    if (!c) return { kind: 'road', danger: true };
    const figs = H.alive().map((e) => (['hellhound'].includes(e.key) ? 'hound' : ['armored', 'meathead', 'sineater', 'butcher'].includes(e.key) ? 'big' : 'man'));
    const kind = H.S.mission && H.S.mission.art ? H.S.mission.art : 'road';
    return { kind, seed: 'combat-' + (H.S.mission ? H.S.mission.name : '') + c.title, danger: true, figures: figs, caption: c.title, water: c.terrain !== 'land' };
  },
  mood: 'combat',
  enter: () => {
    const c = H.S.combat;
    H.ui.divider();
    const seen = H.alive()
      .map((e) => `${e.look} (${Math.round(e.dist)} m)`)
      .slice(0, 6);
    H.log(`<span class="combat-h">⚔ ${c.title ? H.esc(H.cap(c.title)) + ' — ' : ''}a fight.</span> You see ${H.prose(seen)}.${c.feature === 'high' ? ` Within reach: ${c.featName} you could get up onto.` : ''}${c.feature === 'door' ? ' There\'s a doorway at your back.' : ''}${c.terrain === 'water' ? ' You are knee-deep in black water.' : ''} ${H.ref('4.2')}`, 'combat');
  },
  freeform: false,
};

/* ---------------------------------------------------------------------
   Initiative and the round loop
   --------------------------------------------------------------------- */
H.CB.rollInit = (useSP) => {
  const c = H.S.combat,
    h = H.S.hunter;
  let adv = false;
  if ((useSP || h.armedSP) && h.sp > 0) {
    h.sp--;
    h.armedSP = false;
    adv = true;
    H.log('<span class="sp">✦ Story Point spent for advantage.</span>', 'sys');
  }
  const r = H.d20(adv, false);
  const dm = H.am(h, 'DEX');
  c.hInit = r.die + dm;
  H.sfx('dice');
  H.log(`<span class="roll">🎲 Initiative: 1d20 (${H.diceText(r)}) + DEX (${H.sgn(dm)}) = <b>${c.hInit}</b></span> ${H.ref('4.2')}`, 'rollline');
  // one initiative per creature type (§4.2)
  const byType = {};
  for (const e of c.enemies) {
    if (byType[e.key] == null) byType[e.key] = H.d(20) + (H.CREATURES[e.key].init || 0);
    e.init = byType[e.key];
  }
  const first = c.enemies.filter((e) => e.init > c.hInit).length;
  if (c.unseen) H.log('<span class="good">They haven\'t seen you.</span> You act first, with advantage on your first attack. ' + H.ref('4.2'), 'sys');
  else if (c.ambush) H.log('<span class="bad">They were on you before you knew it.</span> They move first.', 'sys');
  else if (first) H.log(`<span class="dim">${first === c.enemies.length ? 'They are' : 'Some of them are'} quicker than you.</span>`, 'sys');
  H.CB.newRound();
};

H.CB.before = (e) => {
  const c = H.S.combat;
  if (!c) return false;
  if (c.round === 1 && c.unseen) return false;
  if (c.round === 1 && c.ambush) return true;
  return e.init > c.hInit;
};

H.CB.newRound = () => {
  const c = H.S.combat;
  c.round++;
  c.phase = 'enemyA';
  for (const e of c.enemies) e.actedRound = 0;
  // creatures quicker than the hunter
  for (const e of c.enemies.slice()) {
    if (!H.S.combat) return;
    if (!e.dead && !e.fled && H.CB.before(e)) H.CB.enemyTurn(e);
  }
  if (H.CB.checkEnd()) return;
  H.CB.hunterTurnStart();
};

H.CB.hunterTurnStart = () => {
  const c = H.S.combat,
    h = H.S.hunter;
  c.phase = 'hunter';
  c.prepared = null; // a prepared response lasts until the start of your next turn
  c.dodge = false;
  const water = c.terrain === 'water';
  let speed = H.speed(h, water);
  if (c.round === 1 && h.boons.includes('ambush')) speed += 3;
  if (c.cond.slowed) {
    speed = Math.floor(speed / 2);
    c.cond.slowed = false;
  }
  c.turn = { move: speed, full: speed, moved: 0, action: true, bonus: true, aim: c.turn && c.turn.aimCarry ? 5 : 0, moveMech: false, sygShots: 0, thrusted: false, ambushDis: false };
  if (h.hp <= 0) {
    H.refresh();
    return;
  }
  // start-of-turn effects on the hunter
  const k = c.cond;
  if (k.stunned) {
    k.stunned = false;
    c.turn.action = false;
    H.log('<span class="bad">You are stunned</span> — your hands won\'t answer this turn.', 'sys');
  }
  if (k.prone) {
    c.turn.move = Math.floor(c.turn.move / 2);
    k.prone = false;
    H.log('You haul yourself up out of the mud (half your movement).', 'sys');
  }
  if (k.grappled) c.turn.move = 0;
  if (k.bleed > 0) {
    const r = H.d(4);
    k.bleed--;
    H.log(`You are bleeding: <b>${r}</b> damage.${k.bleed ? '' : ' It slows, and stops.'} ${H.ref('3.8')}`, 'hurt');
    if (H.hurt(r)) return H.CB.hunterDown('bled out in the reeds');
  }
  if (k.burn > 0) {
    const r = H.d(6);
    k.burn--;
    H.log(`You are on fire: <b>${r}</b> fire damage.`, 'hurt');
    H.sfx('fire');
    if (H.hurt(r, 'fire')) return H.CB.hunterDown('burned alive');
  }
  if (k.swarmed) {
    const r = H.d(4);
    H.log(`The swarm is in your collar and your ears: <b>${r}</b> poison.`, 'hurt');
    if (H.hurt(r, 'poison')) return H.CB.hunterDown('stung to death by a Hive swarm');
    const sv = H.CB.hunterSave('CON', 11);
    if (!sv) k.poisoned = Math.max(k.poisoned, 1);
  }
  if (k.poisoned > 0) k.poisonedNow = true;
  // immolator aura, fire zones, drowning
  for (const e of H.alive()) {
    const C = H.foeC(e);
    if (C.immolator && e.cond.flared && e.dist <= 2 && c.terrain !== 'water') {
      const r = H.d(6);
      H.log(`Heat rolls off the flared Immolator: <b>${r}</b> fire.`, 'hurt');
      if (H.hurt(r, 'fire')) return H.CB.hunterDown('burned beside an Immolator');
    }
    if (C.waterdevil && e.dist <= 0) {
      const r = H.roll('2d6').total;
      H.log(`You're in the Devil's water. It drags at you from every side: <b>${r}</b> damage. You cannot reload here.`, 'hurt');
      if (H.hurt(r)) return H.CB.hunterDown('dragged under by a Water Devil');
    }
  }
  for (const f of c.fires)
    if (Math.abs(f.pos) <= 3) {
      const r = H.roll(f.die).total;
      H.log(`You're standing in the fire: <b>${r}</b> burn damage.`, 'hurt');
      if (H.hurt(r, 'fire')) return H.CB.hunterDown('burned in their own fire');
    }
  if (k.poisoned > 0) k.poisoned--;
  H.refresh();
};

H.CB.endHunterTurn = () => {
  const c = H.S.combat;
  if (!c || c.phase !== 'hunter') return;
  c.phase = 'enemyB';
  c.cond.poisonedNow = false;
  if (c.turn && c.turn.aim && !c.turn.aimUsed) c.turn.aimCarry = true;
  else if (c.turn) c.turn.aimCarry = false;
  for (const e of c.enemies.slice()) {
    if (!H.S.combat) return;
    if (!e.dead && !e.fled && !H.CB.before(e) && e.actedRound !== c.round) H.CB.enemyTurn(e);
  }
  if (H.CB.checkEnd()) return;
  H.CB.endOfRound();
  if (H.CB.checkEnd()) return;
  if (H.S.hunter.hp <= 0 && c.down) {
    // the downed hunter's own turn is a death save; enemies keep coming
    H.CB.newRound();
    return;
  }
  H.CB.newRound();
};

H.CB.endOfRound = () => {
  const c = H.S.combat;
  // dynamite goes off: "Delay: 4 seconds after ignition" — after the creatures have moved (§5.6)
  for (const d of c.dyn.splice(0)) H.CB.explode(d.pos);
  // fires burn down
  for (const f of c.fires) f.rounds--;
  c.fires = c.fires.filter((f) => f.rounds > 0);
  // reinforcements drawn by noise arrive
  for (const a of c.arrivals.slice()) {
    if (a.round <= c.round) {
      c.arrivals.splice(c.arrivals.indexOf(a), 1);
      const e = H.makeFoe(a.key, { dist: a.dist, state: 'aggressive' });
      e.init = H.d(20) + (H.CREATURES[a.key].init || 0);
      c.enemies.push(e);
      H.log(`<span class="bad">More are coming.</span> ${H.cap(e.look)} ${H.w('emerge')}, ${Math.round(e.dist)} m off, drawn by the noise. ${H.ref('4.8')}`, 'combat');
      H.sfx('growl');
    }
  }
  // the Hive's swarm dies with her
  if (c.cond.swarmed && !H.alive().some((e) => H.CREATURES[e.key].hive)) {
    c.cond.swarmed = false;
    H.log('The swarm drops out of the air like hail.', 'sys');
  }
};

/* ---------------------------------------------------------------------
   Victory, flight, death
   --------------------------------------------------------------------- */
H.CB.checkEnd = () => {
  const c = H.S.combat;
  if (!c) return true;
  const h = H.S.hunter;
  if (h.hp <= 0 && !c.down) {
    H.CB.hunterDown('killed in the bayou');
    return true;
  }
  if (c.over) return true;
  const live = H.alive();
  if (h.hp <= 0 && c.down && c.down.stable && !c.arrivals.length && !live.some((e) => e.state !== 'passive' && !(H.CREATURES[e.key].sineater && !e.threat))) {
    H.CB.finish('wake');
    return true;
  }
  if (!live.length && !c.arrivals.length) {
    if (h.hp <= 0) {
      if (c.down && c.down.stable) H.CB.finish('wake');
      return c.down && c.down.stable ? true : false;
    }
    H.CB.finish('win');
    return true;
  }
  return false;
};

H.CB.hunterDown = (cause) => {
  const c = H.S.combat;
  if (!c) return true;
  if (c.down) return true;
  c.down = { fails: 0, stable: false, cause };
  c.cond = { bleed: 0, burn: 0, poisoned: 0, prone: true, grappled: false, swarmed: false, slowed: false, stunned: false };
  H.log(`<span class="bad big">You go down.</span> The mud comes up to meet you. Everything is far away and very loud. ${H.ref('3.4')}`, 'hurt');
  H.setMood('tense');
  if (c.phase === 'hunter') c.phase = 'downed';
  H.refresh();
  return true;
};

H.CB.deathSave = () => {
  const c = H.S.combat;
  if (!c || !c.down) return;
  if (!c.down.stable) {
    const r = H.d(20);
    H.sfx('dice');
    if (r >= 10) {
      c.down.stable = true;
      H.log(`<span class="roll">🎲 Death save: 1d20 = <b>${r}</b></span> — <span class="good">stabilized.</span> You stop sliding toward the dark. Now pray nothing finds you. ${H.ref('3.4')}`, 'rollline');
    } else {
      c.down.fails++;
      H.log(`<span class="roll">🎲 Death save: 1d20 = <b>${r}</b></span> — <span class="bad">failure ${c.down.fails}/3.</span>`, 'rollline');
      if (c.down.fails >= 3) return H.hunterDies(c.down.cause);
    }
  } else {
    // §3.4 [PROVISIONAL]: a stabilized solo hunter that nothing reaches wakes later at 1 HP.
    // Things that won't close on a still body (a Hive at range, an Immolator, the water's edge) lose interest.
    c.down.quiet = (c.down.quiet || 0) + 1;
    if (c.down.quiet >= 3) {
      H.log('<span class="dim">You lie still so long that whatever was out there stops caring. The sounds move off into the dark.</span>', 'sys');
      return H.CB.finish('wake');
    }
    H.log('<span class="dim">You lie still in the mud and listen to them moving.</span>', 'sys');
  }
  c.phase = 'enemyB';
  for (const e of c.enemies.slice()) {
    if (!H.S.combat) return;
    if (!e.dead && !e.fled) H.CB.enemyTurn(e);
  }
  if (!H.S.combat) return;
  if (H.CB.checkEnd()) return;
  H.CB.endOfRound();
  if (H.CB.checkEnd()) return;
  c.round++;
  c.phase = 'downed';
  H.refresh();
};

H.CB.finish = (how) => {
  const S = H.S,
    c = S.combat,
    h = S.hunter;
  c.over = true;
  const after = c.after,
    afterP = c.afterP;
  // arrows and bolts can be picked up again (§4.5 Recoverable)
  const rec = [];
  if (c.arrowsFired && how !== 'flee') {
    const n = Math.ceil(c.arrowsFired * H.ri(50, 100) / 100);
    const got = H.addAmmo('Arrow', n);
    if (got) rec.push(`${got} arrow${got === 1 ? '' : 's'}`);
  }
  if (c.boltsFired && how !== 'flee') {
    const n = Math.ceil(c.boltsFired * H.ri(50, 100) / 100);
    const got = H.addAmmo('Bolt', n);
    if (got) rec.push(`${got} bolt${got === 1 ? '' : 's'}`);
  }
  if (rec.length) H.log(`You walk the ground and pull back ${H.prose(rec)}.`, 'sys');
  for (const wp of h.weapons) wp.dropped = false;
  if (S.mission) S.mission.noise = (S.mission.noise || 0) + c.loud;
  const kills = c.killList.slice();
  const surv = {};
  for (const e of H.alive()) {
    if (e.key === 'leech') continue;
    const g = (surv[e.key] = surv[e.key] || { key: e.key, n: 0, state: e.state === 'passive' ? 'passive' : 'alerted', hp: [], loot: [], target: e.target });
    g.n++;
    g.hp.push(e.hp);
    g.loot.push(e.loot);
  }
  const survivors = Object.values(surv);
  const bodies = c.enemies.filter((e) => e.dead && e.loot);
  const hadSinEater = c.enemies.some((e) => e.key === 'sineater');
  const trophies = c.enemies.filter((e) => e.dead && e.target && H.CREATURES[e.key].trophy).map((e) => H.CREATURES[e.key].trophy);
  S.combat = null;
  H.ui.divider();
  if (how === 'win') {
    H.log(`<span class="good">It's over.</span> ${H.fill(H.w('fightOver'))}`, 'sys');
    if (kills.length >= 4) H.awardSP(`clearing ${kills.length} of them in one fight`);
    S.lastFight = { bodies: bodies.map((b) => ({ uid: b.uid, key: b.key, loot: b.loot, killedType: b.killedType, looted: false })), trophies, kills, hadSinEater };
  } else if (how === 'flee') {
    H.log(H.w('fled'), 'sys');
    S.lastFight = { bodies: [], trophies: [], kills, fled: true, survivors };
  } else if (how === 'wake') {
    h.hp = 1;
    const hrs = H.d(4);
    H.advance(hrs, { noRecover: true });
    H.log(`You wake ${hrs} hour${hrs === 1 ? '' : 's'} later at 1 HP, face-down in the mud, alive by an accident of the bayou's attention. ${H.ref('3.4')}`, 'sys');
    S.lastFight = { bodies: bodies.map((b) => ({ uid: b.uid, key: b.key, loot: b.loot, killedType: b.killedType, looted: false })), trophies, kills };
  }
  if (h.hp <= 15 && h.hp > 0) H.log('<span class="dim">You are badly hurt. Your heartbeat is very loud.</span>', 'sys');
  const dest = how === 'flee' ? c.fleeTo || after : after;
  const p = how === 'flee' ? Object.assign({}, c.fleeP, { fled: true }) : Object.assign({}, afterP, { won: how !== 'flee' });
  H.go(dest || 'town', p);
};

/* ---------------------------------------------------------------------
   Hunter saves (rolled for the player, math shown)
   --------------------------------------------------------------------- */
H.CB.hunterSave = (A, dc, adv) => {
  const h = H.S.hunter,
    c = H.S.combat;
  const corrAdd = c ? Math.min(8, 2 * (c.corr || 0)) : 0;
  const DC = dc + corrAdd;
  let useAdv = !!adv;
  if (h.armedSP && h.sp > 0 && !useAdv) {
    h.sp--;
    h.armedSP = false;
    useAdv = true;
    H.log('<span class="sp">✦ Story Point spent for advantage.</span>', 'sys');
  }
  const dis = (A === 'DEX' || A === 'STR') && c && c.cond.poisonedNow ? false : false;
  const r = H.d20(useAdv || (A === 'DEX' && c && c.dodge), dis);
  const m = H.am(h, A);
  const tot = r.die + m;
  const ok = tot >= DC;
  H.log(`<span class="roll">🎲 ${A} save: 1d20 (${H.diceText(r)}) + ${A} (${H.sgn(m)}) = <b>${tot}</b></span> · <em>${H.dcInfo(DC).label}</em> — ${ok ? '<span class="good">saved</span>' : '<span class="bad">failed</span>'}${corrAdd ? ' <span class="dim">(the corruption here makes it harder)</span>' : ''} ${H.ref('2.4')}`, 'rollline');
  return ok;
};

/* ---------------------------------------------------------------------
   Movement
   --------------------------------------------------------------------- */
H.CB.shiftAll = (delta) => {
  const c = H.S.combat;
  for (const e of c.enemies) if (!e.dead && !e.fled) e.dist = Math.max(e.key === 'waterdevil' ? -10 : 1, e.dist + delta);
  for (const f of c.fires) f.pos += delta;
  for (const d of c.dyn) d.pos += delta;
};
H.CB.move = (dir, m) => {
  const c = H.S.combat;
  if (!c || !c.turn) return;
  const t = c.turn;
  m = Math.min(m, t.move);
  if (m <= 0) return;
  if (dir < 0) {
    // advancing: close on the selected target (others shift by the same amount)
    const tgt = H.CB.target();
    const room = tgt ? Math.max(0, tgt.dist - 1) : m;
    m = Math.min(m, room || m);
    for (const e of H.alive()) {
      if (H.CREATURES[e.key].waterdevil) {
        e.dist -= m;
        continue;
      }
      e.dist = Math.max(1, e.dist - m);
    }
    for (const f of c.fires) f.pos -= m;
    for (const d of c.dyn) d.pos -= m;
    H.log(`You ${H.w('advance')} ${m} m${tgt ? ` toward the ${H.foeLabel(tgt).toLowerCase()}` : ''}.`, 'move');
  } else {
    // falling back: anything in reach gets a free swing unless you Disengaged (§4.3)
    const adj = H.alive().filter((e) => e.dist <= (H.foeC(e).reach || 2) && !e.cond.staggered && !e.cond.stunned && !e.cond.prone && !H.foeC(e).waterdevil && e.state === 'aggressive');
    if (adj.length && !t.disengaged && !c.hidden) {
      H.log('You break away — and they take their chance.', 'move');
      for (const e of adj) {
        if (H.S.hunter.hp <= 0) break;
        H.CB.foeAttack(e, { opp: true });
      }
      if (H.S.hunter.hp <= 0) return H.CB.checkEnd();
    }
    if (c.onHigh) {
      H.log('You can\'t back away up here — climb down first.', 'sys');
      return;
    }
    if (c.inDoor) c.inDoor = false;
    H.CB.shiftAll(m);
    H.log(`You ${H.w('retreat')} ${m} m.`, 'move');
  }
  t.move -= m;
  t.moved += m;
  H.sfx('step');
  // an Immolator sees movement (§6.1 Twitchy)
  for (const e of H.alive()) if (H.foeC(e).immolator && e.dist <= 10 && e.state !== 'aggressive') {
    e.state = 'aggressive';
    H.log('The Immolator\'s head snaps toward the movement.', 'combat');
  }
  H.refresh();
};

H.CB.target = () => {
  const c = H.S.combat;
  let t = H.alive().find((e) => e.uid === c.sel);
  if (!t) {
    const live = H.alive().sort((a, b) => a.dist - b.dist);
    t = live[0] || null;
    if (t) c.sel = t.uid;
  }
  return t;
};

/* ---------------------------------------------------------------------
   Weapons: readiness and reloads
   --------------------------------------------------------------------- */
H.CB.ready = (wp) => {
  if (!wp) return 'Nothing in hand';
  const W = H.WEAPONS[wp.key];
  if (wp.dropped) return 'You dropped it';
  if (wp.whp <= 0) return 'It\'s broken (Weapon HP 0)';
  if (W.kind === 'melee') return true;
  if (wp.loaded <= 0) return 'Empty';
  if (W.boltAction && wp.cycle) return 'Cycle the bolt first';
  if (W.reload === 'xbow' && !wp.strung) return 'The string isn\'t drawn';
  return true;
};
H.CB.reloadOpts = (wp) => {
  const out = [];
  if (!wp) return out;
  const W = H.WEAPONS[wp.key];
  const c = H.S.combat,
    t = c.turn;
  if (!W.cap) return out;
  const have = H.ammoCount(W.ammo);
  const full = wp.loaded >= W.cap;
  const devil = H.alive().some((e) => H.foeC(e).waterdevil && e.dist <= 0);
  const why = devil ? 'Not in the Devil\'s water' : full ? 'Already loaded' : !have ? `No ${W.ammo} on your belt` : null;
  if (W.reload === 'action') out.push({ k: 'act', t: `Reload (up to ${W.rn})`, dis: why || (!t.action && 'Action spent'), f: () => H.CB.reload(wp, W.rn, 'action') });
  if (W.reload === 'bonus') out.push({ k: 'bon', t: 'Nock an arrow', dis: why || (!t.bonus && 'Bonus Action spent'), f: () => H.CB.reload(wp, 1, 'bonus') });
  if (W.reload === 'twostep') {
    out.push({ k: 'bon', t: 'Half-cock the Sparks', dis: wp.cocked ? 'Already half-cocked' : full ? 'Already loaded' : !t.bonus && 'Bonus Action spent', f: () => { t.bonus = false; wp.cocked = true; H.log('You thumb the hammer to half-cock.', 'act'); H.sfx('reload'); H.refresh(); } });
    out.push({ k: 'act', t: 'Load the Sparks', dis: why || (!wp.cocked ? 'Half-cock it first (Bonus Action)' : !t.action && 'Action spent'), f: () => H.CB.reload(wp, 1, 'action') });
  }
  if (W.reload === 'xbow') {
    out.push({ k: 'act', t: 'Draw the string', dis: wp.strung ? 'Already drawn' : !t.action && 'Action spent', f: () => { t.action = false; wp.strung = true; H.log('You brace the crossbow and haul the string back until it catches.', 'act'); H.sfx('reload'); H.refresh(); } });
    out.push({ k: 'bon', t: 'Seat a bolt', dis: why || (!wp.strung ? 'Draw the string first' : !t.bonus && 'Bonus Action spent'), f: () => H.CB.reload(wp, 1, 'bonus') });
  }
  if (W.reload !== 'twostep' && W.reload !== 'xbow')
    out.push({ k: 'mov', t: 'Fast Reload (1 round)', dis: why || (t.moveMech ? 'Movement already committed' : t.moved > 0 ? 'You\'ve already moved this turn' : t.move <= 0 && 'No movement left'), f: () => { t.moveMech = true; t.move = 0; H.CB.reload(wp, 1, 'move'); } });
  if (W.boltAction) out.push({ k: 'bon', t: 'Cycle the bolt', dis: !wp.cycle ? 'Not needed' : !t.bonus && 'Bonus Action spent', f: () => { t.bonus = false; wp.cycle = false; H.log('Bolt up, back, forward, down.', 'act'); H.sfx('reload'); H.refresh(); } });
  return out;
};
H.CB.reload = (wp, n, cost) => {
  const t = H.S.combat.turn;
  if (cost === 'action') t.action = false;
  if (cost === 'bonus') t.bonus = false;
  const W = H.WEAPONS[wp.key];
  const keepCock = wp.cocked;
  const got = H.loadWeapon(wp, n);
  if (W.reload === 'twostep') wp.cocked = keepCock && !got ? keepCock : false;
  if (W.reload === 'xbow') wp.strung = true;
  H.log(`You load ${got} ${W.ammo === 'Buckshot' ? 'shell' + (got === 1 ? '' : 's') : W.ammo === 'Arrow' ? 'arrow' : W.ammo === 'Bolt' ? 'bolt' : 'round' + (got === 1 ? '' : 's')} into the ${W.name}. (${wp.loaded}/${W.cap}) ${H.ref('4.7')}`, 'act');
  H.refresh();
};

/* ---------------------------------------------------------------------
   The hunter attacks (§4.4, §4.4a, §4.5, §4.6)
   mode: 'shot' | 'power' | 'slash' | 'thrust' | 'stock' | 'syg' (Stand Your Ground) | 'retaliate' | 'prepared'
   --------------------------------------------------------------------- */
H.CB.dmgType = (wp, mode) => {
  const W = H.WEAPONS[wp.key];
  if (mode === 'stock') return 'blunt';
  if (W.kind === 'melee') return mode === 'thrust' ? 'pierceM' : W.dtype;
  if (W.kind === 'bow' || W.kind === 'xbow') return 'pierceR';
  return 'other';
};
H.CB.bane = (wp, mode) => {
  const W = H.WEAPONS[wp.key];
  if (mode === 'stock') return 'Blunt';
  if (mode === 'thrust') return 'Pierce';
  return W.cat;
};
/* AP against a negative (resisting) multiplier. AP 1 → halfway to ×1 [PROVISIONAL, §4.6]; AP 2 → ignored. */
H.CB.apMult = (m, ap) => {
  if (m >= 1) return m;
  if (ap >= 2) return 1;
  if (ap === 1) return m + (1 - m) / 2;
  return m;
};

H.CB.attack = (e, mode, extra) => {
  extra = extra || {};
  const S = H.S,
    c = S.combat,
    h = S.hunter;
  const wp = extra.wp || H.inHand();
  const W = H.WEAPONS[wp.key];
  const C = H.foeC(e);
  const ranged = (mode === 'shot' || mode === 'power' || mode === 'prepared') && W.kind !== 'melee';
  const ammo = ranged ? H.AMMO[W.ammo] : null;
  const t = c.turn || {};

  // questionable round? (§7.9) — a dud is a dry click: Action spent, round lost, no noise
  if (ranged) {
    const isQ = wp.lq > 0 && H.rnd() < wp.lq / wp.loaded;
    if (isQ) wp.lq--;
    wp.loaded--;
    if (W.boltAction) wp.cycle = true;
    if (W.reload === 'twostep') wp.cocked = false;
    if (W.reload === 'xbow') wp.strung = false;
    if (W.ammo === 'Arrow') c.arrowsFired++;
    if (W.ammo === 'Bolt') c.boltsFired++;
    if (isQ && H.d(6) <= 3) {
      H.sfx('click');
      H.log(`<b>Click.</b> A dud — the ${W.name} gives you nothing but a dry snap. The round is lost. ${H.ref('7.9')}`, 'act');
      return;
    }
  }

  // ---- attack roll ----
  const mods = [];
  const useStr = mode === 'stock';
  mods.push({ n: useStr ? 'STR' : 'DEX', v: H.am(h, useStr ? 'STR' : 'DEX'), always: true });
  if (mode !== 'stock') {
    if (W.atk) mods.push({ n: W.name, v: W.atk });
    if (ammo && ammo.atk) mods.push({ n: W.ammo, v: ammo.atk });
    if (W.cls && h.wtClass === W.cls) mods.push({ n: 'Weapon Training', v: 1 });
  }
  const bane = H.CB.bane(wp, mode);
  if (h.banes[bane]) mods.push({ n: 'Inexperience: ' + bane, v: -2 });
  if (mode === 'retaliate') mods.push({ n: 'Retaliate', v: -5 });
  if (mode === 'prepared' || extra.strike) mods.push({ n: 'Prepared', v: 5 });
  else if (t.aim && !t.aimUsed && ranged) {
    mods.push({ n: 'Aim', v: 5 });
    t.aimUsed = true;
  }
  let stealthy = c.unseen || c.hidden;
  if (stealthy && h.boons.includes('limbs')) {
    const r = H.d(8);
    mods.push({ n: "Ranger's Limbs 1d8", v: r });
  }
  // range (§4.5)
  let dmgLoss = 0;
  if (ranged && e.dist > W.er) {
    const steps = Math.ceil((e.dist - W.er) / 15);
    const p = ammo.pen;
    mods.push({ n: `range ${Math.round(e.dist)} m`, v: -steps * p[0] });
    dmgLoss = steps * p[1];
  }
  let adv = stealthy;
  let dis = false;
  if (c.cond.poisonedNow || c.cond.grappled) dis = true;
  if (e.cond.prone) {
    if (ranged) dis = true;
    else adv = true;
  }
  if (h.armedSP && h.sp > 0) {
    h.sp--;
    h.armedSP = false;
    adv = true;
    H.log('<span class="sp">✦ Story Point spent for advantage.</span>', 'sys');
  }
  const r = H.d20(adv, dis);
  const total = r.die + H.modsSum(mods);
  const nat20 = r.die === 20,
    nat1 = r.die === 1;

  // ---- noise ----
  const silent = W.silent || mode === 'stock' || W.kind === 'melee';
  if (ranged) {
    if (W.kind === 'bow') H.sfx('bow');
    else if (W.kind === 'xbow') H.sfx('xbow');
    else H.sfx(W.key === 'romero' ? 'shotgun' : W.cls === 'Pistol' ? 'pistol' : 'rifle');
  } else H.sfx(mode === 'stock' || W.dtype === 'blunt' ? 'thud' : 'slash');

  // ---- hit and quality ----
  let hit, band, mult, crit;
  if (C.acv) {
    hit = !nat1 && (nat20 || total >= C.acv[0]);
    const critAt = Math.min(C.crit || 20, 20);
    crit = hit && (nat20 || total >= critAt);
    const names = ['Poor', 'Low', 'Standard', 'Solid', 'Critical'];
    const mults = [0.5, 0.75, 1, 1.5, 2];
    let bi = 0;
    for (let i = 0; i < 4; i++) if (total >= C.acv[i]) bi = i;
    if (crit) bi = 4;
    band = names[bi];
    mult = mults[bi];
  } else {
    hit = !nat1 && (nat20 || total >= C.ac);
    crit = hit && nat20;
    band = crit ? 'Critical' : 'Hit';
    mult = crit ? 2 : 1;
  }
  const verb = mode === 'stock' ? W.melee : mode === 'thrust' ? 'Thrust' : mode === 'power' ? 'Power Shot' : W.kind === 'melee' ? 'Slash' : W.name;
  let line = `<span class="roll">${H.esc(verb)} → ${H.esc(H.foeLabel(e))} (${Math.round(e.dist)} m): 1d20 (${H.diceText(r)})${H.modsText(mods)} = <b>${total}</b></span> — `;
  if (!hit) {
    const missWords = !ranged ? 'missMelee' : W.kind === 'bow' || W.kind === 'xbow' ? 'missArrow' : 'missShot';
    line += nat1 ? '<span class="bad">a natural 1. Clean miss.</span>' : `<span class="bad">miss</span> — ${H.w(missWords)}.`;
    H.log(line + ' ' + H.ref(C.acv ? '4.4a' : '4.4'), 'attack');
    H.CB.afterShotNoise(ranged && !silent, W, e, false);
    if (stealthy && !silent) H.CB.reveal();
    else if (stealthy && silent) H.log('<span class="dim">A silent miss. Nothing turns your way.</span>', 'sys');
    c.unseen = false;
    return;
  }

  // ---- damage (§4.4a order) ----
  let dExpr = mode === 'power' ? W.power : mode === 'thrust' ? W.thrust : mode === 'stock' ? W.mdie : W.dmg;
  const dr = H.roll(dExpr);
  let base = dr.total;
  const dm = [];
  if (ammo && ammo.dmg) { base += ammo.dmg; dm.push(`${W.ammo} +${ammo.dmg}`); }
  if (W.kind === 'melee' && W.addDex) { base += H.am(h, 'DEX'); dm.push(`DEX ${H.sgn(H.am(h, 'DEX'))}`); }
  if ((W.kind === 'melee' && W.addStr) || mode === 'thrust' || mode === 'stock') { base += H.am(h, 'STR'); dm.push(`STR ${H.sgn(H.am(h, 'STR'))}`); }
  if (dmgLoss) { base -= dmgLoss; dm.push(`range −${dmgLoss}`); }
  const dtype = H.CB.dmgType(wp, mode);
  // per-creature melee bonuses
  if (C.paper && W.kind === 'melee' && (W.key === 'sword' || W.key === 'dusters')) { const x = H.d(6); base += x; dm.push(`paper body +${x}`); }
  if (C.paper && mode === 'stock') { const x = H.d(6); base += x; dm.push(`paper body +${x}`); }
  if (C.butcher && dtype === 'slash') { const x = H.d(6); base += x; dm.push(`blades bite +${x}`); }
  let dmg = base * mult;
  let tm = C.mods[dtype] != null ? C.mods[dtype] : C.mods.other != null && dtype === 'other' ? C.mods.other : 1;
  if (dtype === 'pierceR' && C.mods.pierceR == null) tm = C.mods.other != null ? C.mods.other : 1;
  let ap = ammo ? ammo.ap : 0;
  if (W.ap != null) ap = W.ap;
  if (C.chitin) ap = Math.max(0, ap - 1);
  if (C.sineater) tm = e.cond.holy > 0 ? 2 : 0;
  else tm = H.CB.apMult(tm, ap);
  if (C.swarm) tm *= 0.5;
  dmg *= tm;
  // the Armored's ranged piercing rounds up — an explicit exception (§6.1)
  dmg = e.key === 'armored' && dtype === 'pierceR' ? Math.ceil(dmg) : Math.floor(dmg);
  dmg = Math.max(1, dmg);
  line += `<span class="good">${band === 'Hit' ? 'hit' : band + ' hit'}${mult !== 1 ? ` (×${mult})` : ''}.</span> Damage: ${dExpr} (${dr.rolls.join(', ')})${dr.bonus ? (dr.bonus > 0 ? ' + ' : ' − ') + Math.abs(dr.bonus) : ''}${dm.length ? ', ' + dm.join(', ') : ''} = ${base}${mult !== 1 ? ` × ${mult}` : ''}${tm !== 1 ? ` × ${Math.round(tm * 1000) / 1000}` : ''} → <b>${dmg}</b>`;
  H.log(line + ' ' + H.ref(C.acv ? '4.4a' : '4.4'), 'attack');
  if (crit) {
    h.stats.crits++;
    H.noteCrit(bane);
  }
  if (C.sineater && !e.cond.holy) H.log('<span class="dim">The mud closes over the wound like water. Whatever you did, it barely noticed.</span>', 'sys');

  H.CB.applyDamage(e, dmg, dtype, { crit, band, wp, mode, ranged });
  // after-hit effects that need the creature alive
  if (!e.dead) {
    // Poor hit leg strike (limb policy normal; Romero rolls the limb die at advantage) (§4.4a)
    if (band === 'Poor' && C.limb === 'normal' && !e.cond.crippled) {
      const a = H.d(4),
        b = W.limbs && ranged ? H.d(4) : 9;
      if (a === 1 || b === 1) {
        e.cond.crippled = true;
        H.log(`The shot takes it in the leg. <b>Crippled</b> — it drags itself now, barely 2 m a turn. ${H.ref('6.1')}`, 'combat');
      }
    }
    // stuns: Heavy Load (crossbow), Reliable and Sturdy (melee, total 15+)
    const humanish = C.size === 'human' || C.size === 'small';
    if (humanish && W.heavyLoad && ranged) {
      e.cond.stunned = true;
      e.cond.prone = true;
      H.log('The bolt\'s weight knocks it flat. <b>Stunned</b>.', 'combat');
    } else if (humanish && W.rs && !ranged && total >= 15) {
      e.cond.stunned = true;
      e.cond.prone = true;
      H.log(`Reliable and sturdy: the blow puts it on the ground. <b>Stunned</b>. ${H.ref('5.1')}`, 'combat');
      if (W.pusher) {
        e.dist += 2;
        H.log('The Dusters drive it back 2 m.', 'combat');
      }
    }
    // bleed (§3.8) — refreshes, never stacks
    if ((W.bleed && (ranged || mode === 'slash' || mode === 'thrust' || mode === 'syg' || mode === 'retaliate')) && !C.sineater && !C.fungal) {
      e.cond.bleed = W.bleed;
      H.log(`It's <b>bleeding</b>.`, 'combat');
    }
    // the Armored's Unstable Flesh: flat d20 vs DC 10 on every hit (§6.1)
    if (C.unstable) {
      const s = H.d(20);
      if (s < 10) {
        e.cond.staggered = true;
        H.log(`The soft flesh under the plates convulses — <b>Staggered</b>. It loses its next turn. ${H.ref('2.5')}`, 'combat');
      }
    }
    // the Immolator flares at the first bullet (§6.1)
    if (C.immolator && ranged && W.kind === 'gun' && !e.cond.flared && c.terrain !== 'water') {
      e.cond.flared = true;
      e.cond.flareRounds = 4;
      e.state = 'aggressive';
      H.sfx('fire');
      H.log('<span class="bad">The Immolator flares.</span> It goes up like a torch dipped in pitch and comes for you — faster now, hotter.', 'combat');
    }
    if (C.sineater && !e.threat) {
      e.threat = true;
      e.state = 'aggressive';
      H.log('The Sin Eater turns. You are its <b>Threat</b> now. It will not stop walking toward you.', 'combat');
    }
    if (e.state !== 'aggressive' && !C.waterdevil) {
      e.state = 'aggressive';
    }
  }
  // melee on a Sin Eater: corrosive sludge (§6.1); Sparks "To an Extent"
  if (!ranged && C.sineater && W.kind === 'melee') H.CB.wearWeapon(wp, 1, 'The sludge eats at the blade.');
  if (!ranged && W.toAnExtent && wp.whp === 3) H.CB.wearWeapon(wp, 1, 'The old stock creaks.');
  // Bushranger's Ambush: hit a creature that hasn't acted → Disengage as a Bonus Action
  if (h.boons.includes('ambush') && e.actedRound !== c.round) t.ambushDis = true;
  // Mule Kick (§5.1)
  if (ranged && W.muleKick) {
    const k = H.d(20) + H.am(h, 'STR');
    if (k < 3) {
      wp.dropped = true;
      H.log(`The Uppercut bucks out of your grip (mule kick ${k}). It's in the mud — pick it up (Bonus Action).`, 'act');
    }
  }
  H.CB.afterShotNoise(ranged && !silent, W, e, true);
  if (stealthy) {
    if (silent && e.dead) H.log('<span class="dim">It drops without a sound. You are still unseen.</span>', 'sys');
    else H.CB.reveal();
  }
  c.unseen = false;
};

H.CB.wearWeapon = (wp, n, why) => {
  wp.whp = Math.max(0, wp.whp - n);
  H.log(`${why} <span class="bad">${H.WEAPONS[wp.key].name} Weapon HP ${wp.whp}/${H.WEAPONS[wp.key].whp}</span>${wp.whp === 0 ? ' — it\'s useless until Sammy Lox fixes it.' : ''} ${H.ref('5.9')}`, 'sys');
};

H.CB.reveal = () => {
  const c = H.S.combat;
  if (!c.hidden && !c.unseen) return;
  c.hidden = false;
  for (const e of H.alive()) if (e.state === 'searching' || e.state === 'passive') e.state = 'aggressive';
};

/* Apply damage to a creature, with every special rule that keys on damage. */
H.CB.applyDamage = (e, dmg, dtype, info) => {
  const c = H.S.combat,
    C = H.foeC(e);
  info = info || {};
  if (e.dead) return;
  // instant kills
  if (C.fireKills && dtype === 'fire') {
    H.log('<span class="good">The fire finds the soft flesh under the plates.</span> The Armored goes up like a dry haystack and comes apart. ' + H.ref('6.1'), 'combat');
    return H.CB.kill(e, 'fire');
  }
  if (C.sineater && dtype === 'explosive') {
    H.log('<span class="good">The blast tears the Sin Eater apart.</span> Mud and black roots rain down for a long time. ' + H.ref('6.1'), 'combat');
    return H.CB.kill(e, 'explosive');
  }
  if (C.butcher && dtype === 'fire') {
    H.log('The fire runs off the Butcher\'s apron like water.', 'combat');
    return;
  }
  e.hp -= dmg;
  if (dtype === 'fire') {
    if (C.alight && !e.cond.alight) {
      e.cond.alight = 2;
      H.log('It catches. <b>Set alight</b> — it will not see the end of its next turn.', 'combat');
    }
    if (C.paper && !e.cond.burn) e.cond.burn = 3;
    if (C.sineater && !e.cond.inFlames) {
      e.cond.inFlames = H.d(2);
      H.log('The Sin Eater stops in the flames, steaming, roots hissing. It stays there.', 'combat');
    }
  }
  if (e.hp <= 0) {
    // Undead Fortitude: CON save, DC 5 + damage (§6.1) — the DM rolls it, hidden
    if (C.fort && dtype !== 'fire') {
      const sv = H.d(20) + (C.save.CON || 0);
      if (sv >= 5 + dmg) {
        e.hp = 1;
        H.log('<span class="bad">It should be dead.</span> It shudders, black fluid pumping, and comes back up anyway.', 'combat');
        return;
      }
    }
    // Immolator killed by bullets explodes (§6.1)
    if (C.immolator && info.ranged && info.wp && H.WEAPONS[info.wp.key].kind === 'gun' && c.terrain !== 'water') {
      H.CB.kill(e, dtype);
      H.CB.immolatorBurst(e);
      return;
    }
    H.CB.kill(e, dtype);
  } else {
    const f = e.hp / e.max;
    const ln = H.w(f > 0.66 ? 'woundLight' : f > 0.33 ? 'woundMid' : 'woundHeavy');
    H.log(`<span class="dim">${ln}</span>`, 'combat');
  }
};

H.CB.kill = (e, dtype) => {
  const c = H.S.combat,
    h = H.S.hunter;
  e.dead = true;
  e.hp = 0;
  e.killedType = dtype;
  c.kills++;
  c.killList.push(e.key);
  h.stats.kills++;
  h.stats.killList[e.key] = (h.stats.killList[e.key] || 0) + 1;
  const C = H.CREATURES[e.key];
  H.log(`<span class="kill">✝ ${H.w('kill.' + e.key) || 'It dies.'}</span>`, 'combat');
  if (C.boss) H.awardSP(`bringing down ${C.name}`);
  // a Stalker pack loses its Leader → they become Normal Grunts in every respect (§6.1)
  if (C.stalker && e.leader && e.stalker) {
    let n = 0;
    for (const s of c.enemies) if (!s.dead && s.pack === e.pack && s.stalker) { s.stalker = false; n++; }
    if (n) H.log(`<span class="good">The Leader is down.</span> The rest of the pack falters — directionless now, just grunts. ${H.ref('6.1')}`, 'combat');
  }
  // the last Hellhound runs (§6.1)
  if (C.lastDog) {
    const left = H.alive().filter((x) => x.key === 'hellhound');
    if (left.length === 1 && c.enemies.filter((x) => x.key === 'hellhound').length > 1) {
      left[0].fled = true;
      H.log('The last hound breaks — tail down, it bolts for the tree line. It may come back with a new pack, days from now.', 'combat');
    }
  }
  // the Hive's swarm dies with her
  if (C.hive) c.cond.swarmed = false;
  if (C.meathead) for (const l of c.enemies) if (l.key === 'leech' && !l.dead) l.dead = true;
};

H.CB.immolatorBurst = (e) => {
  const c = H.S.combat;
  H.sfx('boom');
  H.log('<span class="bad">It bursts</span> — a gout of fire three meters wide.', 'combat');
  if (e.dist <= 3) {
    const r = H.roll('2d6').total;
    const ok = H.CB.hunterSave('DEX', 12);
    const d = ok ? Math.floor(r / 2) : r;
    H.log(`You take <b>${d}</b> fire.`, 'hurt');
    if (H.hurt(d, 'fire')) H.CB.hunterDown('caught in an Immolator\'s burst');
  }
  for (const o of H.alive()) if (Math.abs(o.dist - e.dist) <= 3) H.CB.applyDamage(o, H.roll('2d6').total, 'fire');
  void c;
};

H.CB.explode = (pos) => {
  const c = H.S.combat;
  H.sfx('boom');
  H.log(`<span class="bad big">BOOM.</span> The dynamite goes off ${Math.round(Math.abs(pos))} m away. ${H.ref('5.6')}`, 'combat');
  H.CB.noise(2);
  // the hunter
  const hd = Math.abs(pos);
  if (hd <= 8) {
    let r = hd <= 6 ? H.roll('12d12+25').total : H.roll('6d6+15').total;
    if (hd <= 6 && H.CB.hunterSave('DEX', 15)) r = Math.floor(r / 2);
    H.log(`You were too close. <b>${r}</b> explosive damage.`, 'hurt');
    if (H.hurt(r)) H.CB.hunterDown('blown apart by their own dynamite');
  }
  for (const e of H.alive()) {
    const d = Math.abs(e.dist - pos);
    if (d > 8) continue;
    const C = H.foeC(e);
    let r = d <= 6 ? H.roll('12d12+25').total : H.roll('6d6+15').total;
    if (d <= 6 && H.d(20) + (C.save.DEX || 0) >= 15) r = Math.floor(r / 2); // [PROPOSED] DC 15 DEX for half
    H.CB.applyDamage(e, r, 'explosive');
  }
};

/* Noise (§4.8): gunfire draws grunts from the dark; Loud 1 staggers Stalkers within 20 m. */
H.CB.noise = (level) => {
  const c = H.S.combat;
  c.loud = Math.max(c.loud, level);
  c.gunAt = c.round;
  for (const e of H.alive()) if (e.state === 'passive') e.state = 'aggressive';
  if (level >= 2)
    for (const e of H.alive()) {
      if (e.stalker && e.dist <= 20) {
        const s = H.d(20) + 3;
        if (s < 14) {
          e.cond.staggered = true;
          H.log(`The noise hits the Stalker like a slap — <b>Staggered</b>. ${H.ref('6.1')}`, 'combat');
        }
      }
    }
  if (c.reserve > 0 && H.chance(level >= 2 ? 0.5 : 0.3)) {
    c.reserve--;
    const delay = Math.max(1, H.d(4) - (c.corr >= 3 ? 1 : 0));
    c.arrivals.push({ round: c.round + delay, key: c.reserveKey, dist: H.ri(30, 45) });
  }
};
H.CB.afterShotNoise = (gun, W, e, hit) => {
  if (!gun) return;
  H.CB.noise(W.loud ? 2 : 1);
  void e;
  void hit;
};

/* ---------------------------------------------------------------------
   Creatures act
   --------------------------------------------------------------------- */
H.CB.enemyTurn = (e) => {
  const S = H.S,
    c = S.combat,
    h = S.hunter;
  if (!c || e.dead || e.fled || c.over) return;
  const C = H.foeC(e);
  e.actedRound = c.round;
  // start-of-turn damage
  if (e.cond.bleed > 0) {
    const r = H.d(4);
    e.cond.bleed--;
    e.hp -= r;
    if (e.hp <= 0) {
      H.log(`The ${H.foeLabel(e).toLowerCase()} bleeds out.`, 'combat');
      return H.CB.kill(e, 'bleed');
    }
  }
  if (e.cond.burn > 0) {
    e.cond.burn--;
    H.CB.applyDamage(e, H.d(6) * (C.mods.fire || 1), 'fire');
    if (e.dead) return;
  }
  for (const f of c.fires)
    if (Math.abs(e.dist - f.pos) <= 3) {
      const r = H.roll(f.die).total;
      const mult = C.mods.fire != null ? C.mods.fire : 1;
      H.CB.applyDamage(e, Math.max(1, Math.floor(r * mult)), 'fire');
      if (e.dead) return;
    }
  if (e.life) {
    e.life--;
    if (e.life <= 0) {
      e.dead = true;
      return;
    }
  }
  // Sin Eater in the flames, then confused — it forgets every Threat (§6.1)
  if (C.sineater && e.cond.inFlames) {
    e.cond.inFlames--;
    if (e.cond.inFlames <= 0) {
      e.fled = true;
      H.log('<span class="good">The Sin Eater drags itself out of the fire</span> and wanders off, directionless — confused, its anger gone. It has forgotten you. ' + H.ref('6.1'), 'combat');
    } else H.log('The Sin Eater stands in the fire, steaming.', 'combat');
    return;
  }
  if (C.sineater && e.cond.holy > 0) e.cond.holy--;
  // Staggered: loses the whole turn. Stunned: loses the action and stands (half move).
  if (e.cond.staggered) {
    e.cond.staggered = false;
    H.log(`The ${H.foeLabel(e).toLowerCase()} is staggered and does nothing.`, 'combat');
    return H.CB.endFoeTurn(e);
  }
  let speed = e.cond.crippled ? 2 : C.speed || 0;
  if (C.sineater && c.terrain !== 'land') speed = C.waterSpeed;
  if (C.immolator && e.cond.flared) speed += 6;
  let canAct = true;
  if (e.cond.stunned) {
    e.cond.stunned = false;
    canAct = false;
    if (e.cond.prone) {
      e.cond.prone = false;
      speed = Math.floor(speed / 2);
    }
  } else if (e.cond.prone) {
    e.cond.prone = false;
    speed = Math.floor(speed / 2);
  }
  // Immolator burnout (§6.1)
  if (C.immolator && e.cond.flared) {
    e.cond.flareRounds--;
    if (e.cond.flareRounds <= 0) {
      H.log('The Immolator\'s fire eats the last of it from inside.', 'combat');
      H.CB.kill(e, 'fire');
      H.CB.immolatorBurst(e);
      return;
    }
  }
  // a Sin Eater walks on toward the next clean place unless something makes it a Threat (§6.1)
  if (C.sineater && !e.threat) {
    H.log('The Sin Eater walks on through the water, toward Ashville, paying you no mind.', 'combat');
    return H.CB.endFoeTurn(e);
  }
  // awareness
  if (e.state === 'passive') {
    if (e.dist <= 6 && !c.hidden) e.state = 'aggressive';
    else return H.CB.endFoeTurn(e);
  }
  if (c.hidden) {
    // searching: drift toward the last place they saw you
    const step = Math.min(Math.floor(speed / 2) || 1, Math.max(0, e.dist - 1));
    e.dist -= step;
    if (e.dist <= 2 && !C.blind) {
      H.log(`The ${H.foeLabel(e).toLowerCase()} stumbles right onto you. <b>You're found.</b>`, 'combat');
      H.CB.reveal();
    } else return H.CB.endFoeTurn(e);
  }
  // blind Meathead: knows only through its leeches or nearby gunfire (§6.1)
  if (C.blind) {
    const knows = c.leechKnows >= c.round - 2 || (c.gunAt >= c.round - 1 && e.dist <= 20);
    // shed leeches
    const nLeech = c.enemies.filter((x) => x.key === 'leech' && !x.dead).length;
    if (nLeech < 6) {
      const n = Math.min(H.d(4), 6 - nLeech);
      for (let i = 0; i < n; i++) {
        const l = H.makeFoe('leech', { dist: e.dist + H.ri(-1, 1), life: 5 });
        l.init = e.init;
        l.actedRound = c.round;
        c.enemies.push(l);
      }
      H.log(`The Meathead sheds ${H.num(n)} leech${n === 1 ? '' : 'es'} into the mud.`, 'combat');
    }
    if (!knows) {
      e.dist = Math.max(3, e.dist + H.ri(-3, 3));
      H.log('The Meathead turns in a slow circle, blind, listening.', 'combat');
      return H.CB.endFoeTurn(e);
    }
  }
  // the Immolator: standing still is safe (§6.1 Twitchy)
  if (C.immolator && !e.cond.flared && (!c.turn || c.turn.moved === 0) && c.round > 1) {
    H.log('The Immolator twitches, embers dripping, and holds. You are very, very still.', 'combat');
    return H.CB.endFoeTurn(e);
  }
  // Stalker pack: the Leader Marks the hunter, the pack converges (§6.1)
  if (C.stalker && e.stalker && e.leader && !c.marked && canAct) {
    c.marked = true;
    H.sfx('howl');
    H.log('<span class="bad">The pale one yells at you</span> — a Mark. Every Stalker in the pack turns and comes.', 'combat');
    canAct = false;
  }
  const A = H.CB.chooseAttack(e);
  const reach = A.range || A.reach || C.reach || 2;
  const cantReach = c.onHigh && !C.climb && reach < 3;
  // Water Devil never leaves the water
  if (C.waterdevil) {
    if (e.dist <= 3 && canAct) H.CB.foeAttack(e, { atk: A });
    return H.CB.endFoeTurn(e);
  }
  // Hive keeps her distance and casts
  if (C.hive) {
    if (!c.hiveShrieked) {
      c.hiveShrieked = true;
      H.sfx('scream');
      H.log(`<span class="bad">The Hive shrieks.</span> Somewhere out in the dark, grunts turn toward the sound. ${H.ref('6.1')}`, 'combat');
      c.arrivals.push({ round: c.round + 2, key: 'normal', dist: H.ri(35, 50) });
      if (H.chance(0.5)) c.arrivals.push({ round: c.round + 3, key: 'normal', dist: H.ri(35, 50) });
    }
    if (e.dist > 15) e.dist = Math.max(12, e.dist - speed);
    if (e.dist <= 15 && canAct) H.CB.foeAttack(e, { atk: A });
    return H.CB.endFoeTurn(e);
  }
  // move
  const want = Math.max(1, reach - 1);
  let moved = 0;
  if (e.dist > want) {
    let sp = speed;
    // Stalkers Dash when far, or when the Leader has Marked
    if (C.dash && e.stalker && canAct && (e.dist - want > speed || (c.marked && !e.leader && e.dist - want > speed))) {
      sp = speed * 2;
      canAct = false;
      H.log('A Stalker breaks into a dead run.', 'combat');
    }
    // Hellhounds close the gap at a lope
    const step = Math.min(sp, e.dist - want);
    e.dist -= step;
    moved = step;
  }
  // Prepared Aim / Strike trigger (§4.3)
  const p = c.prepared;
  if (p && !p.fired && h.hp > 0) {
    if (p.method === 'aim' && moved > 0 && H.CB.ready(H.inHand()) === true) {
      p.fired = true;
      H.log('<span class="good">Your prepared shot fires</span> as it moves.', 'combat');
      H.CB.attack(e, 'prepared');
      if (e.dead || e.cond.staggered || e.cond.stunned) return H.CB.endFoeTurn(e);
    } else if (p.method === 'strike' && moved > 0 && e.dist <= 2) {
      const wp = H.inHand();
      if (wp && H.CB.ready(wp) === true) {
        p.fired = true;
        H.log('<span class="good">Your prepared strike lands first</span> as it steps in.', 'combat');
        const W = H.WEAPONS[wp.key];
        H.CB.attack(e, W.kind === 'melee' ? 'slash' : 'stock', { strike: true });
        if (e.dead || e.cond.staggered || e.cond.stunned) return H.CB.endFoeTurn(e);
      }
    }
  }
  if (!canAct) return H.CB.endFoeTurn(e);
  if (e.dist > reach) return H.CB.endFoeTurn(e);
  if (cantReach) {
    if (H.chance(0.5)) H.log(`The ${H.foeLabel(e).toLowerCase()} claws at ${c.featName}, unable to climb.`, 'combat');
    return H.CB.endFoeTurn(e);
  }
  // a doorway lets only one reach you at a time (§4.9)
  if (c.inDoor && reach <= 2) {
    c.doorUsed = c.doorUsed || {};
    if (c.doorUsed[c.round] && c.doorUsed[c.round] !== e.uid) return H.CB.endFoeTurn(e);
    c.doorUsed[c.round] = e.uid;
  }
  H.CB.foeAttack(e, { atk: A, moved });
  H.CB.endFoeTurn(e);
};

H.CB.endFoeTurn = (e) => {
  if (e.cond.alight) {
    e.cond.alight--;
    if (e.cond.alight <= 0 && !e.dead) {
      H.log('The burning grunt crumples into the mud, still smoking.', 'combat');
      H.CB.kill(e, 'fire');
    }
  }
};

H.CB.chooseAttack = (e) => {
  const C = H.foeC(e);
  const list = C.attacks;
  return H.wpick(list.map((a) => [a.w || 1, a]));
};

/* A creature swings at the hunter. Creature attacks use flat damage — no ACV against the hunter (§4.4a). */
H.CB.foeAttack = (e, o) => {
  const S = H.S,
    c = S.combat,
    h = S.hunter;
  if (h.hp <= 0) {
    // reaching a downed or stabilized hunter kills them (§3.4 PROVISIONAL)
    if (c.down && !e.dead && e.dist <= 2) return H.hunterDies(`killed by ${H.CREATURES[e.key].plural.toLowerCase()} while helpless in the mud`);
    return;
  }
  const C = H.foeC(e);
  const A = (o && o.atk) || H.CB.chooseAttack(e);
  let atk = A.atk;
  const mods = [];
  // Mob Pressure: two or more grunts attacking the same target: +1 each (§6.1)
  const mob = C.mob ? H.alive().filter((x) => H.foeC(x).mob && x.dist <= 2).length : 0;
  if (C.mob && mob >= 2 && !c.inDoor) {
    atk += 1;
    mods.push('mob +1');
  }
  let adv = false,
    dis = false;
  if (C.packTactics && !c.inDoor && H.alive().filter((x) => x.key === e.key && x.uid !== e.uid && x.dist <= 2).length) {
    adv = true;
    mods.push('pack tactics');
  }
  if (c.dodge) dis = true;
  if (c.cond.prone) {
    if ((A.range || 0) > 3) dis = true;
    else adv = true;
  }
  if (c.hidden || c.unseen) adv = true;
  let ac = H.ac(h);
  // Prepared Block (§4.3)
  const p = c.prepared;
  let blockTxt = '';
  if (p && p.method === 'block' && !p.fired) {
    p.fired = true;
    const wp = H.inHand();
    const g = wp ? H.WEAPONS[wp.key].guard : -1;
    let b = 0;
    if (g === 2) b = H.d(6);
    else if (g === 1) b = H.d(4);
    else if (g === 0) b = 1;
    ac += b;
    blockTxt = ` You block with the ${wp ? H.WEAPONS[wp.key].name : 'nothing'} (+${b} AC).`;
    if (wp && g === 0) H.CB.wearWeapon(wp, 1, 'The block jars the frame.');
  }
  const r = H.d20(adv, dis);
  const tot = r.die + atk;
  const hit = r.die !== 1 && (r.die === 20 || tot >= ac);
  const nm = H.foeLabel(e);
  if (!hit) {
    H.log(`${H.cap(e.look.split(',')[0])} — <i>${A.n}</i>: ${tot} vs AC ${ac}${mods.length ? ' (' + mods.join(', ') + ')' : ''}${r.dice.length > 1 ? ` [${r.mode}]` : ''} — <span class="good">misses — ${H.w('foeMiss')}.</span>${blockTxt}`, 'enemy');
    return;
  }
  let dmgR = H.roll(A.dmg);
  let dmg = Math.max(1, dmgR.total);
  if (r.die === 20) dmg *= 2;
  let fire = 0;
  if (A.fire && !(H.foeC(e).immolator && c.terrain === 'water')) {
    fire = H.roll(A.fire).total;
    if (C.immolator && e.cond.flared) fire += H.d(6);
    if (C.butcher && e.hp < 45) fire += H.d(6);
  }
  H.sfx(e.key === 'hellhound' ? 'bark' : 'hurt');
  H.log(`${H.cap(e.look.split(',')[0])} — <i>${A.n}</i>: ${tot} vs AC ${ac}${mods.length ? ' (' + mods.join(', ') + ')' : ''}${r.die === 20 ? ' — <b>natural 20</b>' : ''} — <span class="bad">hits for ${dmg}${fire ? ` + ${fire} fire` : ''} — ${H.w('foeHit')}.</span>${blockTxt} ${H.ref('6.1')}`, 'enemy');
  let down = H.hurt(dmg, A.type);
  if (fire && !down) down = H.hurt(fire, 'fire');
  if (down) return H.CB.hunterDown(`killed by ${C.plural === 'Armored' ? 'an Armored' : C.name === 'The Butcher' ? 'the Butcher' : 'a ' + C.name}`);
  // on-hit riders
  if (A.infect) H.CB.infect(A.infect);
  if (A.swarm && !c.cond.swarmed) {
    c.cond.swarmed = true;
    H.log('<b>Swarmed.</b> The wasps are on you. Get 15 m from the Hive, beat them off (Action), get into water — or kill her.', 'hurt');
  }
  if (A.ignite && !c.cond.burn && c.terrain !== 'water') {
    if (!H.CB.hunterSave('DEX', A.ignite)) {
      c.cond.burn = 3;
      H.log('<b>You are Burning.</b> Drop and roll (Action), or get into water.', 'hurt');
    }
  }
  if (A.venom) {
    if (!H.CB.hunterSave('CON', A.venom)) {
      const v = H.roll('2d4').total;
      c.cond.poisoned = 1;
      H.log(`Green mist in your lungs: <b>${v}</b> poison, and you're Poisoned.`, 'hurt');
      if (H.hurt(v, 'poison')) return H.CB.hunterDown('poisoned by a Bileweaver');
    }
  }
  if (A.slow) {
    c.cond.slowed = true;
    c.leechKnows = c.round;
  }
  if (A.drag) {
    if (!H.CB.hunterSave('STR', A.drag)) {
      e.dist -= 3;
      for (const x of H.alive()) if (x !== e) x.dist = Math.max(1, x.dist + 0);
      H.log(e.dist <= 0 ? '<span class="bad">It drags you into the water.</span>' : 'It drags you 3 m toward the water.', 'hurt');
      H.sfx('splash');
    }
  }
  if (A.trample && o && o.moved >= 4) {
    c.cond.prone = true;
    H.log('It tramples you flat. <b>Prone.</b>', 'hurt');
  }
  if (A.hookPull && (r.die === 18 || r.die === 19)) H.log('The hook catches and drags you in close.', 'hurt');
  // Hellhound Worry: two hits on consecutive turns → Bleeding (§6.1)
  if (C.worry) {
    if (e.hitStreak === c.round - 1) {
      c.cond.bleed = 3;
      H.log('It worries the wound open. <b>You\'re bleeding.</b>', 'hurt');
    }
    e.hitStreak = c.round;
  }
  // Mob Pressure: three or more → DEX save DC 10 or Grappled
  if (C.mob && mob >= 3 && !c.cond.grappled && !c.inDoor) {
    if (!H.CB.hunterSave('DEX', 10)) {
      c.cond.grappled = true;
      H.log('Hands, too many hands. <b>Grappled.</b>', 'hurt');
    }
  }
  // Prepared Retaliate (§4.3)
  if (p && p.method === 'retaliate' && !p.fired && h.hp > 0) {
    p.fired = true;
    const wp = H.inHand();
    const blade = wp && (wp.key === 'knife' || wp.key === 'sword');
    if (blade && e.dist <= 2) {
      H.log('You retaliate with the blade.', 'combat');
      H.CB.attack(e, 'retaliate');
    } else if (e.dist <= 2 && !['large'].includes(C.size)) {
      e.dist += 2;
      H.log('You shove it back 2 m.', 'combat');
    }
  }
};

H.CB.infect = (type) => {
  const h = H.S.hunter;
  if (h.infections.some((i) => i.type === type)) {
    H.log(`<span class="dim">Another dirty wound — but ${type} doesn't stack with ${type}.</span>`, 'sys');
    return;
  }
  const hrs = type === 'Dirty' ? H.d(8) + 6 : H.d(3) + 6;
  h.infections.push({ type, stage: 'window', hours: hrs });
  H.log(`<span class="bad">The wound is ${type}.</span> Clean it with high-proof liquor, a First Aid Kit or a Medkit within <b>${hrs} hours</b>, or it sets in. ${H.ref('3.11')}`, 'hurt');
};

/* ---------------------------------------------------------------------
   The hunter dies
   --------------------------------------------------------------------- */
H.hunterDies = (cause) => {
  const S = H.S,
    h = S.hunter;
  if (S.phase === 'dead') return;
  S.combat = null;
  S.phase = 'dead';
  h.hp = 0;
  H.sfx('toll');
  H.setMood('dead');
  const entry = {
    name: h.name,
    date: `${H.date()} — ${H.tod().name}`,
    cause: H.cap(cause) + '.',
    days: S.world.day - h.stats.arrivedDay + 1,
    jobs: h.stats.jobs,
    kills: h.stats.kills,
  };
  H.addToLedger(entry);
  S.deadEntry = entry;
  H.ui.divider();
  H.log(`<span class="bad big">${H.esc(h.name)} is dead.</span> ${H.esc(H.cap(cause))}. The bayou closes over the place like water. ${H.ref('3.4')}`, 'hurt');
  try {
    localStorage.removeItem(H.KEY + 'auto');
  } catch (e) {}
  H.S.scene = { id: 'dead', p: {} };
  H.scenes.dead.enter();
  H.ui.render();
};

H.scenes.dead = {
  art: () => ({ kind: 'dead', seed: 'dead', caption: 'Here lies a White Shirt' }),
  mood: 'dead',
  freeform: false,
  enter: () => {
    const e = H.S.deadEntry || {};
    H.log(`<div class="epitaph"><div>HERE LIES</div><div class="ename">${H.esc(e.name || '')}</div><div>${H.esc(e.date || '')}</div><div class="dim">${e.days} day${e.days === 1 ? '' : 's'} in the bayou · ${e.jobs} job${e.jobs === 1 ? '' : 's'} · ${e.kills} kill${e.kills === 1 ? '' : 's'}</div><div><i>The swamp takes all it can, and it always leaves its mark.</i></div></div>`, 'epi');
  },
  opts: () => [
    { t: 'Sign a new name in the ledger. <span class="dim">(The world remembers: the day, the prices, what was taken.)</span>', act: () => H.newHunterSameWorld() },
    { t: 'Start over in a fresh world.', act: () => H.newGame() },
    { t: 'Read the Ledger of the Dead.', act: () => H.ui.showLedger() },
  ],
};

/* ---- js/combat_ui.js ---- */
/* =====================================================================
   HUNT · 1896 — the combat panel: foes, the turn economy, and every
   action the hunter can take on their turn (§4.3).
   ===================================================================== */
'use strict';

H.combatUI = (box) => {
  const c = H.S.combat,
    h = H.S.hunter;
  if (!c) return;
  const wrap = H.el('div', { class: 'combat' });

  // ---- header ----
  const terr = c.terrain === 'water' ? 'in the water (speed 7 m)' : c.terrain === 'mixed' ? 'mud and shallows' : 'solid ground';
  const pos = c.onHigh ? `up on ${c.featName}` : c.inDoor ? 'holding the doorway' : '';
  wrap.appendChild(H.el('div', { class: 'chead', html: `<b>Round ${Math.max(1, c.round)}</b> · ${terr}${pos ? ' · <span class="good">' + pos + '</span>' : ''}${c.corr ? ` · <span class="dim" title="Corruption ${c.corr} (§2.6)">the air tastes of tar${c.corr >= 2 ? ', thick' : ''}</span>` : ''}` }));

  // ---- foes ----
  const foes = H.el('div', { class: 'foes' });
  const tgt = H.CB.target();
  const list = c.enemies.filter((e) => !e.dead && !e.fled).sort((a, b) => a.dist - b.dist);
  const gone = c.enemies.filter((e) => e.dead);
  for (const e of list) {
    const C = H.foeC(e);
    const chips = [];
    if (e.leader && e.stalker) chips.push('<i class="chip lead">leader</i>');
    if (e.state === 'passive') chips.push('<i class="chip">unaware</i>');
    if (c.hidden && e.state !== 'passive') chips.push('<i class="chip">searching</i>');
    if (e.cond.prone) chips.push('<i class="chip">prone</i>');
    if (e.cond.stunned) chips.push('<i class="chip">stunned</i>');
    if (e.cond.staggered) chips.push('<i class="chip good">staggered</i>');
    if (e.cond.crippled) chips.push('<i class="chip">crippled</i>');
    if (e.cond.bleed) chips.push('<i class="chip red">bleeding</i>');
    if (e.cond.alight || e.cond.burn) chips.push('<i class="chip red">burning</i>');
    if (e.cond.flared) chips.push('<i class="chip red">FLARED</i>');
    if (e.cond.holy) chips.push(`<i class="chip good">fragile ${e.cond.holy}</i>`);
    if (e.cond.inFlames) chips.push('<i class="chip red">in the flames</i>');
    if (e.threat) chips.push('<i class="chip red">you are its Threat</i>');
    const card = H.el('button', {
      class: 'foe' + (tgt && tgt.uid === e.uid ? ' sel' : ''),
      title: 'Select as target',
      html: `<div class="fname">${H.esc(H.foeLabel(e))}</div><div class="fdist">${C.waterdevil ? (e.dist <= 0 ? 'you are IN its water' : `${Math.round(e.dist)} m from the water`) : Math.round(e.dist) + ' m'}</div><div class="fhp">${H.foeHealthWord(e)}</div><div class="chips">${chips.join('')}</div>`,
      onclick: () => {
        c.sel = e.uid;
        H.refresh();
      },
    });
    foes.appendChild(card);
  }
  if (gone.length) foes.appendChild(H.el('div', { class: 'foe dead', html: `<div class="fname">✝ ${gone.length} down</div>` }));
  if (c.arrivals.length) foes.appendChild(H.el('div', { class: 'foe dead', html: '<div class="fname">…something is coming</div>' }));
  wrap.appendChild(foes);

  // ---- you ----
  const yc = [];
  const k = c.cond;
  if (k.bleed) yc.push(`<i class="chip red">bleeding ${k.bleed}</i>`);
  if (k.burn) yc.push('<i class="chip red">burning</i>');
  if (k.swarmed) yc.push('<i class="chip red">swarmed</i>');
  if (k.poisoned || k.poisonedNow) yc.push('<i class="chip">poisoned</i>');
  if (k.prone) yc.push('<i class="chip">prone</i>');
  if (k.grappled) yc.push('<i class="chip red">grappled</i>');
  if (c.hidden) yc.push('<i class="chip good">hidden</i>');
  if (c.unseen) yc.push('<i class="chip good">unseen</i>');
  if (c.dodge) yc.push('<i class="chip">dodging</i>');
  if (c.prepared) yc.push(`<i class="chip good">prepared: ${c.prepared.method}${c.prepared.fired ? ' (spent)' : ''}</i>`);
  if (c.turn && c.turn.aim && !c.turn.aimUsed) yc.push('<i class="chip good">aimed +5</i>');
  const wp = H.inHand();

  // ---- phases ----
  if (c.phase === 'init') {
    wrap.appendChild(H.el('div', { class: 'cmsg', html: 'Roll for initiative: <b>1d20 + DEX</b>.' }));
    const b = H.el('button', { class: 'rollbtn' }, '🎲 Roll initiative');
    b.addEventListener('click', () => {
      H.audioInit();
      try {
        H.CB.rollInit(false);
      } catch (err) {
        H.ui.crash(err);
      }
    });
    wrap.appendChild(b);
    box.appendChild(wrap);
    b.focus();
    return;
  }
  if (c.down) {
    wrap.appendChild(H.el('div', { class: 'cmsg bad', html: c.down.stable ? 'You are down but stable. If anything reaches you, you die. If nothing does, you\'ll wake in a few hours.' : `You are dying. Death saves: <b>10+</b> stabilizes; three failures and it's over. (Failures: ${c.down.fails}/3)` }));
    const b = H.el('button', { class: 'rollbtn' }, c.down.stable ? 'Lie still' : '🎲 Roll a death save');
    b.addEventListener('click', () => {
      try {
        H.CB.deathSave();
      } catch (err) {
        H.ui.crash(err);
      }
    });
    wrap.appendChild(b);
    box.appendChild(wrap);
    return;
  }
  if (c.phase !== 'hunter' || !c.turn) {
    box.appendChild(wrap);
    return;
  }
  const t = c.turn;
  wrap.appendChild(
    H.el('div', {
      class: 'econ',
      html: `<span class="${t.move > 0 ? '' : 'spent'}">Movement <b>${t.move} m</b></span><span class="${t.action ? '' : 'spent'}">Action ${t.action ? '●' : '○'}</span><span class="${t.bonus ? '' : 'spent'}">Bonus ${t.bonus ? '●' : '○'}</span><span class="youchips">${yc.join('')}</span>${h.sp ? `<label class="arm"><input type="checkbox" id="cbArm" ${h.armedSP ? 'checked' : ''}> ✦ spend SP on next roll (${h.sp})</label>` : ''}`,
    })
  );
  const arm = wrap.querySelector('#cbArm');
  if (arm) arm.addEventListener('change', () => (h.armedSP = arm.checked));

  const groups = { mov: [], act: [], bon: [], oth: [] };
  const add = (g, label, dis, fn, cls, tip) => groups[g].push({ label, dis, fn, cls, tip });
  const W = wp ? H.WEAPONS[wp.key] : null;
  const rdy = H.CB.ready(wp);
  const inReach = tgt && tgt.dist <= 2 && !H.foeC(tgt).waterdevil;
  const hasT = !!tgt;

  // ---------- Movement ----------
  const canMove = t.move > 0 && !k.grappled;
  if (!c.onHigh) {
    add('mov', 'Advance 3 m', !canMove ? 'No movement' : !hasT ? 'Nothing to advance on' : tgt.dist <= 1 ? 'Already on top of it' : false, () => H.CB.move(-1, 3));
    add('mov', `Close on target (${tgt ? Math.max(0, Math.round(tgt.dist - 1)) : 0} m)`, !canMove ? 'No movement' : !hasT ? 'No target' : tgt.dist - 1 > t.move ? 'Too far this turn' : tgt.dist <= 1 ? 'Already there' : false, () => H.CB.move(-1, Math.ceil(tgt.dist - 1)));
    add('mov', 'Fall back 3 m', !canMove && 'No movement', () => H.CB.move(1, 3));
    add('mov', `Fall back ${t.move} m`, (!canMove || t.move <= 3) && 'Not enough movement', () => H.CB.move(1, t.move));
  }
  if (c.feature === 'high' && !c.onHigh) add('mov', `Get up onto ${c.featName}`, (t.move < 3 || k.grappled) && 'Needs 3 m of movement', () => { t.move = 0; c.onHigh = true; c.inDoor = false; H.log(`You scramble up onto ${c.featName}. Most things down there can't climb. ${H.ref('4.9')}`, 'move'); H.refresh(); }, 'good');
  if (c.onHigh) add('mov', `Climb down from ${c.featName}`, t.move < 3 && 'Needs 3 m', () => { t.move -= 3; c.onHigh = false; H.log('You drop back down into the mud.', 'move'); H.refresh(); });
  if (c.feature === 'door' && !c.inDoor && !c.onHigh) add('mov', 'Back into the doorway', (t.move < 2 || k.grappled) && 'Needs 2 m', () => { t.move -= 2; c.inDoor = true; H.log(`You put your back to the doorframe. Only one of them can reach you at a time here. ${H.ref('4.9')}`, 'move'); H.refresh(); }, 'good');
  // movement-cost mechanics: Aim, Power Shot, Stand Your Ground (they never combine)
  const mechFree = !t.moveMech && t.moved === 0 && t.move > 0 && !k.grappled;
  const mechWhy = t.moveMech ? 'Movement already committed' : t.moved > 0 ? 'You\'ve already moved' : 'No movement';
  if (W && W.kind !== 'melee') add('mov', 'Aim (+5 to your next shot)', !mechFree ? mechWhy : t.aim ? 'Already aiming' : false, () => { t.moveMech = true; t.move = 0; t.aim = 5; t.aimUsed = false; H.log(`You settle the ${W.name} and take your time. ${H.ref('4.3')}`, 'act'); H.refresh(); }, '', 'Spend your Movement: +5 Attack on your next single attack.');

  // ---------- Actions ----------
  if (W && W.kind !== 'melee') {
    const why = !t.action ? 'Action spent' : rdy !== true ? rdy : !hasT ? 'No target' : false;
    let rng = '';
    if (tgt && W.er && tgt.dist > W.er) rng = ` <span class="warn">past effective range</span>`;
    add('act', `Fire the ${W.name}${rng}`, why, () => { t.action = false; H.CB.attack(tgt, 'shot'); H.CB.afterAct(); }, 'attack');
    if (W.power) add('act', 'Power Shot (Action + Movement)', why || (!mechFree && mechWhy), () => { t.action = false; t.moveMech = true; t.move = 0; H.CB.attack(tgt, 'power'); H.CB.afterAct(); }, 'attack', '3d10+8: draw fully, stand still.');
    add('act', `${W.melee} (melee)`, !t.action ? 'Action spent' : !inReach ? 'Out of reach' : wp.dropped ? 'Pick it up first' : false, () => { t.action = false; H.CB.attack(tgt, 'stock'); H.CB.afterAct(); });
  }
  if (W && W.kind === 'melee') {
    const why = !t.action ? 'Action spent' : rdy !== true ? rdy : !hasT ? 'No target' : !inReach ? 'Out of reach (2 m)' : false;
    add('act', W.key === 'dusters' ? 'Punch' : `Slash with the ${W.name}`, why, () => { t.action = false; H.CB.attack(tgt, 'slash'); H.CB.afterAct(); }, 'attack');
    if (W.thrust) add('act', 'Thrust (piercing, adds STR)', why, () => { t.action = false; t.thrusted = true; H.CB.attack(tgt, 'thrust'); H.CB.afterAct(); }, 'attack');
    if (W.standGround) add('mov', 'Stand Your Ground: an extra slash', !mechFree ? mechWhy : rdy !== true ? rdy : !inReach ? 'Out of reach' : false, () => { t.moveMech = true; t.move = 0; H.CB.attack(tgt, 'syg'); H.CB.afterAct(); }, 'attack', 'Trade your Movement for one additional slash.');
  }
  // reloads
  for (const o of H.CB.reloadOpts(wp)) add(o.k, o.t, o.dis, o.f);
  // throwables
  const thr = (key, label) => {
    if (!H.countItem(key)) return;
    add('act', `${label} (${H.countItem(key)})`, !t.action ? 'Action spent' : !hasT ? 'No target' : tgt.dist > 22 ? 'Beyond 22 m' : false, () => { t.action = false; H.CB.throwIt(key, tgt); H.CB.afterAct(); }, 'attack');
  };
  thr('dynamite', 'Light and throw dynamite');
  thr('firebomb', 'Throw a firebomb');
  thr('hellfire', 'Throw a Hell-Fire bomb');
  thr('holy', 'Throw holy water');
  // healing
  const mk = h.items.find((i) => i.key === 'medkit' && i.charges > 0);
  if (mk) add('act', `Medkit (+15, ${mk.charges} left)`, !t.action ? 'Action spent' : h.hp >= H.maxHp(h) && !k.bleed ? 'Not hurt' : false, () => { t.action = false; H.useHeal(mk, true); k.bleed = 0; H.CB.afterAct(); });
  if (H.countItem('fak')) add('act', 'First Aid Kit (2d8)', !t.action ? 'Action spent' : h.hp >= H.maxHp(h) && !k.bleed ? 'Not hurt' : false, () => { t.action = false; H.useHeal(H.findItem('fak'), true); k.bleed = 0; H.CB.afterAct(); });
  // conditions
  if (k.bleed) add('act', 'Bind the wound', !t.action && 'Action spent', () => { t.action = false; k.bleed = 0; H.log('You cinch a strip of shirt around it until the bleeding stops.', 'act'); H.CB.afterAct(); });
  if (k.burn) add('act', 'Drop and roll', !t.action && 'Action spent', () => { t.action = false; k.burn = 0; k.prone = true; H.log('You throw yourself down and roll in the mud until the fire is out.', 'act'); H.CB.afterAct(); });
  if (k.swarmed) add('act', 'Beat off the swarm', !t.action && 'Action spent', () => { t.action = false; k.swarmed = false; H.log('You thrash and slap and tear at your collar until the swarm lifts.', 'act'); H.CB.afterAct(); });
  if (k.grappled) add('act', 'Break the grapple', !t.action && 'Action spent', () => { t.action = false; H.CB.escape(); H.CB.afterAct(); });
  add('act', 'Dash (double movement)', (!t.action || k.grappled) && (k.grappled ? 'Grappled' : 'Action spent'), () => { t.action = false; t.move += H.speed(h, c.terrain === 'water'); H.log('You run.', 'act'); H.refresh(); });
  add('act', 'Disengage', (!t.action || t.disengaged) && 'Action spent', () => { t.action = false; t.disengaged = true; H.log('You pick your way back carefully — no openings.', 'act'); H.refresh(); });
  add('act', 'Dodge', !t.action && 'Action spent', () => { t.action = false; c.dodge = true; H.log('You keep low and moving. Attacks against you have disadvantage until your next turn.', 'act'); H.refresh(); });
  const near = H.alive().filter((e) => e.state !== 'passive' && !H.foeC(e).blind && e.dist <= (h.boons.includes('ambush') && c.terrain !== 'town' ? 3 : 6));
  if (!c.hidden) add('act', 'Hide', !t.action ? 'Action spent' : near.length ? 'Too close to be missed' : false, () => { t.action = false; H.CB.hide(); H.CB.afterAct(); });
  if (inReach && !['large'].includes(H.foeC(tgt).size)) add('act', 'Shove it down', !t.action && 'Action spent', () => { t.action = false; H.CB.shove(tgt); H.CB.afterAct(); });
  // Prepared (§4.3) — the gamble
  const rangedReady = W && W.kind !== 'melee' && rdy === true;
  if (!c.prepared) {
    add('act', 'Prepare: Aim (fire the moment one moves, +5)', !t.action ? 'Action spent' : !rangedReady ? 'Need a loaded ranged weapon' : W.kind === 'bow' ? 'A bow can\'t hold a draw' : false, () => { t.action = false; c.prepared = { method: 'aim' }; H.log(`You hold your aim on the dark. <span class="dim">If nothing moves, the Action is spent for nothing.</span> ${H.ref('4.3')}`, 'act'); H.refresh(); });
    add('act', 'Prepare: Strike (hit the first one that steps in, +5)', !t.action ? 'Action spent' : !wp ? 'Nothing in hand' : false, () => { t.action = false; c.prepared = { method: 'strike' }; H.log('You set your feet and wait for it to come to you. <span class="dim">If none does, the Action is wasted.</span>', 'act'); H.refresh(); });
    const g = W ? W.guard : -1;
