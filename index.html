    add('bon', `Prepare: Block (${g === 2 ? '+1d6 AC' : g === 1 ? '+1d4 AC' : g === 0 ? '+1 AC, wears the weapon' : 'can\'t block'})`, !t.bonus ? 'Bonus Action spent' : g < 0 ? 'Not a blocking weapon' : false, () => { t.bonus = false; c.prepared = { method: 'block' }; H.log('You bring the weapon up to take the next blow.', 'act'); H.refresh(); });
    add('bon', 'Prepare: Retaliate', !t.bonus && 'Bonus Action spent', () => { t.bonus = false; c.prepared = { method: 'retaliate' }; H.log('If it hits you, it pays for it.', 'act'); H.refresh(); });
  }

  // ---------- Bonus Actions ----------
  for (const o of h.weapons) if (o.uid !== h.hand && !o.dropped) add('bon', `Draw the ${H.WEAPONS[o.key].name}`, !t.bonus && 'Bonus Action spent', () => { t.bonus = false; h.hand = o.uid; H.sfx('reload'); H.log(`You draw the ${H.WEAPONS[o.key].name}.`, 'act'); H.refresh(); });
  for (const o of h.weapons) if (o.dropped) add('bon', `Pick up the ${H.WEAPONS[o.key].name}`, !t.bonus && 'Bonus Action spent', () => { t.bonus = false; o.dropped = false; H.log('You snatch it out of the mud.', 'act'); H.refresh(); });
  if (t.ambushDis && !t.disengaged) add('bon', 'Disengage (Bushranger\'s Ambush)', !t.bonus && 'Bonus Action spent', () => { t.bonus = false; t.disengaged = true; H.log('Hit and gone — the old bushranger trick.', 'act'); H.refresh(); }, 'good');

  // ---------- Leaving ----------
  const threats = H.alive().filter((e) => e.state !== 'passive' && !H.foeC(e).waterdevil && !(H.foeC(e).sineater && !e.threat));
  const closest = threats.length ? Math.min(...threats.map((e) => e.dist)) : 999;
  const canSlip = !k.grappled && (closest >= 25 || (c.hidden && closest >= 10));
  if (c.fleeTo) add('oth', 'Slip away into the bayou', !canSlip && 'They\'re too close — get 25 m clear, or hide', () => { H.log('You turn and go, and you don\'t look back.', 'act'); H.CB.finish('flee'); }, 'flee');
  add('oth', 'End your turn', false, () => H.CB.endHunterTurn(), 'end');

  const grid = H.el('div', { class: 'cgroups' });
  const names = { mov: 'Movement', act: 'Action', bon: 'Bonus Action', oth: '' };
  const spentNow = { mov: t.move <= 0, act: !t.action, bon: !t.bonus, oth: false };
  for (const g of ['mov', 'act', 'bon', 'oth']) {
    // once a resource is spent, its column collapses to what is still possible
    const list = groups[g].filter((o) => !(spentNow[g] && typeof o.dis === 'string' && /spent|No movement|Needs \d+ m|Not enough movement|already committed|already moved/i.test(o.dis)));
    if (!list.length && !groups[g].length) continue;
    const col = H.el('div', { class: 'cgroup ' + g }, names[g] ? H.el('h4', { html: names[g] + (spentNow[g] && g !== 'oth' ? ' <span class="spent">— spent</span>' : '') }) : null);
    for (const o of list) {
      const b = H.el('button', { class: 'cbtn ' + (o.cls || '') + (o.dis ? ' disabled' : ''), disabled: o.dis ? true : null, title: typeof o.dis === 'string' ? o.dis : o.tip || null, html: o.label + (typeof o.dis === 'string' ? `<small>${H.esc(o.dis)}</small>` : '') });
      if (!o.dis)
        b.addEventListener('click', () => {
          H.audioInit();
          H.ui.markNext = true;
          if (!H.S.combat) return H.refresh();
          try {
            o.fn();
          } catch (err) {
            H.ui.crash(err);
          }
        });
      col.appendChild(b);
    }
    grid.appendChild(col);
  }
  wrap.appendChild(grid);
  box.appendChild(wrap);
};

H.CB.afterAct = () => {
  if (!H.S.combat) return;
  if (H.CB.checkEnd()) return;
  H.refresh();
};

/* Throwing (§5.6). Dynamite goes off at the end of the round; fire must strike something solid. */
H.CB.throwIt = (key, tgt) => {
  const c = H.S.combat,
    h = H.S.hunter;
  H.takeItem(key, 1, false);
  if (key === 'dynamite') {
    c.dyn.push({ pos: tgt.dist });
    H.log(`You light the fuse off your tinderbox and throw — it lands ${Math.round(tgt.dist)} m out, hissing. <b>Four seconds.</b>`, 'act');
    H.sfx('fire');
    return;
  }
  if (key === 'firebomb' || key === 'hellfire') {
    H.sfx('glass');
    if (c.terrain === 'water') {
      H.log('<i>Plomp.</i> It drops into the black water and goes nowhere. A firebomb has to break on something solid.', 'act');
      return;
    }
    c.fires.push({ pos: tgt.dist, rounds: 20, die: key === 'hellfire' ? '1d8+3' : '1d4+3' });
    H.sfx('fire');
    H.log(`The bottle bursts ${Math.round(tgt.dist)} m out and the ground there turns to fire. Anything that starts its turn within 3 m of it burns. ${H.ref('5.6')}`, 'act');
    if (key === 'hellfire') H.CB.noise(2);
    // the first lick of flame lands now on whatever it hit
    for (const e of H.alive())
      if (Math.abs(e.dist - tgt.dist) <= 3) {
        const C = H.foeC(e);
        const r = H.roll(key === 'hellfire' ? '1d8+3' : '1d4+3').total;
        H.CB.applyDamage(e, Math.max(1, Math.floor(r * (C.mods.fire != null ? C.mods.fire : 1))), 'fire');
      }
    if (Math.abs(tgt.dist) <= 3) H.log('<span class="bad">You are inside your own fire.</span>', 'hurt');
    return;
  }
  if (key === 'holy') {
    const r = H.d20(false, false);
    const m = H.am(h, 'DEX');
    const tot = r.die + m;
    const C = H.foeC(tgt);
    const hit = r.die !== 1 && (r.die === 20 || tot >= C.ac);
    H.sfx('glass');
    H.log(`<span class="roll">Holy water → ${H.esc(H.foeLabel(tgt))}: 1d20 (${r.die}) + DEX (${H.sgn(m)}) = <b>${tot}</b></span> — ${hit ? '<span class="good">it shatters on target.</span>' : '<span class="bad">it smashes in the mud.</span>'} ${H.ref('5.6')}`, 'attack');
    if (hit && C.sineater) {
      tgt.cond.holy = 3;
      H.log('<span class="good">The mud boils where the water touched it.</span> For three turns, the Sin Eater is fragile — <b>everything you have will hurt it</b>. Commit.', 'combat');
    } else if (hit) H.log('<span class="dim">It hisses and steams, and does nothing else.</span>', 'combat');
  }
};

H.CB.hide = () => {
  const c = H.S.combat,
    h = H.S.hunter;
  const watchers = H.alive().filter((e) => e.state !== 'passive' && !H.foeC(e).blind);
  const pp = watchers.length ? Math.max(...watchers.map((e) => H.foeC(e).pp)) : 8;
  const dc = pp + Math.min(8, 2 * c.corr);
  const mods = H.skillMods(h, 'Stealth');
  let adv = false;
  if (h.armedSP && h.sp > 0) {
    h.sp--;
    h.armedSP = false;
    adv = true;
  }
  const r = H.d20(adv, c.corr >= 2);
  const tot = r.die + H.modsSum(mods);
  const ok = tot >= dc;
  H.log(`<span class="roll">🎲 Hide: 1d20 (${H.diceText(r)})${H.modsText(mods)} = <b>${tot}</b></span> · <em>${H.dcInfo(dc).label}</em> — ${ok ? '<span class="good">you vanish into the reeds.</span>' : '<span class="bad">they still have you.</span>'}${c.corr >= 2 ? ' <span class="dim">(the bayou watches with them — disadvantage)</span>' : ''} ${H.ref('4.8')}`, 'rollline');
  if (ok) c.hidden = true;
};

H.CB.shove = (e) => {
  const h = H.S.hunter;
  const C = H.foeC(e);
  const mods = H.skillMods(h, 'Athletics');
  const r = H.d20(false, false);
  const tot = r.die + H.modsSum(mods);
  const them = H.d(20) + Math.max(C.save.STR || 0, C.save.DEX || 0);
  const ok = tot >= them;
  H.log(`<span class="roll">🎲 Shove: 1d20 (${r.die})${H.modsText(mods)} = <b>${tot}</b></span> — ${ok ? '<span class="good">it goes down in the mud.</span>' : '<span class="bad">it doesn\'t budge.</span>'}`, 'rollline');
  if (ok) e.cond.prone = true;
};

H.CB.escape = () => {
  const c = H.S.combat,
    h = H.S.hunter;
  const useDex = H.am(h, 'DEX') >= H.am(h, 'STR');
  const mods = H.skillMods(h, useDex ? 'Acrobatics' : 'Athletics');
  const r = H.d20(false, false);
  const tot = r.die + H.modsSum(mods);
  const dc = 10 + Math.min(8, 2 * c.corr);
  const ok = tot >= dc;
  H.log(`<span class="roll">🎲 Break free: 1d20 (${r.die})${H.modsText(mods)} = <b>${tot}</b></span> · <em>${H.dcInfo(dc).label}</em> — ${ok ? '<span class="good">you tear loose.</span>' : '<span class="bad">their hands hold.</span>'}`, 'rollline');
  if (ok) c.cond.grappled = false;
};

/* ---- js/jobs.js ---- */
/* =====================================================================
   HUNT · 1896 — job generation (§9). Quarter-Day jobs at common
   locations, Valley's chain, Molly's work, and leads from rumors.
   ===================================================================== */
'use strict';

H.T.cargo = ['the strongbox', 'a crate of quinine', 'the deed tin', 'a sack of mail', 'the church plate', 'a crate of rifle cartridges', 'a surveyor\'s case', 'a family Bible with the deeds pressed inside', 'a cashbox from the toll', 'a dead man\'s ring'];
H.T.crimes = ['horse theft', 'robbing a ferry toll', 'shooting a deputy in the leg', 'selling poisoned whiskey', 'jumping bail', 'grave robbing', 'forging company scrip', 'stealing a church bell'];
H.T.outlaw = () => `${H.pick(H.T.firsts)} "${H.pick(['Two-Bit', 'Lucky', 'Slick', 'Preacher', 'Gator', 'Red', 'Dutch', 'Sawbones', 'Mudcat', 'Whistler'])}" ${H.pick(H.T.surnames)}`;
H.T.boardGivers = [
  () => `a notice signed by ${H.pick(H.T.firsts)} ${H.pick(H.T.surnames)}`,
  () => 'Jacques Beaumont, fisherman',
  () => 'Clement and Henri, fishermen',
  () => `the ${H.pick(H.T.surnames)} family`,
  () => 'a merchant on the waterfront',
  () => 'the parish priest',
  () => 'Deputy Silas Boone',
  () => 'Isaac Baptiste, boatman',
  () => 'Sister Miriam Thorne',
];

/* §9.2 threat templates by difficulty */
H.threatFor = (diff, type, loc) => {
  const hasWater = loc.areas.some((a) => a.feat === 'water');
  let opts;
  if (diff <= 0) opts = [[3, [['rotted', H.ri(1, 2)]]], [1, [['bileweaver', 1]]], [type === 'Monster Trophy' ? 0 : 2, []]];
  else if (diff === 1)
    opts = [
      [3, [['rotted', H.ri(3, 5)]]],
      [3, [['normal', H.ri(2, 3)]]],
      [2, [['looter', 1], ['normal', H.ri(1, 2)]]],
      [2, [['stalker', 2]]],
      [2, [['hellhound', 2]]],
      [1, [['hive', 1]]],
      [1, [['bileweaver', 2]]],
    ];
  else if (diff === 2)
    opts = [
      [2, [['hellhound', 3]]],
      [2, [['armored', 1]]],
      [2, [['stalker', H.ri(3, 4)]]],
      [1, [['meathead', 1]]],
      [hasWater ? 2 : 0, [['waterdevil', 1]]],
      [2, [['normal', H.ri(4, 5)]]],
      [1, [['immolator', 1]]],
      [1, [['looter', 2], ['normal', 2]]],
    ];
  else
    opts = [
      [2, [['armored', 1], ['normal', H.ri(2, 3)]]],
      [2, [['stalker', 5]]],
      [2, [['hellhound', 4]]],
      [1, [['immolator', 2]]],
    ];
  return H.wpick(opts);
};

H.makeLocation = (kindKey, opts) => {
  opts = opts || {};
  const L = H.LOCS[kindKey];
  const areas = H.shuffle(L.areas).slice(0, opts.areas || 3);
  // keep a water area if there is one and we need it
  if (opts.needWater && !areas.some((a) => a.feat === 'water')) {
    const w = L.areas.find((a) => a.feat === 'water');
    if (w) areas[areas.length - 1] = w;
  }
  return {
    kind: kindKey,
    art: L.art,
    name: L.name(),
    desc: H.pick(L.desc),
    sign: H.pick(H.T.signs),
    corr: opts.corr != null ? opts.corr : 1,
    hazards: L.hazards,
    areas: areas.map((a) => ({ n: a.n, d: a.d, feat: a.feat })),
  };
};

H.jobName = (type, loc, giver, extra) => {
  const sur = H.pick(H.T.surnames);
  switch (type) {
    case 'Treasure Hunt':
      return H.pick([`Bring back ${extra.cargo} from ${loc.name}`, `${H.cap(extra.cargo)} went missing out at ${loc.name}`, `Somebody needs to fetch ${extra.cargo} out of ${loc.name}`]);
    case 'Bounty Hunt':
      return `${extra.outlaw}, wanted for ${extra.crime} — last seen at ${loc.name}`;
    case 'Survey / Explore':
      return H.pick([`Go and look at what's happening at ${loc.name}, and write it down`, `Map ${loc.name} and come back with notes`, `Find out why nobody comes back from ${loc.name}`]);
    default: {
      const k = extra.targetKey;
      const C = H.CREATURES[k];
      if (k === 'hellhound') return H.pick([`Something's been taking dogs near ${loc.name}`, `Dogs that aren't dogs — out by ${loc.name}`]);
      if (k === 'waterdevil') return `Something's in the ${sur}s' fish traps at ${loc.name}`;
      if (['normal', 'rotted', 'looter', 'stalker'].includes(k)) return H.pick([`Clear the grunts out of ${loc.name}`, `${loc.name} needs clearing, and nobody local will do it`]);
      return `Kill the ${C.name.toLowerCase()} at ${loc.name} and bring back proof`;
    }
  }
};

/* §9.5 Generating a Quarter-Day job */
H.genJob = (o) => {
  o = o || {};
  const type = o.type || H.JOB_TYPES[H.d(4) - 1];
  const dr = H.d(6);
  const diff = o.diff != null ? o.diff : dr <= 2 ? 0 : dr <= 5 ? 1 : 2;
  const kinds = Object.keys(H.LOCS);
  const kind = o.kind || H.pick(kinds);
  const loc = H.makeLocation(kind, { corr: diff === 0 ? 1 : diff === 1 ? H.pick([1, 2]) : 2 });
  let threat = H.threatFor(diff, type, loc);
  if (threat.some((t) => t[0] === 'waterdevil') && !loc.areas.some((a) => a.feat === 'water')) threat = [['normal', 3]];
  const tw = o.twist || H.d(6);
  const band = H.DIFF[diff].reward;
  let reward = H.ri(band[0], band[1]);
  if (H.S.world.di > 0) reward = Math.round(reward * (1 + H.diF())); // a fearful town pays more (§9.3)
  const extra = {};
  if (type === 'Treasure Hunt') extra.cargo = H.pick(H.T.cargo);
  if (type === 'Bounty Hunt') {
    extra.outlaw = H.T.outlaw();
    extra.crime = H.pick(H.T.crimes);
  }
  // Monster Trophy needs something to hunt
  if (type === 'Monster Trophy' && !threat.length) threat = [['rotted', 2]];
  if (threat.length) extra.targetKey = threat[0][0];
  let pay = null;
  if (diff === 1 && H.chance(0.35)) pay = { item: H.pick(['fak', 'firebomb']) };
  if (diff >= 2 && H.chance(0.6)) pay = H.chance(0.5) ? { weapon: H.pick(['winfield', 'caldwell', 'crossbow', 'bow', 'romero']) } : { ammo: true };
  const giver = o.giver || H.pick(H.T.boardGivers)();
  return {
    id: H.uid(),
    name: o.name || H.jobName(type, loc, giver, extra),
    type,
    diff,
    label: H.DIFF[diff].label,
    giver,
    src: o.src || 'board',
    reward: o.reward || reward,
    pay: o.pay !== undefined ? o.pay : pay,
    loc,
    threat,
    twist: tw,
    travel: o.travel || H.ri(2, 4),
    posted: H.S.world.day,
    expires: H.S.world.day + H.ri(3, 6),
    special: o.special || null,
    extra,
    blurb: o.blurb || null,
  };
};

/* The notice board refreshes each morning (§9) */
H.refreshBoard = () => {
  const w = H.S.world;
  w.board = (w.board || []).filter((j) => j.expires >= w.day);
  while (w.board.length < 3) w.board.push(H.genJob());
  // Ashville's board is Molly's and the road's
  w.ashBoard = (w.ashBoard || []).filter((j) => j.expires >= w.day);
  while (w.ashBoard.length < 2) w.ashBoard.push(H.chance(0.5) ? H.genRolling() : H.genJob({ type: 'Treasure Hunt', giver: 'Molly, at the Tap-Tap', src: 'molly', diff: H.pick([0, 1, 1]) }));
  w.boardDay = w.day;
};

/* Molly's Rolling Guard — keep the convoy moving */
H.genRolling = () => {
  const diff = H.pick([1, 1, 2]);
  const band = H.DIFF[diff].reward;
  return {
    id: H.uid(),
    name: H.pick(['Ride with the supply wagons from Wayfarer\'s Rest and keep them rolling', 'Rolling guard on the whiskey wagon — Molly\'s order', 'See the glass shipment to Ashville in one piece']),
    type: 'Rolling Guard',
    diff,
    label: H.DIFF[diff].label,
    giver: 'Molly, at the Tap-Tap',
    src: 'molly',
    reward: Math.round(H.ri(band[0], band[1]) * (1 + Math.max(0, H.diF()))),
    pay: null,
    loc: H.makeLocation('camp', { corr: 1 }),
    threat: H.threatFor(diff, 'Monster Trophy', { areas: [] }),
    twist: 6,
    travel: 0,
    posted: H.S.world.day,
    expires: H.S.world.day + H.ri(3, 5),
    special: 'rolling',
    extra: {},
  };
};

/* ---------------------------------------------------------------------
   Valley's jobs (NPC_VALLEY): one entity at a time, the answer supplied.
   --------------------------------------------------------------------- */
H.valleyJob = () => {
  const h = H.S.hunter,
    v = h.valley;
  if (v.chain === 0) {
    const loc = H.makeLocation('farm', { corr: 1 });
    loc.areas = H.LOCS.farm.areas.map((a) => ({ n: a.n, d: a.d, feat: a.feat })).slice(0, 3);
    return {
      id: H.uid(), name: `A Hellhound pack is moving toward clean ground — stop it at ${loc.name}`, type: 'Monster Trophy', diff: 2, label: 'Rough Waters', giver: 'Valley', src: 'valley',
      reward: 30, pay: { weapon: 'caldwell', advance: true }, loc, threat: [['hellhound', 3]], twist: 6, travel: 3, posted: H.S.world.day, expires: H.S.world.day + 30, special: 'hellhound',
      extra: { targetKey: 'hellhound' },
      blurb: '"Pack of hellhounds — three, maybe four — been drifting toward the farms out east. Clean ground. Not for long if they get there. Get up high and let \'em come to you, yeah? They can\'t climb for shit."',
    };
  }
  if (v.chain === 2 && H.S.world.sinEater && H.S.world.sinEater.status === 'walking') {
    const loc = H.makeLocation('ferry', { corr: 2 });
    loc.name = 'the flooded road east of Ashville';
    loc.desc = 'The road east of Ashville has gone under — a mile of brown floodwater with the fence posts showing like teeth. On the horizon, against the grey, something tall is walking. It has been walking for days.';
    return {
      id: H.uid(), name: 'Stop the Sin Eater before it reaches Ashville', type: 'Monster Trophy', diff: 2, label: 'Rough Waters', giver: 'Valley', src: 'valley',
      reward: 90, pay: { kit: ['holy', 'dynamite'], advance: true }, loc, threat: [['sineater', 1]], twist: 6, travel: 6, posted: H.S.world.day, expires: H.S.world.day + 30, special: 'sineater',
      extra: { targetKey: 'sineater' },
      blurb: '"Sin Eater. Walking for Ashville. Don\'t you dare try to shoot it to death — you\'d need a hundred and twenty rounds and you\'ve not got the time. Here. Holy water and a stick of the good stuff. Water makes it soft for a few breaths. Dynamite ends it. Fire buys you an exit. Don\'t stand still in the water with it, mate. Ever."',
    };
  }
  if (v.chain === 3 && v.trust >= 4) {
    const loc = { kind: 'mill', art: 'mill', name: "Salter's Pork", desc: "Salter's Pork: a pork-packing works and slaughterhouse on a slow channel of the Stillwater. Hooks still on the rails, salt in barrels, hog carcasses that were hung before the outbreak and never taken down. Drying racks built by a taxidermist who never came back.", sign: 'The smell reaches you a quarter mile off: smoke, salt and meat that has been rotting for a year.', corr: 3, hazards: ['rotten', 'trap'], areas: [{ n: 'the stock pens', d: 'Mud and bones and broken gates. Leeches the size of a forearm writhe in the troughs.', feat: 'high' }, { n: 'the salting house', d: 'Barrels of grey salt. Rows of hooks. Something swings on one of them.', feat: 'door' }, { n: 'the killing floor', d: 'A long hall with a gutter down the middle. The gutter is not dry. At the far end, something large is breathing.', feat: 'door' }] };
    return {
      id: H.uid(), name: 'Banish the Butcher at Salter\'s Pork', type: 'Monster Trophy', diff: 3, label: 'Hell', giver: 'Valley', src: 'valley',
      reward: 180, pay: null, loc, threat: [['butcher', 1]], filler: [['rotted', 3]], twist: 6, travel: 6, posted: H.S.world.day, expires: H.S.world.day + 60, special: 'butcher',
      extra: { targetKey: 'butcher' },
      blurb: '"The Butcher\'s back at Salter\'s Pork. Big bastard, pig\'s head sewn on, hook that burns. Fire runs off that apron — don\'t waste it. Clubs bounce. Blades, mate. It bleeds to blades. Keep ten meters and a door between you when you reload. It\'s a piece of the thing that\'s eating Louisiana and it\'ll be back in a few weeks no matter what you do. Kill it anyway."',
    };
  }
  // ordinary clearance and field work
  const pool = [
    ['armored', { kind: 'mill', note: 'firebomb', blurb: '"Armored holding a doorway out at {loc}. Plates turn a bullet. Don\'t bother. Here — one firebomb. The soft stuff under the plates burns like paper. Or get a knife in close and stab, don\'t slash."' }],
    ['immolator', { kind: 'shack', note: null, blurb: '"Burning bloke out at {loc}. Here\'s the trick, and listen proper: it goes for movement. Stand still and it won\'t touch you. Shoot it and it goes off like a lamp. Blade, or water, or leave it be."' }],
    ['hive', { kind: 'church', note: null, blurb: '"Hive at {loc}. Woman with a wasp nest for a chest. She shrieks and everything for a hundred meters comes running, so be quick. Kill her and the swarm drops dead."' }],
    ['stalker', { kind: 'camp', note: null, blurb: '"Stalker pack around {loc}. They don\'t shamble, they hunt. Look for the pale one covered in muck — that\'s the leader. Drop him and the rest go stupid."' }],
    ['meathead', { kind: 'farm', note: null, blurb: '"Meathead at {loc}. No head, sees through its bloody leeches. Don\'t let \'em touch you, and don\'t fire a gun near it if you don\'t want it knowing where you are. Cut it. Don\'t punch it."' }],
    ['waterdevil', { kind: 'fishery', note: 'dynamite', blurb: '"Water Devil in the shallows at {loc}. Don\'t go near the water\'s edge — three meters and it\'ll have you. Bullets do half of bugger-all. Here\'s a stick of dynamite. Don\'t throw it at your feet."' }],
  ];
  const [key, cfg] = H.pick(pool);
  const loc = H.makeLocation(cfg.kind, { corr: 2, needWater: key === 'waterdevil' });
  const n = key === 'stalker' ? H.ri(3, 4) : 1;
  const band = H.DIFF[2].reward;
  return {
    id: H.uid(), name: `Entity clearance: the ${H.CREATURES[key].name.toLowerCase()} at ${loc.name}`, type: 'Monster Trophy', diff: 2, label: 'Rough Waters', giver: 'Valley', src: 'valley',
    reward: Math.round(H.ri(band[0], band[1]) * (1 + Math.max(0, H.diF()))), pay: cfg.note ? { kit: [cfg.note], advance: true } : null, loc, threat: [[key, n]], twist: H.chance(0.3) ? 3 : 6, travel: H.ri(3, 4), posted: H.S.world.day, expires: H.S.world.day + 6, special: 'valley',
    extra: { targetKey: key },
    blurb: cfg.blurb.replace('{loc}', loc.name),
  };
};

/* Small jobs from Minor NPCs — only through leads from Exploring Rumors (§8.2, §3.15) */
H.MINOR_WORK = [
  { who: 'Amos Bell, fisherman (chewing an unlit corncob pipe)', type: 'Treasure Hunt', kind: 'boathouse', cargo: 'the tackle box Amos left in his boat when he saw something move in the water', say: 'Left my good box in the skiff when I saw — well. I saw what I saw. I ain\'t going back.' },
  { who: 'Deputy Clara Voss (writing it all down)', type: 'Survey / Explore', kind: 'shack', say: 'Neighbors heard screaming two nights running. I don\'t have the men. Go look. Write down what you see. Exactly what you see.' },
  { who: 'Eli Mercer, farmhand (talking much too fast)', type: 'Monster Trophy', kind: 'farm', say: 'Something\'s-been-at-the-goats, three gone, and the tracks are wrong, they\'re wrong, they don\'t look like any animal I know—' },
  { who: 'Ruth Delaney, laundress', type: 'Treasure Hunt', kind: 'shack', cargo: 'a parcel of clean shirts and the money owed for them', say: 'Customer out at the creek hasn\'t collected in two weeks, and I don\'t work for free.' },
  { who: 'Florence May, grocer (already totting up your bill)', type: 'Treasure Hunt', kind: 'farm', cargo: 'the farmer\'s overdue delivery — eggs, if they\'re still eggs', say: 'The Sonnier boy hasn\'t brought my eggs in four days. He\'s never late. Go see why.' },
  { who: 'Jeremiah Pike, trapper (who never whistles outdoors)', type: 'Monster Trophy', kind: 'camp', say: 'Something big went through my trap line. Big. I\'ll pay you to find out what, and to make sure it doesn\'t come back.' },
  { who: 'Ezra Reed, wagon driver', type: 'Treasure Hunt', kind: 'ferry', cargo: 'Ezra\'s abandoned wagon and its load', say: 'Had to leave the wagon at the crossing when the horses spooked. Horses were right. Load\'s still out there.' },
  { who: 'Tommy Fitch, gravedigger (humming a hymn he doesn\'t know the words to)', type: 'Survey / Explore', kind: 'cemetery', say: 'Graves on the east row keep opening. I know somebody opened \'em. I don\'t know who. Or what.' },
];
H.leadJob = () => {
  const m = H.pick(H.MINOR_WORK);
  const diff = H.pick([0, 0, 1]);
  const j = H.genJob({ type: m.type, kind: m.kind, diff, giver: m.who, src: 'lead' });
  if (m.cargo) {
    j.extra.cargo = m.cargo;
    j.name = `${m.who.split(',')[0].split(' (')[0]}: recover ${m.cargo}`;
  } else j.name = `${m.who.split(',')[0].split(' (')[0]}: ${m.type === 'Survey / Explore' ? 'look into' : 'deal with'} what's wrong at ${j.loc.name}`;
  j.blurb = `“${m.say}”`;
  j.expires = H.S.world.day + 5;
  return j;
};

/* ---- js/mission.js ---- */
/* =====================================================================
   HUNT · 1896 — missions: the road out, the site, its areas, hazards,
   encounters before the shooting starts, loot, objectives, the road home.
   ===================================================================== */
'use strict';

/* ---------------------------------------------------------------------
   Loot (§7.9) — Find die when a Looter is first spotted (the DM's roll),
   Condition die when the body is looted (the player's roll).
   --------------------------------------------------------------------- */
H.ammoClass = (roll, size) => {
  const sz = size || H.pick(['Small', 'Large']);
  if (roll <= 2) return 'Compact-' + sz;
  if (roll === 3) return 'Buckshot';
  if (roll <= 5) return 'Medium-' + sz;
  return 'Long-' + sz;
};
H.gearRoll = (depth) => {
  const r = H.d(8);
  switch (r) {
    case 1: return [{ t: 'weapon', key: 'knife' }];
    case 2: return [{ t: 'weapon', key: 'dusters' }];
    case 3: return [{ t: 'item', key: 'fak' }];
    case 4: return [{ t: 'item', key: 'firebomb' }];
    case 5: return [{ t: 'hb', n: H.d(6) }];
    case 6: return [{ t: 'item', key: 'key' }];
    case 7: {
      if (H.chance(0.5)) return [{ t: 'item', key: 'tools' }];
      const k = H.S.hunter.molly.kitchen;
      const parts = ['grinder', 'damper', 'waffle'].filter((p) => !k[p]);
      return [{ t: 'item', key: H.chance(0.5) || !parts.length ? 'mug' : H.pick(parts) }];
    }
    default: return depth ? [{ t: 'item', key: 'tools' }] : H.gearRoll(1).concat(H.gearRoll(1));
  }
};
H.WEAPON_TABLE = (r) => (r <= 4 ? 'winfield' : r <= 7 ? 'caldwell' : r <= 10 ? 'romero' : r <= 12 ? 'crossbow' : r <= 14 ? 'bow' : r <= 16 ? 'pax' : r <= 18 ? 'sword' : r === 19 ? 'vetterli' : 'uppercut');
H.lootFind = () => {
  const f = H.d(20);
  let items = [],
    look = 'nothing but rags and rot';
  if (f <= 3) items = [];
  else if (f <= 7) {
    const cls = H.ammoClass(H.d(6));
    items = [{ t: 'ammo', type: cls, n: H.d(4) }];
    look = 'a few loose cartridges glinting in its fist';
  } else if (f <= 11) {
    const r = H.d(6);
    const cls = H.ammoClass(r);
    const n = r <= 2 ? 20 : r === 3 ? H.d(4) + 2 : r <= 5 ? 5 : H.d(2);
    items = [{ t: 'ammo', type: cls, n }];
    look = r <= 2 ? 'a cartridge box clutched to its chest' : r === 3 ? 'a bandolier of shotgun shells' : 'a bulging ammunition pouch';
  } else if (f <= 14) {
    items = H.gearRoll(0);
    look = 'a rotting backpack, stuffed full';
  } else if (f <= 19) {
    const key = H.WEAPON_TABLE(H.d(20));
    const W = H.WEAPONS[key];
    items = [{ t: 'weapon', key, rounds: W.cap ? Math.min(W.cap, H.d(4)) : 0 }];
    look = W.kind === 'melee' ? `a ${W.name.toLowerCase()} hanging from its belt` : W.cls === 'Pistol' ? 'a revolver in a holster that isn\'t its own' : `a ${W.kind === 'bow' ? 'bow' : W.kind === 'xbow' ? 'crossbow' : W.key === 'romero' ? 'shotgun' : 'rifle'} slung across its back`;
  } else {
    items = [{ t: 'weapon', key: 'sparks', rounds: 0 }, { t: 'ammo', type: 'Long-Large', n: H.d(2) }];
    look = 'a long, heavy rifle across its back — a big-game gun';
  }
  return { find: f, items, look };
};
H.condBand = (r) => (r <= 5 ? { n: 'Ruined', q: 0.75 } : r <= 13 ? { n: 'Weathered', q: 0.5 } : r <= 19 ? { n: 'Sound', q: 0.25 } : { n: 'Fresh', q: 0 });
H.condWhp = (band, max) => (band === 'Ruined' ? 1 : band === 'Weathered' ? Math.max(1, Math.floor(max / 2)) : band === 'Sound' ? max - 1 : max);

/* ---------------------------------------------------------------------
   Taking a job
   --------------------------------------------------------------------- */
H.startJob = () => {
  const job = H.S.job;
  if (!job) return;
  if (job.special === 'rolling') return H.go('convoy', { step: 0 });
  H.buildMission(job);
  H.go('travel_out');
};
H.acceptJob = (job, home, goNow) => {
  const S = H.S,
    h = S.hunter;
  S.world.board = S.world.board.filter((j) => j.id !== job.id);
  S.world.ashBoard = S.world.ashBoard.filter((j) => j.id !== job.id);
  h.leads = h.leads.filter((j) => j.id !== job.id);
  job.home = home || S.where || 'wayfarer';
  job.status = 'active';
  S.job = job;
  H.log(`<span class="sys-h">Job taken:</span> <b>${H.esc(job.name)}</b> — ${job.type}, <em>${job.label}</em>, ${job.reward} HB from ${H.esc(job.giver)}. ${H.ref('9.1')}`, 'sys');
  // pay in advance — only Valley or the 10-Gallon Gang trust a hunter that far (§9.3)
  if (job.pay && job.pay.advance) {
    if (job.pay.weapon) {
      const w = H.addWeapon(job.pay.weapon);
      if (w) H.log(`Valley shoves a ${H.WEAPONS[job.pay.weapon].name} across the desk. "Advance. Don't make me regret it." (Unloaded.)`, 'sys');
      else {
        H.log(`Valley holds out a ${H.WEAPONS[job.pay.weapon].name}, sees you can't carry it, and puts it back in the drawer. "When you get back, then."`, 'sys');
        job.pay.advance = false;
      }
    }
    if (job.pay.kit) {
      for (const k of job.pay.kit) H.addItem(k);
      H.log(`He hands over ${H.prose(job.pay.kit.map((k) => H.ITEMS[k].name.toLowerCase()))}. "That's the answer. Don't lose it."`, 'sys');
    }
  }
  if (goNow === false) {
    H.log('<span class="dim">You\'ll head out when you\'re ready — the job waits for you in town.</span>', 'sys');
    return H.backToHub();
  }
  H.startJob();
};

H.buildMission = (job) => {
  const loc = job.loc;
  const areas = loc.areas.map((a, i) => ({ n: a.n, d: a.d, feat: a.feat, enc: null, hazard: null, cache: null, searched: false, visited: false, encDone: false, hazDone: false, documented: false, obj: i === loc.areas.length - 1 }));
  const last = areas.length - 1;
  const groups = (list, state, target) => list.map(([key, n]) => ({ key, n, state: state || 'passive', target: !!target }));
  let main = job.threat.slice();
  // twist 3: the target isn't what was described (§9.5)
  if (job.twist === 3 && job.diff < 3) {
    const alt = H.threatFor(Math.min(3, job.diff + 1), job.type, loc);
    if (alt.length && !alt.some((t) => t[0] === 'waterdevil' && !areas.some((a) => a.feat === 'water'))) {
      job.realThreat = alt;
      main = alt;
    }
  }
  const tgt = job.type === 'Monster Trophy';
  if (main.length) {
    let ai = last;
    if (main[0][0] === 'waterdevil') ai = Math.max(0, areas.findIndex((a) => a.feat === 'water'));
    else if (job.type === 'Bounty Hunt') ai = Math.max(0, last - 1);
    const st = ['stalker', 'hellhound', 'hive', 'sineater', 'butcher'].includes(main[0][0]) ? 'hunting' : 'passive';
    areas[ai].enc = groups(main, st, tgt);
    if (tgt) {
      areas.forEach((x) => (x.obj = false));
      areas[ai].obj = true;
    }
  }
  // filler grunts on the way in
  const filler = job.filler || (job.diff >= 1 && H.chance(0.45) ? [[loc.corr >= 2 ? 'normal' : 'rotted', H.ri(1, 2)]] : null);
  if (filler) {
    const free = areas.map((a, i) => i).filter((i) => !areas[i].enc);
    if (free.length) areas[H.pick(free)].enc = groups(filler, 'passive');
  }
  // hazards: one per label above Cake Walk (§9.4)
  const nh = job.diff >= 3 ? 2 : job.diff >= 1 ? 1 : 0;
  for (let k = 0; k < nh; k++) {
    const i = H.ri(0, last);
    if (areas[i].hazard) continue;
    let hz = H.pick(loc.hazards);
    if (areas[i].feat === 'water' && loc.hazards.includes('water')) hz = 'water';
    areas[i].hazard = hz;
  }
  // something worth taking (§8.5)
  for (const a of areas) if (H.chance(0.5)) a.cache = H.wpick(H.CACHES);
  H.S.mission = {
    jobId: job.id,
    name: loc.name,
    kind: loc.kind,
    art: loc.art,
    corr: loc.corr,
    areas,
    cur: null,
    noise: 0,
    fireTaken: 0,
    fireBurned: 0,
    objDone: false,
    notes: 0,
    notesNeed: Math.min(3, areas.length),
    goods: false,
    trophy: null,
    bounty: job.type === 'Bounty Hunt' ? { state: 'free' } : null,
    reserve: job.diff + (loc.corr >= 3 ? 1 : 0),
    reserveKey: loc.corr >= 2 ? 'normal' : 'rotted',
    rival: job.twist === 2 ? { state: 'there' } : null,
    arrived: false,
    road: null,
  };
};

H.corrPhrase = (c) =>
  ['', 'The air here has a faint taste of tar.', 'The air here tastes of tar, and the light seems wrong at the edges.', 'The air is thick and sweet with rot. Every shadow is too deep. This place belongs to something.', 'The ground itself seems to breathe.'][Math.min(4, c)];

/* ---------------------------------------------------------------------
   The road out
   --------------------------------------------------------------------- */
H.scenes.travel_out = {
  art: () => ({ kind: 'road', seed: 'road-' + (H.S.mission ? H.S.mission.name : '') }),
  mood: 'uneasy',
  enter: () => {
    const S = H.S,
      job = S.job;
    H.ui.divider();
    H.log(`You set out for ${H.esc(job.loc.name)}. ${H.weather().line}`);
    H.advance(job.travel);
    S.where = 'field';
    H.log(`${H.cap(H.num(job.travel))} hours ${H.w('travelBy')}, through ${H.w('travelThrough')}. It's ${H.tod().name} when you get close.`);
    // road events
    const r = H.d(10);
    if (r <= 2) {
      H.S.mission.road = { n: 'the road', d: '', feat: null, enc: [{ key: 'looter', n: 1, state: 'passive' }], encDone: false, road: true };
      H.log('Off the side of the road, something is going through a dead man\'s pockets.');
      H.go('encounter', { road: true, back: 'site' });
      return;
    }
    if (r === 3 && H.isNight()) {
      H.S.mission.road = { n: 'the road', d: '', feat: null, enc: [{ key: 'stalker', n: H.ri(2, 3), state: 'hunting' }], encDone: false, road: true };
      H.go('encounter', { road: true, back: 'site' });
      return;
    }
    if (r === 4) H.log('You pass a dead hunter in the ditch, stripped to the shirt. Whatever went through his pockets took everything — even his boots.');
    else if (r === 5) H.log(`A fisherman poling the other way lifts a hand. “${H.pick(H.T.rumors)}” he says, apropos of nothing, and is gone into the fog.`);
    else if (r === 6) H.log('A dog is barking somewhere ahead. Then it isn\'t. You walk the last mile with your hand on your weapon.');
  },
  opts: () => [
    { t: `Press on to ${H.esc(H.S.job.loc.name)}.`, act: () => H.go('site') },
    { t: 'Turn back. This job isn\'t worth dying for.', act: () => H.go('travel_back', { abandon: true }) },
  ],
};

/* ---------------------------------------------------------------------
   The site
   --------------------------------------------------------------------- */
H.scenes.site = {
  art: () => ({ kind: H.S.mission.art, seed: H.S.mission.name, caption: H.cap(H.S.mission.name), fog: H.S.job && H.S.job.twist === 5 ? 1 : 0 }),
  mood: 'uneasy',
  enter: (p) => {
    const m = H.S.mission,
      job = H.S.job;
    H.S.where = 'field';
    if (p && p.fled) {
      H.log('You circle back toward the site the long way round, keeping low.', 'sys');
      if (H.S.lastFight && H.S.lastFight.survivors && m.fledFrom != null) {
        const a = m.fledFrom === 'road' ? m.road : m.areas[m.fledFrom];
        if (a) {
          a.enc = H.S.lastFight.survivors.length ? H.S.lastFight.survivors : null;
          if (!a.enc) a.encDone = true;
          a.lastDesc = null;
        }
      }
      return;
    }
    if (m.arrived) return;
    m.arrived = true;
    H.ui.divider();
    if (job.twist === 5) {
      H.S.world.weather = H.pick(['storm', 'rain', 'fog']);
      H.log(`The weather turns on you as you arrive. ${H.weather().line}`);
    }
    H.log(`<b>${H.esc(H.cap(job.loc.name))}.</b> ${job.loc.desc} ${job.loc.sign} ${H.corrPhrase(m.corr)} ${H.ref('2.6')}`);
    if (m.rival) H.log(`Someone got here first: a hunter in a long oilskin is already picking over the place, a ${H.pick(['Winfield', 'Romero', 'Vetterli'])} on his shoulder. He sees you. He doesn't lower it.`);
    if (job.type === 'Survey / Explore') H.log(`<span class="dim">You need to document what's here — at least ${m.notesNeed} areas.</span>`, 'sys');
  },
  opts: () => {
    const m = H.S.mission,
      job = H.S.job,
      h = H.S.hunter;
    const o = [];
    if (m.rival && m.rival.state === 'there') {
      o.push({ t: '"This is my contract." Tell him to clear off.', act: () => H.check({ title: 'Lean on the rival', skill: 'Intimidation', dc: 15, onDone: (r) => { if (r.success) { m.rival.state = 'gone'; H.say('The rival', 'Hell. It\'s yours. Hope it kills you.'); H.log('He walks off into the reeds.'); } else { m.rival.state = 'split'; H.say('The rival', 'Big talk for a White Shirt. Tell you what — we split it. You do the work.'); H.log('<span class="dim">The pay will be split with him.</span>', 'sys'); } H.refresh(); } }) });
      o.push({ t: '"Plenty of bayou for two." Offer to split the pay.', act: () => { m.rival.state = 'split'; H.say('The rival', 'Suits me. I\'ll watch your back from a long way back.'); H.log('<span class="dim">The pay will be split with him.</span>', 'sys'); H.refresh(); } });
      o.push({ t: 'Let him have it. Walk away.', act: () => H.go('travel_back', { abandon: true }) });
      return o;
    }
    m.areas.forEach((a, i) => {
      const tags = [];
      if (a.visited) tags.push(a.encDone || !a.enc ? 'searched over' : 'occupied');
      if (a.scouted && a.enc && !a.encDone) tags.push(`movement — ${a.enc.reduce((s, g) => s + g.n, 0)} shape${a.enc.reduce((s, g) => s + g.n, 0) > 1 ? 's' : ''}`);
      if (a.obj && !m.objDone) tags.push(job.type === 'Treasure Hunt' ? 'where the goods should be' : job.type === 'Bounty Hunt' ? 'where he was last seen' : 'the heart of it');
      o.push({ t: `Go to ${a.n}.`, note: tags.length ? `(${tags.join(', ')})` : '', act: () => H.go('area', { i }) });
    });
    if (!m.scouted)
      o.push({ t: 'Find cover and watch the place before going in.', note: '(1 hour)', act: () => {
        H.advance(1);
        H.check({ title: 'Scout the site', skill: 'Perception', dc: 10 + 2 * m.corr, onDone: (r) => {
          m.scouted = true;
          if (r.success) {
            m.areas.forEach((a) => (a.scouted = true));
            const occ = m.areas.filter((a) => a.enc && !a.encDone);
            H.log(occ.length ? `You watch until your legs go numb. Movement at ${H.prose(occ.map((a) => a.n))}.` : 'You watch a long time. Nothing moves. That might be good.');
          } else H.log('You watch until the light changes and learn nothing you trust.');
        } });
      } });
    o.push(H.wildOpt());
    if (m.objDone) o.push({ t: 'You have what you came for. Head home.', cls: 'good', act: () => H.go('travel_back') });
    else o.push({ t: 'Abandon the job and head home.', act: () => H.go('travel_back', { abandon: true }) });
    return o;
  },
};

/* ---------------------------------------------------------------------
   An area of the site
   --------------------------------------------------------------------- */
H.scenes.area = {
  art: (p) => ({ kind: H.S.mission.art, seed: H.S.mission.name + p.i, caption: H.cap(H.S.mission.areas[p.i].n) }),
  mood: (p) => {
    const a = H.S.mission && H.S.mission.areas[p.i];
    return a && a.enc && !a.encDone ? 'tense' : 'uneasy';
  },
  enter: (p) => {
    const m = H.S.mission,
      a = m.areas[p.i],
      h = H.S.hunter;
    m.cur = p.i;
    if (!a.visited) {
      a.visited = true;
      H.ui.divider();
      H.log(`<b>${H.cap(a.n)}.</b> ${a.d}${H.chance(0.5) ? ' ' + H.fill(H.w('ambient')) : ''}`);
      H.advance(0);
    }
    // hazard
    if (a.hazard && !a.hazDone) {
      const Z = H.HAZARDS[a.hazard];
      const dc = Z.dc + (H.S.job.diff >= 2 ? 5 : 0) + Math.min(8, 2 * m.corr);
      a.hazDone = true;
      if (H.pp(h) >= dc - 3 || (h.skills.includes('Perception') && H.pp(h) + 2 >= dc - 3)) {
        H.log(`${Z.notice} You see it in time and pick your way around. ${H.ref('1.6')}`);
      } else {
        H.check({
          title: `${Z.save} save — ${Z.name}`,
          ability: Z.save,
          dc,
          note: 'You didn\'t see it coming.',
          onDone: (r) => {
            if (r.success) H.log(`${Z.notice} — you catch yourself just in time.`);
            else {
              const dmg = H.roll(Z.dmg).total;
              H.log(`${Z.fail} <b>${dmg}</b> damage.`, 'hurt');
              if (H.hurt(dmg)) return H.hunterDies(`killed by a ${Z.name} at ${H.S.mission.name}`);
              if (a.hazard === 'trap' || a.hazard === 'rotten') H.S.mission.noise++;
            }
            H.go('area', { i: p.i });
          },
        });
        return;
      }
    }
    if (a.enc && a.enc.length && !a.encDone && !a.avoided) {
      H.go('encounter', { i: p.i, back: 'site' });
      return;
    }
  },
  opts: (p) => {
    const m = H.S.mission,
      a = m.areas[p.i],
      job = H.S.job;
    const o = [];
    const quiet = a.avoided && a.enc && !a.encDone;
    if (quiet) o.push({ t: 'Deal with what\'s here after all.', cls: 'danger', act: () => { a.avoided = false; H.go('encounter', { i: p.i, back: 'site' }); } });
    // objectives
    if (a.obj && !m.objDone) {
      if (job.type === 'Treasure Hunt')
        o.push({ t: `Search for ${H.esc(job.extra.cargo)}.`, note: '(1 hour)', act: () => {
          H.advance(1);
          H.check({ title: 'Search for the goods', skill: 'Investigation', dc: job.diff >= 2 ? 15 : 10, onDone: (r) => {
            if (r.success) {
              m.objDone = true;
              m.goods = true;
              H.addItem('cargo', 1, { name: H.cap(job.extra.cargo) });
              H.log(`There — under ${H.w('hidingPlace')}: ${H.esc(job.extra.cargo)}. You have it.`);
              H.sfx('coin');
            } else {
              H.log('An hour of turning over rot and finding nothing.');
              if (quiet && H.chance(0.4)) {
                H.log('<span class="bad">And you\'ve made too much noise.</span> Something turns toward you.');
                a.avoided = false;
                H.go('encounter', { i: p.i, back: 'site', alerted: true });
              }
            }
          } });
        } });
      if (job.type === 'Bounty Hunt' && m.bounty.state === 'free') o.push({ t: 'Look for the man you came for.', act: () => H.go('bounty', { i: p.i }) });
      if (job.type === 'Monster Trophy' && (!a.enc || a.encDone)) {
        m.objDone = true;
      }
    }
    if (job.type === 'Survey / Explore' && !a.documented && !(a.enc && !a.encDone && !a.avoided))
      o.push({ t: 'Document what you see here — sketches, measurements, notes.', note: '(1 hour)', act: () => {
        H.advance(1);
        H.check({ title: 'Survey the area', skill: H.pick(['Investigation', 'Perception']), dc: job.diff >= 2 ? 15 : 10, onDone: (r) => {
          if (r.success) {
            a.documented = true;
            m.notes++;
            H.log(`You fill pages: ${H.pick(['the claw marks and their spacing', 'where the black water stands and where it doesn\'t', 'which doors were broken out and which in', 'the ward-marks, and which were scratched out', 'the tracks, and the places the tracks stop'])}. (${m.notes}/${m.notesNeed})`);
            if (m.notes >= m.notesNeed) {
              m.objDone = true;
              H.addItem('notes');
              H.log('<span class="good">You have enough. Time to go.</span>');
            }
          } else H.log('Your notes are a mess of smudges and second guesses.');
        } });
      } });
    if (!a.searched)
      o.push({ t: 'Search the place for anything worth taking.', act: () => {
        H.check({ title: 'Search', skill: 'Investigation', dc: 10, onDone: (r) => {
          a.searched = true;
          if (!a.cache || !r.success) {
            H.log(r.success ? 'Nothing here but mildew and mouse droppings.' : 'You turn the place over and find nothing — or miss it.');
            return;
          }
          H.takeCache(a.cache);
        } });
      } });
    o.push(H.wildOpt());
    m.areas.forEach((b, i) => {
      if (i !== p.i) o.push({ t: `Move on to ${b.n}.`, note: b.visited ? '' : '(unexplored)', act: () => H.go('area', { i }) });
    });
    if (m.objDone) o.push({ t: 'You have what you came for. Head home.', cls: 'good', act: () => H.go('travel_back') });
    o.push({ t: 'Back off to the edge of the site.', act: () => H.go('site') });
    return o;
  },
};

H.takeCache = (c) => {
  const h = H.S.hunter;
  switch (c.t) {
    case 'hb': {
      const n = H.roll(c.amt).total;
      H.gain(n);
      H.log(`You find ${c.d}: <b>${n} HB</b>.`);
      break;
    }
    case 'ammo': {
      // ammunition outside the Looter table is handed out stingily (§10 #1)
      const types = h.weapons.map((w) => H.WEAPONS[w.key].ammo).filter(Boolean);
      const type = types.length && H.chance(0.6) ? H.pick(types) : H.ammoClass(H.ri(1, 5));
      const n = H.d(4);
      const got = H.addAmmo(type, 0, n);
      H.log(`You find ${c.d}: ${n} ${type}${got < n ? ` (room for ${got} on your belt)` : ''}. <span class="dim">Who knows how long they've been wet — questionable.</span>`);
      break;
    }
    case 'item':
      H.addItem(c.k, 1);
      H.log(`You find ${c.d}.`);
      break;
    case 'kitchen': {
      const k = h.molly.kitchen;
      const parts = ['grinder', 'damper', 'waffle'].filter((p) => !k[p]);
      const part = parts.length ? H.pick(parts) : 'mug';
      H.addItem(part, 1);
      H.log(`You find ${c.d}: ${H.ITEMS[part].name.toLowerCase()}. Molly at the Tap-Tap would want this.`);
      break;
    }
    case 'flavor':
      H.log(`You find ${c.d.replace('{f}', H.pick(H.T.firsts))}. You read one. You wish you hadn't.`);
      break;
    default:
      H.log(`You find ${c.d}.`);
  }
};

/* ---------------------------------------------------------------------
   Encounters — the moment before the shooting starts
   --------------------------------------------------------------------- */
H.areaOf = (p) => (p.road ? H.S.mission.road : H.S.mission.areas[p.i]);
H.encCount = (enc) => enc.reduce((s, g) => s + g.n, 0);

H.scenes.encounter = {
  art: (p) => {
    const a = H.areaOf(p);
    const figs = [];
    if (a && a.enc) for (const g of a.enc) for (let i = 0; i < g.n; i++) figs.push(g.key === 'hellhound' ? 'hound' : ['armored', 'meathead', 'sineater', 'butcher'].includes(g.key) ? 'big' : 'man');
    return { kind: p.road ? 'road' : H.S.mission.art, seed: H.S.mission.name + (p.road ? 'road' : p.i), figures: figs, caption: a ? H.cap(a.n) : '' };
  },
  mood: 'tense',
  enter: (p) => {
    const m = H.S.mission,
      a = H.areaOf(p),
      h = H.S.hunter;
    const enc = a && a.enc;
    if (!enc || !enc.length) {
      if (a) a.encDone = true;
      return H.go(p.road ? p.back || 'site' : 'area', p.road ? {} : { i: p.i });
    }
    if (!a.encSeen) {
      a.encSeen = true;
      // the Find die is rolled when a Looter is first spotted (§7.9)
      for (const g of enc)
        if (g.key === 'looter' && !g.loot) {
          g.loot = [];
          for (let i = 0; i < g.n; i++) g.loot.push(H.lootFind());
        }
      if (p.alerted) for (const g of enc) g.state = 'alerted';
    }
    const k0 = enc[0].key;
    const n = H.encCount(enc);
    // Stalkers hunt in packs: a group Stealth check against your Passive Perception (§6.1)
    if (enc.some((g) => g.key === 'stalker') && enc[0].state === 'hunting' && !a.stalkCheck) {
      a.stalkCheck = true;
      const pack = enc.find((g) => g.key === 'stalker');
      let succ = 0;
      for (let i = 0; i < pack.n; i++) if (Math.max(H.d(20), H.d(20)) - 2 >= H.pp(h)) succ++;
      if (succ >= pack.n / 2) {
        H.log('<span class="bad">A howl — close, too close.</span> Shapes come out of the reeds on three sides at once. They were watching you the whole time.');
        H.sfx('howl');
        return H.CB.fromArea(p, { ambush: true, dist: [8, 14] });
      }
      a.stalkSpotted = true;
    }
    if (a.lastDesc === n) return;
    a.lastDesc = n;
    H.ui.divider();
    const C = H.CREATURES[k0];
    let txt = '';
    if (k0 === 'stalker') txt = `You catch it a heartbeat before it catches you: ${H.num(n)} lean grunt${n > 1 ? 's' : ''} moving low and spread out through the reeds — and one of them pale, gore-covered, standing apart. A Stalker pack, hunting. They haven't seen you. Yet.`;
    else if (k0 === 'hellhound') txt = `Dogs. You hear the collars first — rusted chain clinking — then see them: ${H.num(n)} corrupted mastiffs nosing through the ${a.n}, heads coming up one by one. The wind is turning. They will have your scent in a moment.`;
    else if (k0 === 'hive') txt = `There — a woman standing perfectly still, her chest a grey paper nest that hums. Wasps crawl in and out of her mouth. She hasn't noticed you.`;
    else if (k0 === 'immolator') txt = `A man stands in the ${a.n}, burning from the inside, embers dripping from his fingers. His head twitches toward every sound. He has not seen you — he sees movement.`;
    else if (k0 === 'meathead') txt = `A headless giant lumbers through the ${a.n}, bloated and pale, leeches writhing at the stump of its neck. It can't see you. The leeches can feel you.`;
    else if (k0 === 'waterdevil') txt = `The water in the ${a.n} is wrong. It moves against the current, a long white shape just under the surface, like a single muscle made of worms. It's waiting for something to come close to the edge.`;
    else if (k0 === 'armored') txt = `In the doorway of the ${a.n} stands a man-shape crusted over in grey chitin plates, fungus weeping from the seams. It doesn't move. It's guarding something.${enc.length > 1 ? ' Grunts shuffle around it.' : ''}`;
    else if (k0 === 'sineater') txt = 'Through the floodwater it comes: ten feet of swamp mud and blackened roots, red veins throbbing across its chest, black sludge sizzling where it drips. It walks slowly, steadily, toward Ashville. It has not noticed you. It will, if you hurt it.';
    else if (k0 === 'butcher') txt = 'At the end of the killing floor, beneath the hooks: the Butcher. A bloated body in a leather apron, a pig\'s head stitched onto its shoulders, a hook in its fist glowing like a coal. It is breathing. It knows you\'re here.';
    else if (k0 === 'bileweaver') txt = `Something dog-sized and many-legged clings to the wall of the ${a.n}, green mist curling from its mouth.`;
    else {
      const parts = [];
      for (const g of enc) {
        const Cg = H.CREATURES[g.key];
        if (g.key === 'looter') {
          g.loot.forEach((l, i) => parts.push(`${i ? 'Another' : 'A'} looter grunt is ${H.pick(H.T.looterRoutines)} — it carries ${l.look}.`));
        } else if (g.n > 1) {
          parts.push(`${H.cap(H.num(g.n))} ${Cg.plural.toLowerCase()}${g.state === 'passive' ? `: one ${H.pick(H.T.routines)}, another ${H.pick(H.T.routines)}` : ', ' + H.w('restlessMany')}.`);
        } else {
          parts.push(`${H.cap(H.pick(Cg.looks))}${g.state === 'passive' ? ', ' + H.pick(H.T.routines) : ', ' + H.w('restless')}.`);
        }
      }
      txt = `${parts.join(' ')} ${enc[0].state === 'passive' ? 'They haven\'t noticed you. Grunts aren\'t hostile on sight — not until they are.' : 'Something has stirred them up.'}`;
    }
    const roster = enc.map((g) => H.CREATURES[g.key].name + (g.n > 1 ? ` ×${g.n}` : '')).join(', ');
    H.log(txt + ` <span class="dim">(${roster})</span>`);
    void C;
    if (k0 === 'looter' || enc.some((g) => g.key === 'looter')) H.log(`<span class="dim">A Looter's gear is visible — the bayou's way of asking whether it's worth waking the yard. ${H.ref('7.9')}</span>`, 'sys');
  },
  opts: (p) => {
    const m = H.S.mission,
      a = H.areaOf(p),
      h = H.S.hunter;
    const enc = a.enc;
    const k0 = enc[0].key;
    const C = H.CREATURES[k0];
    const wp = H.inHand();
    const pp = Math.max(...enc.map((g) => H.CREATURES[g.key].pp || 0));
    const dc = pp + Math.min(8, 2 * m.corr);
    const dis = m.corr >= 2;
    const o = [];
    const feat = a.feat === 'high' ? 'high' : a.feat === 'door' ? 'door' : null;
    const isObjTarget = enc.some((g) => g.target);
    const backScene = p.back || 'site';
    const passive = enc[0].state === 'passive';
    const sneakable = !C.blind && k0 !== 'hellhound' && k0 !== 'sineater' && k0 !== 'butcher';
    // open fire
    const range = k0 === 'hive' ? H.ri(18, 25) : k0 === 'waterdevil' ? 8 : k0 === 'sineater' ? 30 : H.ri(18, 30);
    o.push({ t: `Open fire from where you stand (about ${range} m).`, cls: 'danger', act: () => H.CB.fromArea(p, { dist: [range, range + 6], unseen: passive || k0 === 'hive' || k0 === 'immolator' || a.stalkSpotted }) });
    if (sneakable)
      o.push({ t: 'Creep in close for a stealth attack.', act: () => H.check({ title: 'Creep in close', skill: 'Stealth', dc, dis, note: dis ? 'The corruption here sharpens their senses (disadvantage).' : '', onDone: (r) => {
        if (r.success) {
          H.log('You get in close — close enough to smell them. Nothing has turned.');
          H.CB.fromArea(p, { dist: [2, 4], unseen: true });
        } else {
          H.log('A board creaks. A head turns.');
          H.CB.fromArea(p, { dist: [5, 9], unseen: false });
        }
      } }) });
    if (sneakable && !isObjTarget)
      o.push({ t: 'Slip past without a fight.', act: () => H.check({ title: 'Slip past', skill: 'Stealth', dc, dis, onDone: (r) => {
        if (r.success) {
          a.avoided = true;
          H.log('You ghost past. They never know you were there.');
          if (p.road) {
            m.road = null;
            H.go(backScene);
          } else H.go('area', { i: p.i });
        } else {
          H.log('You almost make it.');
          if (C.scream) H.sfx('scream');
          H.CB.fromArea(p, { dist: [6, 10], unseen: false });
        }
      } }) });
    if (passive && ['normal', 'rotted', 'looter'].includes(k0))
      o.push({ t: 'Throw something to draw them off.', act: () => H.check({ title: 'Draw them off', skill: 'Sleight of Hand', dc: 10 + Math.min(8, 2 * m.corr), onDone: (r) => {
        if (r.success) {
          a.avoided = true;
          H.log('A stone clatters off a tin roof across the yard. Heads turn. They shuffle off toward the sound.');
          if (p.road) { m.road = null; H.go(backScene); } else H.go('area', { i: p.i });
        } else {
          H.log('The stone lands short. They turn — not toward the sound. Toward you.');
          H.CB.fromArea(p, { dist: [12, 18], unseen: false });
        }
      } }) });
    if (feat === 'high' && (k0 === 'hellhound' || !passive))
      o.push({ t: 'Get up high before they reach you, and fight from there.', cls: 'good', act: () => {
        H.log(`You scramble up onto ${a.n === 'the yard' ? 'the abandoned wagon' : 'the high ground'} and turn. ${H.ref('4.9')}`);
        H.CB.fromArea(p, { dist: [15, 22], unseen: false, onHigh: true });
      } });
    if (feat === 'door' && !passive && k0 !== 'armored')
      o.push({ t: 'Back into the doorway so only one can reach you.', cls: 'good', act: () => H.CB.fromArea(p, { dist: [10, 16], unseen: false, inDoor: true }) });
    if (k0 === 'immolator') o.push({ t: 'Stand perfectly still and let it pass.', act: () => H.check({ title: 'Hold still', ability: 'WIS', dc: 10, onDone: (r) => {
      if (r.success) {
        a.avoided = true;
        H.log('You don\'t breathe. It twitches toward you, past you, and wanders off into the reeds, dripping fire.');
        if (isObjTarget) { a.avoided = false; H.log('<span class="dim">But it\'s the job. It\'ll come back.</span>'); }
        if (p.road) { m.road = null; H.go(backScene); } else H.go('area', { i: p.i });
      } else {
        H.log('Your foot shifts in the mud. Its head snaps around.');
        H.CB.fromArea(p, { dist: [8, 10], unseen: false });
      }
    } }) });
    o.push(H.wildOpt(p));
    o.push({ t: 'Back away quietly.', act: () => {
      if (p.road) {
        H.log('You give it a wide berth through the reeds.');
        m.road = null;
        return H.go(backScene);
      }
      H.go('site');
    } });
    void wp;
    return o;
  },
};

/* Start combat from an area encounter. */
H.CB.fromArea = (p, o) => {
  const m = H.S.mission,
    a = H.areaOf(p);
  const foes = [];
  for (const g of a.enc) {
    for (let i = 0; i < g.n; i++) {
      foes.push({
        key: g.key,
        dist: H.ri(o.dist[0], o.dist[1]) + (i % 3),
        state: g.key === 'sineater' ? 'passive' : g.state === 'passive' && o.unseen ? 'passive' : 'aggressive',
        loot: g.loot ? g.loot[i] : null,
        target: g.target,
        hp: g.hp ? g.hp[i] : null,
      });
    }
  }
  m.fledFrom = p.road ? 'road' : p.i;
  m.fightArea = p;
  H.startCombat({
    foes,
    terrain: a.feat === 'water' ? 'mixed' : H.CREATURES[foes[0].key].sineater ? 'mixed' : 'land',
    feature: a.feat === 'high' || a.feat === 'door' ? a.feat : null,
    featName: a.feat === 'high' ? (a.n === 'the yard' ? 'the abandoned wagon' : a.n === 'the bell tower' ? 'the bell-tower stair' : a.n === 'the blind' ? 'the hunting blind' : a.n === 'the loft' ? 'the loft ladder' : a.n === 'the stock pens' ? 'the pen rails' : 'the high ground') : a.feat === 'door' ? 'the doorway' : '',
    aware: !o.unseen,
    ambush: !!o.ambush,
    reserve: m.reserve,
    reserveKey: m.reserveKey,
    corr: m.corr,
    after: 'aftermath',
    afterP: p,
    fleeTo: p.road ? p.back || 'site' : 'site',
    title: a.n,
  });
  if (H.S.combat) {
    if (o.onHigh) H.S.combat.onHigh = true;
    if (o.inDoor) H.S.combat.inDoor = true;
    for (const e of H.S.combat.enemies) {
      const src = foes.find((f) => f.hp != null && f.key === e.key && !f.used);
      if (src) {
        e.hp = Math.min(e.max, src.hp);
        src.used = true;
      }
    }
  }
};

/* ---------------------------------------------------------------------

H.scenes.aftermath = {
  art: (p) => ({ kind: H.S.mission ? H.S.mission.art : 'road', seed: (H.S.mission ? H.S.mission.name : '') + 'after' + (p.road ? 'r' : p.i) }),

      a = H.areaOf(p),

    if (a && a.obj && H.S.job && H.S.job.type === 'Monster Trophy') {

    }

    if (H.S.job && H.S.job.special === 'sineater' && lf.hadSinEater && H.S.world.sinEater && !(lf.kills || []).includes('sineater') && !lf.fled) {
      // turned aside by fire: it forgets its Threat and wanders — Ashville is spared for now
      m.objDone = true;
      m.turnedAside = true;

      H.log('<span class="dim">It wanders off into the flood, directionless. It\'ll find its way again — but not soon.</span>', 'sys');
    }
  },
  opts: (p) => {
    const lf = H.S.lastFight || {};
    const o = [];
    for (const b of lf.bodies || []) {
      if (b.key !== 'looter' || !b.loot) continue;
      if (!b.looted)

      else if (b.left && b.left.length)
        for (const it of b.left.slice())
          o.push({ t: `Take the ${H.WEAPONS[it.key].name} after all.`, note: `(Weight ${H.WEAPONS[it.key].wt})`, dis: !H.canCarry(H.WEAPONS[it.key].wt) && 'No room — drop something first (sheet)', act: () => {
            const w = H.addWeapon(it.key, { whp: it.whp, tainted: true, loaded: it.loaded, lq: it.lq });
            if (w) {
              b.left.splice(b.left.indexOf(it), 1);
              H.log(`You sling the ${H.WEAPONS[it.key].name}. ☠ Tainted.`);
            }
            H.refresh();
          } });

    o.push({ t: 'Move on.', act: () => {
      if (p.road) {
        H.S.mission.road = null;
        return H.go(p.back || 'site');
      }
      H.go('area', { i: p.i });
    } });
    return o;
  },
};

H.lootBody = (b) => {
  const fire = b.killedType === 'fire';
  const r = H.d20(false, fire);
  const band = H.condBand(r.die);
  H.sfx('dice');
  H.log(`<span class="roll">🎲 Condition die: 1d20 (${H.diceText(r)}) — <b>${band.n}</b></span>${fire ? ' <span class="dim">(fire burns the prize — disadvantage)</span>' : ''} ${H.ref('7.9')}`, 'rollline');
  b.looted = true;
  b.left = [];
  const got = [];
  for (const it of b.loot.items) {
    if (it.t === 'ammo') {
      const q = Math.round(it.n * band.q);
      const n = H.addAmmo(it.type, it.n - q, q);
      got.push(`${it.n} ${it.type}${q ? ` (${q} questionable)` : ''}${n < it.n ? ` — only ${n} fit on your belt` : ''}`);
    } else if (it.t === 'hb') {
      H.gain(it.n);
      got.push(`${it.n} HB in loose coin`);
    } else if (it.t === 'item') {
      H.addItem(it.key, 1, it.key === 'key' || it.key === 'mug' || ['grinder', 'damper', 'waffle'].includes(it.key) ? { tainted: true } : { tainted: true });
      got.push(`${H.ITEMS[it.key].name.toLowerCase()} ☠`);
    } else if (it.t === 'weapon') {
      const W = H.WEAPONS[it.key];
      const whp = H.condWhp(band.n, W.whp);
      const loaded = it.rounds || 0;
      const lq = Math.round(loaded * band.q);
      const w = H.addWeapon(it.key, { whp, tainted: true, loaded, lq, strung: W.reload === 'xbow' && loaded > 0 });
      if (w) got.push(`a ${W.name} ☠ (Weapon HP ${whp}/${W.whp}${loaded ? `, ${loaded} loaded` : ''})`);
      else {
        b.left.push({ key: it.key, whp, loaded, lq });
        got.push(`a ${W.name} — <span class="bad">too heavy to carry with what you've got</span>`);
      }
    }
  }
  H.log(got.length ? `You go through its stolen gear: ${H.prose(got)}. <span class="dim">Everything but ammunition and coin is Tainted — it works, but no one will buy it until it's cleansed.</span>` : 'Nothing worth having. Rags and rot.');
  H.refresh();
};

    }

  },

      H.check({ title: 'Run him down', skill: 'Athletics', dc: 15, onDone: (r) => {
        if (r.success) done('alive', 'You catch him at the treeline and drag him down. He fights, then doesn\'t. Alive.');
        else {
          m.bounty.state = 'lost';
          H.log('He\'s faster than he looks, and he knows the ground. Gone into the reeds.');
          H.go('area', { i: m.cur });
        }
      } });
    return [
      { t: '"Easy. You can walk out with me, or you can stay out here with them." Talk him in.', act: () => H.check({ title: 'Talk him in', skill: 'Persuasion', dc: job.diff >= 2 ? 15 : 10, onDone: (r) => (r.success ? done('alive', 'He looks at the dark for a long time. Then he hands you the shotgun, stock first.') : (H.log('"Like hell." He bolts.'), runner())) }) },
      { t: 'Put your gun on him and make him believe you\'ll use it.', act: () => H.check({ title: 'Call him out', skill: 'Intimidation', dc: job.diff >= 2 ? 15 : 10, onDone: (r) => (r.success ? done('alive', 'He puts his hands up. They\'re shaking.') : (H.log('He goes for the reeds instead of the gun.'), runner())) }) },
      { t: 'Slip around behind him and take him before he can move.', act: () => H.check({ title: 'Take him unawares', skill: 'Stealth', dc: 13, onDone: (r) => (r.success ? done('alive', 'You\'re on him before he hears you. Rope, a gag, done.') : (H.log('A twig. He\'s up and running.'), runner())) }) },
      { t: 'Shoot him where he sits. Dead pays less, but dead doesn\'t run.', cls: 'danger', act: () => done('dead', 'It is short and ugly. You take the poster and the proof. Nobody out here will ever ask.') },
      { t: 'Walk away. Let him take his chances with the bayou.', act: () => { m.bounty.state = 'spared'; H.log('You leave him there. He doesn\'t thank you.'); H.go('area', { i: m.cur }); } },
    ];

};

/* ---------------------------------------------------------------------

H.scenes.travel_back = {
  art: () => ({ kind: 'road', seed: 'home-' + (H.S.mission ? H.S.mission.name : '') }),
  mood: 'uneasy',
  enter: (p) => {
    const S = H.S,
      job = S.job,
      m = S.mission;
    if (!job) return H.go('town');
    if (p && p.abandon) job.abandoned = true;
    if (p && p.won) {
      // back from the return-trip fight
    } else if (!m.homeward) {
      m.homeward = true;
      H.ui.divider();
      H.log(`You turn for home. ${H.weather().line}`);
      H.advance(job.travel);
      if (job.diff >= 2 && !job.abandoned && H.chance(m.noise > 0 ? 0.6 : 0.3)) {
        H.log('<span class="bad">Something noticed the gunfire.</span> It followed you.');
        m.road = { n: 'the road home', d: '', feat: H.pick([null, 'high']), enc: [H.isNight() && H.chance(0.5) ? { key: 'stalker', n: H.ri(2, 3), state: 'hunting' } : { key: m.reserveKey, n: H.ri(1, 3), state: 'aggressive' }], encDone: false, road: true };
        H.go('encounter', { road: true, back: 'travel_back' });

      }
      if (job.twist === 4 && !job.abandoned) {

      }

  opts: () => {
    const m = H.S.mission,
      job = H.S.job;
    if (m && m.badger && !m.badgerDone)

        { t: '"Not today." Stare him down.', act: () => H.check({ title: 'Face down the Badger', skill: 'Intimidation', dc: 15, onDone: (r) => { m.badgerDone = true; if (r.success) H.log('He laughs, shrugs, and melts back into the cane. Not worth it to him. Today.'); else { m.badgerCut = true; H.log('He doesn\'t laugh. You agree to the toll — a quarter of your pay — and he walks you to the road like a gentleman.'); } } }) },
        { t: 'Pay him his quarter.', act: () => { m.badgerDone = true; m.badgerCut = true; H.log('He tips his hat.'); H.refresh(); } },
      ];

  },
};

/* ---------------------------------------------------------------------
   Getting paid
   --------------------------------------------------------------------- */
H.scenes.job_report = {
  art: () => ({ kind: H.S.job && H.S.job.src === 'valley' ? 'office' : H.S.job && H.S.job.home === 'ashville' ? 'tavern' : 'town', seed: 'report' }),
  mood: 'town',
  enter: () => {
    const S = H.S,
      h = S.hunter,
      job = S.job,
      m = S.mission;
    S.where = job.home || 'wayfarer';
    H.ui.divider();
    const success = !job.abandoned && !job.failed && m && m.objDone && !(m.bounty && ['lost', 'spared'].includes(m.bounty.state));
    // burned-by-fire HP returns when the job is closed (§3.6)
    if (h.fireBurn) {
      h.fireBurn = 0;
      H.log('<span class="dim">The fire-burned part of you comes back now that the job is closed.</span> ' + H.ref('3.6'), 'sys');
    }
    if (success) {
      let pay = job.reward;
      const notes = [];
      if (job.twist === 1) {
        pay = Math.round(pay * H.ri(50, 70) / 100);
        notes.push('the giver pays short and won\'t meet your eye');
      }
      if (m.bounty && m.bounty.state === 'dead') {
        pay = Math.round(pay * 0.6);
        notes.push('dead pays less');
      }
      if (m.bounty && m.bountyGrunt) pay = Math.round(pay * 0.6);
      if (m.rival && m.rival.state === 'split') {
        pay = Math.round(pay / 2);
        notes.push('half goes to the rival');
      }
      if (m.badgerCut) {
        pay = Math.round(pay * 0.75);
        notes.push('the Badger took his quarter');
      }
      if (m.turnedAside) {
        pay = Math.round(pay * 0.5);
        notes.push('it isn\'t dead, only turned');
      }
      H.gain(pay);
      H.log(`<span class="good">Job done:</span> <b>${H.esc(job.name)}</b>. ${H.esc(H.cap(job.giver))} pays <b>${pay} HB</b>${notes.length ? ` (${notes.join('; ')})` : ''}. ${H.ref('9.3')}`, 'sys');
      // part-payment
      if (job.pay && !job.pay.advance) {
        if (job.pay.weapon) {
          const w = H.addWeapon(job.pay.weapon);
          H.log(w ? `Part of the pay is a ${H.WEAPONS[job.pay.weapon].name} (unloaded).` : `Part of the pay is a ${H.WEAPONS[job.pay.weapon].name} — but you can't carry it. You take ${Math.round(H.WEAPONS[job.pay.weapon].price / 2)} HB instead.`, 'sys');
          if (!w) H.gain(Math.round(H.WEAPONS[job.pay.weapon].price / 2));
        } else if (job.pay.item) {
          H.addItem(job.pay.item);
          H.log(`Part of the pay: a ${H.ITEMS[job.pay.item].name}.`, 'sys');
        } else if (job.pay.ammo) {
          const types = h.weapons.map((w) => H.WEAPONS[w.key].ammo).filter(Boolean);
          const t = types.length ? H.pick(types) : 'Compact-Small';
          const box = H.AMMO_BOX[t];
          const n = H.addAmmo(t, box.n);
          H.log(`Part of the pay: ${n} rounds of ${t}.`, 'sys');
        }
      }
      // hand over trophies, goods, notes
      h.items = h.items.filter((i) => !['trophy', 'cargo', 'notes'].includes(i.key));
      h.stats.jobs++;
      if (job.src === 'molly') H.mollyJobDone();
    } else {
      H.log(job.abandoned ? `You come back empty-handed from <b>${H.esc(job.name)}</b>. Nobody pays for a job left undone.` : job.failed ? `<b>${H.esc(job.name)}</b> — too late. It's over without you.` : `<b>${H.esc(job.name)}</b> isn't finished. No pay.`, 'sys');
      h.items = h.items.filter((i) => !['trophy', 'cargo', 'notes'].includes(i.key));
    }
    // Valley's trust milestones (NPC_VALLEY) — awarded by events, never by talk
    if (job.src === 'valley') H.valleyAfterJob(job, success);
    // Field-earned Story Point for something outrageous
    if (success && job.diff >= 3) H.awardSP('walking back alive from a job rated Hell');
    S.job = null;
    S.mission = null;
    S.lastFight = null;
    h.downtime = { left: 4, offered: true };
  },
  opts: () => {

   Wild options (§1.3) — brilliant, ridiculous or dangerous
   --------------------------------------------------------------------- */
H.wildOpt = (p) => {
  const S = H.S;
  const key = (S.scene ? S.scene.id : '') + (S.world ? S.world.day * 24 + S.world.hour : 0) + (p && p.i != null ? p.i : '');
  const R = H.seeded(key);
  const w = H.WILD[Math.floor(R() * H.WILD.length)];
  return {
    t: w.t,
    cls: 'wild',
    act: () => H.doWild(w, p),
  };
};
H.doWild = (w, p) => {
  const S = H.S,
    m = S.mission,
    h = S.hunter;
  const back = () => H.refresh();
  switch (w.k) {
    case 'noise':
    case 'whistle':
      H.log(w.k === 'whistle' ? 'You whistle. It carries a long way over the water. A long, long way.' : 'Your voice rolls out over the bayou. For a moment there is no sound at all. Then there is.');
      if (m) {
        m.noise += 2;
        const free = m.areas.map((a, i) => i).filter((i) => !m.areas[i].enc || m.areas[i].encDone);
        if (free.length && H.chance(0.6)) {
          const i = H.pick(free);
          m.areas[i].enc = [{ key: m.reserveKey, n: H.ri(1, 2), state: 'alerted' }];
          m.areas[i].encDone = false;
          m.areas[i].encSeen = false;
          m.areas[i].lastDesc = null;
          H.log(`<span class="bad">Something answers from ${m.areas[i].n}.</span>`);
        } else H.awardSP('singing a hymn to the dark and getting away with it');
      }
      return back();
    case 'scout':
      return H.check({ title: 'Climb and look', skill: 'Athletics', dc: 10, onDone: (r) => {
        if (r.success && m) {
          m.areas.forEach((a) => (a.scouted = true));
          H.log('From up high you see the whole place laid out — and where things are moving.');
          if (H.chance(0.3)) H.awardSP('reading the ground like an old hand');
        } else H.log('The branch gives. You come down a good deal faster than you went up. (1 damage)'), H.hurt(1);
      } });
    case 'taste':
      return H.check({ title: 'Keep it down', ability: 'CON', dc: 15, onDone: (r) => {
        if (r.success) {
          H.log('It tastes of iron and old pennies and something that remembers being alive. You keep it down. You feel, strangely, that the bayou knows you a little better now.');
          H.awardSP('drinking the black water and living');
        } else {
          const d = H.d(4);
          H.log(`You are sick in the reeds for some time. (${d} damage)`);
          if (H.hurt(d)) return H.hunterDies('poisoned by the black water, out of sheer curiosity');
        }
      } });
    case 'coin': {
      const heads = H.chance(0.5);
      H.log(`You flip a scrip-coin. ${heads ? 'Heads.' : 'Tails.'} ${heads ? 'Well. You did say.' : 'The bayou lets you off this once.'}`);
      if (heads && p && p.i != null && m && m.areas[p.i] && m.areas[p.i].enc && !m.areas[p.i].encDone) return H.CB.fromArea(p, { dist: [10, 16], unseen: true });
      return back();
    }
    case 'pray':
      H.log('The words come out wrong and cold in your mouth. Somewhere, a bell stops ringing. You do not feel better.');
      H.sfx('toll');
      return back();
    case 'mud':
      H.log('You smear yourself with swamp mud until you smell like the bayou. It is disgusting. It is probably useful.');
      h.muddy = true;
      return back();
    case 'listen':
      H.advance(0);
      H.log(H.pick(['You hear frogs, insects, the drip of water — and under it, somewhere, something breathing slow.', 'A bell, very far off. Then wings. Then nothing.', 'Footsteps that stop when you stop.']));
      return back();
    case 'carve':
      H.log(`You carve ${H.esc(h.name.split(' ')[0])} into the bark. It looks like a gravestone already.`);
      return back();
    case 'steady':
      H.log('A long drink. Your hands stop shaking. Mostly.');
      return back();
    case 'rock':
      H.log('The rock arcs out and splashes somewhere in the dark. Every frog stops. Then, after a long moment, they start again.');
      return back();
  }
  back();
};

H.beginHunter = (d) => {
  const S = H.S;
  const h = H.newHunter();
  S.hunter = h;
  S.phase = 'game';
  S.job = null;
  S.mission = null;
  S.combat = null;
  h.name = d.name;
  h.look = d.look;
  h.why = d.why;
  h.lang = d.lang;
  h.mode = d.mode;
  h.base = Object.assign({}, d.abil);
  h.boons = [d.boon];
  if (d.boon === 'weapon_training') {
    h.banes[d.wtBane] = false;
    h.wtClass = d.wtClass;
  }
  if (d.boon === 'skilled') h.skills = [d.sk1, d.sk2];
  h.stats.arrivedDay = S.world.day;
  H.ui.draft = null;
  H.ui.renderLog();

  if (d.mode === 'boat') {
    if (d.pkg === 'A') {
      const g = H.addWeapon('caldwell');
      g.loaded = 6;
      H.addWeapon('knife');
      H.addAmmo('Compact-Small', 30);
    } else {
      const g = H.addWeapon('romero');
      g.loaded = 1;
      H.addAmmo('Buckshot', 30);
    }
    H.addItem('medkit');
    h.wallet.hb = 20;
    S.world.hour = 6;
    H.ui.divider();
    H.log(`<span class="sys-h">The ledger reads:</span> <b>${H.esc(h.name)}</b>${h.look ? ' — ' + H.esc(h.look) : ''}${h.why ? ` <i>Reason given: “${H.esc(h.why)}”</i>` : ''}`, 'sys');
    H.INTRO_BOAT.forEach((para) => H.log(para, 'intro'));
    H.log('<span class="dim">The safety assumption: when you go somewhere risky without saying how, you\'re assumed to take ordinary precautions — you light the lantern before the cellar.</span>', 'sys');
    H.go('boat_dock');
  } else {
    // §3.2 Rise Up, Dead Man [PROPOSED]
    const kit = H.d(6);
    let main;
    if (kit <= 2) { main = H.addWeapon('romero'); H.addWeapon('knife'); }
    else if (kit <= 4) { main = H.addWeapon('winfield'); H.addWeapon('knife'); }
    else if (kit === 5) { main = H.addWeapon('caldwell'); H.addWeapon('dusters'); }
    else main = H.addWeapon('vetterli');
    const MW = H.WEAPONS[main.key];
    main.loaded = MW.cap;
    H.addAmmo(MW.ammo, H.d(6));
    h.hand = main.uid;
    h.wallet.hb = 0;
    S.world.hour = H.ri(19, 23);
    const sites = ['the bank of Stillwater Creek', "Salter's Pork yard", 'Goddard Dock', 'the fields of Golden Acres', 'the road to Lawson Station', "Maw Battery's outer wall"];
    const site = sites[H.d(6) - 1];
    H.ui.divider();
    H.INTRO_DEAD.forEach((para) => H.log(para, 'intro'));
    H.log(`<span class="sys-h">Kit (1d6 = ${kit}):</span> ${MW.name}${kit <= 4 ? ' and a knife' : kit === 5 ? ' and dusters' : ''}, one load and a few spare rounds. No Medkit. No money. ${H.ref('3.2')}`, 'sys');
    H.go('rise_start', { site, danger: H.d(6) });
  }
};

/* =====================================================================
   HUNT · 1896 — towns: Wayfarer's Rest and its people, the shops, the
   notice board, Valley's office, Ashville and the Tap-Tap, Downtime,
   and a clean plantation somewhere out in the bayou.
   ===================================================================== */
'use strict';

H.hubName = () => (H.S.where === 'ashville' ? 'ashville' : 'town');
H.backToHub = () => H.go(H.hubName());

/* ---------------------------------------------------------------------
   Wayfarer's Rest
   --------------------------------------------------------------------- */
H.T.townLines = {
  night: ['Lanterns gutter along the main street. A drunk is singing hymns to the river. Somewhere a dog barks itself hoarse at the tree line.', 'The town has pulled its shutters. Ward-marks glisten wet on every door. Out past the last lamp, the dark is very large.'],
  dawn: ['The dockside market is waking: crates, coffee, the stink of fish and tar. A boy runs past with a bundle of newspapers nobody will read.', 'Grey dawn. Mist off the water lies in the streets like spilled milk.'],
  day: ["Wayfarer's Rest leans and creaks around you — hunters, traders, a preacher on a crate shouting about the Lord of the Flies.", 'Mud to the ankle in the main street. Mercenaries sharpen blades on the Bloated Pig\'s porch and watch everyone who passes.'],
  dusk: ['The light goes copper and then grey. Shopkeepers are dragging their goods inside. Nobody wants to be out when the lamps go up.', 'Dusk. Somebody is chalking fresh ward-marks on the chapel steps.'],

H.scenes.town = {
  art: () => ({ kind: 'town', seed: 'wayfarer', caption: "Wayfarer's Rest" }),
  mood: 'town',

  },
  opts: () => {
    const S = H.S,
      h = S.hunter,

    o.push({ t: "Walk out to Valley's office.", note: open ? '(open 11–8)' : v.trust >= 6 ? '(you have a key)' : '(closed — open 11 to 8)', act: () => H.go('valley') });
    o.push({ hdr: 'Trade' });
    o.push({ t: 'Sammy Lox, Gunsmith.', note: shopsOpen ? '' : '(shut)', dis: !shopsOpen && 'Shut until morning', act: () => H.go('shop', { k: 'sammy' }) });
    o.push({ t: 'Johnny Bronco, Weapons.', dis: !shopsOpen && 'Shut until morning', act: () => H.go('shop', { k: 'johnny' }) });
    o.push({ t: "Bruce Maxwell's General Store.", dis: !shopsOpen && 'Shut until morning', act: () => H.go('shop', { k: 'bruce' }) });
    o.push({ t: 'The doctor.', act: () => H.go('doctor') });
    o.push({ t: 'The little chapel.', act: () => H.go('chapel') });
    o.push({ t: "Lady Annabelle's, seamstress.", dis: !shopsOpen && 'Shut until morning', act: () => H.go('annabelle') });
    o.push({ hdr: 'Elsewhere' });
    o.push({ t: 'The Bloated Pig — food, drink, a bed.', act: () => H.go('pig') });
    o.push({ t: 'The dock.', note: H.isNight() ? '(a skiff is tied up under the pilings)' : '', act: () => H.go('dock') });
    o.push({ t: 'Take the road to Ashville.', note: '(about 10 hours)', act: () => H.go('road_ashville', { to: 'ashville' }) });
